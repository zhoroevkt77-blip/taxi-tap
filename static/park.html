<body>
<div class="pkbg"></div><div class="wrap" id="app"><p class="muted">Жүктөлүүдө…</p></div>
<div id="sticker"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/qr.js"></script>
<script src="/static/qrshare.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = (u, b) => fetch(u, b ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b)} : {})
  .then(r => r.json()).catch(() => ({error:"net"}));
const fmt = n => Math.round(n || 0).toLocaleString("ru-RU").replace(/,/g, " ");
const dm = t => { const d = new Date(t * 1000); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0"); };
const dmy = t => dm(t) + "." + new Date(t * 1000).getFullYear();
const shareTerm = p => !p.share_until ? p.share + "%" : (Date.now() / 1000 < p.share_until
  ? `${p.share}% (${dmy(p.share_until)} чейин, андан кийин ${p.share_after}%)` : `${p.share_after}%`);
// Кийинки төлөмгө чейин канча калды (Бишкек убактысы = сервердин period_starts)
function payHead(s) {
  const t = s.pay_time, hm = x => { const [h, m] = x.split(":"); return h * 3600 + m * 60; };
  const now = Date.now() / 1000, mon = s.this_monday, a = mon + hm(t.from), b = mon + hm(t.to);
  const hhmm = u => new Date(u * 1000).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
  if (s.paid_this_week) return `<span class="ib2 w"><img src="/static/c_shield.webp?v=12" alt="">Ушул аптанын төлөмү берилди · ${dm(s.paid_this_week)}, ${hhmm(s.paid_this_week)}</span>`;
  if (now < b && now >= mon && s.due > 0) return now >= a ? `<span class="ib2 w"><img src="/static/n_earn.webp?v=12" alt="">Бүгүн төлөм күнү · саат ${t.from}–${t.to}</span>` : `<span class="ib2 w"><img src="/static/n_trips.webp?v=12" alt="">Бүгүн төлөм күнү · саат ${t.from}дөн баштап</span>`;
  const left = s.next_pay + hm(t.from) - now, d = Math.floor(left / 86400), h = Math.floor(left % 86400 / 3600);
  return `<span class="ib2 w"><img src="/static/n_trips.webp?v=12" alt="">Дүйшөмбү, ${dm(s.next_pay)} · саат ${t.from}–${t.to}</span><br><span class="ib2 w" style="color:#ffc61a"><img src="/static/c_trips.webp?v=12" alt="">Төлөмгө ${d ? d + " күн " : ""}${h} саат калды</span>`;
}
const f1 = n => (Math.round((n || 0) * 10) / 10).toLocaleString("ru-RU");
let ST = null, PER = "month";
const PN = {today:"Бүгүн", week:"Ушул жума", month:"Ушул ай", all:"Баары"};

async function boot() {
  const me = await api("/api/me");
  if (!me.auth) {
    $("#app").innerHTML = `<div class="hd"><div class="logo"><img src="/static/logo.png?v=2" alt="">Такси <b>ТАП!</b></div><span class="tag">ПАРК</span></div>
      <h1>Таксопарк кабинети</h1><p class="muted">Кирүү үчүн адегенде парктын ээсинин номери менен сайтка кириңиз.</p>
      <a class="btn" href="/?next=park" style="display:inline-block;text-decoration:none;margin-top:12px">Кирүү</a>`;
    return;
  }
  const id = new URLSearchParams(location.search).get("id");
  ST = await api("/api/park/state" + (id ? "?id=" + id : ""));
  if (ST.error) {
    $("#app").innerHTML = `<div class="hd"><div class="logo"><img src="/static/logo.png?v=2" alt="">Такси <b>ТАП!</b></div><span class="tag">ПАРК</span></div>
      <h1>Таксопарк кабинети</h1><p class="muted">Бул номерге парк катталган эмес. Паркыңызды кошуу үчүн Такси ТАП! админине кайрылыңыз.</p>
      <a class="btn g" href="/" style="display:inline-block;text-decoration:none;margin-top:12px">Башкы бетке</a>`;
    return;
  }
  draw();
}

const TPL = [["car", "c_car", "Унаага стикер"], ["shop", "c_addr", "Дүкөнгө плакат"], ["card", "c_card", "Визитка"]];
let TK = "car";
const IC = {print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>'};
function printTpl(k, p, link) {
  const hd = `<div class="ph"><img src="/static/logo.png?v=2" alt=""><b>ТАКСИ <span>ТАП!</span></b></div>`;
  const disc = p.promo_amount ? `<div class="pd">Биринчи сапарга −${p.promo_amount} сом</div>` : "";
  if (k === "card") return Array(8).fill(`<div class="pv"><div>${qrSvg(link, 150)}</div><div><b class="t">ТАКСИ <span>ТАП!</span></b>
      <div class="s">Бир басууда такси</div><div class="n">${esc(p.name)}</div><div class="s">код ${esc(p.code)}</div></div></div>`).join("");
  if (k === "shop") return `<div class="pp">${hd}<div class="pb"><p class="big1">Такси керекпи?</p><p>Телефондун камерасы менен сканерлеңиз — бир басууда чакырасыз</p>
      ${qrSvg(link, 420)}${disc}<p class="pm">код <b>${esc(p.code)}</b> · ${esc(ST.area || "")}</p></div><div class="pf">${esc(p.name)}</div></div>`;
  return Array(2).fill(`<div class="ps">${hd}<div class="pb"><p>Кийинки жолу телефондон чакырыңыз!</p>${qrSvg(link, 230)}${disc}
      <p class="pm">Камера менен сканерлеңиз · код <b>${esc(p.code)}</b></p></div><div class="pf">${esc(p.name)}</div></div>`).join("");
}
const ACT_ST = {sent:["Жооп күтүлүүдө", "w"], ok:["✅ Ырасталды", "o"], dispute:["❗ Пикир жөнөтүлдү", "d"]};
function actsCard() {
  const A = ST.acts || [];
  return `<div class="card"><h2 class="ih"><img src="/static/ic_id.webp?v=12" alt="">Акт салыштыруу</h2>
    ${A.length ? A.map(a => { const d = a.data, s = ACT_ST[a.status];
      return `<div class="act"><div class="ah"><b>${esc(a.label)}</b><span class="ast ${s[1]}">${s[0]}</span></div>
        <div class="ar"><span>Паркка тиешелүү акча</span><b>${fmt(d.due)} с</b></div><div class="ar"><span>Төлөндү</span><b>${fmt(d.paid)} с</b></div>
        <div class="ar"><span>Ай аягындагы калдык</span><b>${fmt(Math.abs(d.closing))} с${d.closing > 0 ? " · сизге карыз" : d.closing < 0 ? " · сиз карызсыз" : ""}</b></div>
        ${a.status === "dispute" ? `<div class="muted" style="margin-top:4px">Пикириңиз: ${esc(a.comment || "")}</div>` : ""}
        <div class="row"><a class="btn g" href="/act/${a.id}" target="_blank" style="text-decoration:none;text-align:center"><span class="ib2"><img src="/static/ic_id.webp?v=12" alt="">Ачуу / PDF</span></a>
          ${a.status !== "ok" ? `<button class="btn" data-aok="${a.id}"><span class="ib2"><img src="/static/c_shield.webp?v=12" alt="">Макулмун</span></button>` : ""}</div>
        ${a.status !== "ok" ? `<details class="adis"><summary>Пикирим бар</summary><textarea class="f" id="ac${a.id}" rows="3" placeholder="Эмнеси туура эмес? Мис.: 2 сапар эсептелбей калган"></textarea>

  el.innerHTML = `<div class="per dp">${Object.keys(DPN).map(k => `<button data-dp="${k}" class="${k === DPER ? "on" : ""}">${DPN[k]}</button>`).join("")}</div>
    <div class="tot"><div><b>${T.rides}</b><small>сапар</small></div><div><b>${fmt(T.gross)}</b><small>тапкан, сом</small></div><div><b>${fmt(T.share)}</b><small>паркка, сом</small></div></div>
    <div class="srt">Иреттөө:${Object.keys(SN).map(k => `<button data-ds="${k}" class="${k === DSORT ? "on" : ""}">${SN[k]}</button>`).join("")}</div>
    ${rows.length ? rows.map(r => `<div class="ds" data-du="${esc(r.uid)}"><div class="t"><span class="dot ${r.busy ? "busy" : r.online ? "on" : ""}"></span><b>${esc(r.name || r.phone)}</b>
        ${r.best && DPER !== "today" ? `<span class="flag b"><img class="mi" src="/static/ic_trophy.webp?v=12" alt="">мыкты</span>` : ""}${r.diag && (r.diag.bad || r.diag.warn) ? `<span class="flag ${r.diag.bad ? "dgb" : "dgw"}">🩺 ${r.diag.bad ? r.diag.bad + "❌" : ""}${r.diag.bad && r.diag.warn ? " " : ""}${r.diag.warn ? r.diag.warn + "⚠️" : ""}</span>` : ""}${r.idle_days >= 3 ? `<span class="flag i"><img class="mi" src="/static/ic_moon.webp?v=12" alt="">${r.idle_days} күн</span>` : ""}
        <button class="x" data-rm="${esc(r.uid)}" aria-label="Чыгаруу">✕</button></div>
      <small class="muted">${esc(r.car)} · ${esc(r.plate)} · <img class="mi" src="/static/ic_star.webp?v=12" alt="">${Number(r.rating ?? 5).toFixed(1)} · <img class="mi" src="/static/ic_bolt.webp?v=12" alt="">${r.activity}</small>
      <div class="m"><div><b>${r.rides}</b>сапар</div><div><b>${fmt(r.gross)}</b>сом</div><div><b>${r.online_sec ? hrs(r.online_sec) : "—"}</b>линияда</div>
        <div><b>${r.offers ? Math.round(100 * r.accepted / r.offers) + "%" : "—"}</b>алган${r.cancels ? ` · <span style="color:#b42318">✕${r.cancels}</span>` : ""}</div></div></div>`).join("")
      : `<p class="muted">Азырынча айдоочу жок.</p>`}
    <a class="btn g" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="/park/stats.csv?period=${DPER}${PQ}"><span class="ib2"><img src="/static/ic_dl.webp?v=12" alt="">Excel'ге жүктөө (${DPN[DPER]})</span></a>
    <p class="muted" style="font-size:11.5px;margin:6px 0 0">«Линияда» убакыты 17-ноябрдан баштап эсептелет. «Алган %» — келген сунуштардын канчасын кабыл алганы.</p>`;
  el.querySelectorAll("[data-dp]").forEach(b => b.onclick = () => { DPER = b.dataset.dp; loadStats(); });
  el.querySelectorAll("[data-ds]").forEach(b => b.onclick = () => { DSORT = b.dataset.ds; drawStats(); });
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = async e => { e.stopPropagation();
    if (!confirm("Айдоочуну парктан чыгарасызбы?")) return;
    await api("/api/park/remove_driver", {uid:b.dataset.rm}); loadStats(); refresh(); });
  el.querySelectorAll("[data-du]").forEach(b => b.onclick = () => openDriver(b.dataset.du));
}
async function openDriver(uid) {
  const d = await api("/api/park/driver?uid=" + encodeURIComponent(uid) + PQ);
  if (d.error) return;
  const WD = ["Дш", "Шй", "Шр", "Бш", "Жм", "Иш", "Жк"], mx = Math.max(1, ...d.days.map(x => x.gross));
  const o = document.createElement("div"); o.className = "sheet2";
  o.innerHTML = `<div><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:19px">${esc(d.name || d.phone)}</h2><button class="x" data-close>✕</button></div>
    <p class="muted" style="margin:4px 0">${esc(d.car)} · ${esc(d.plate)} · <img class="mi" src="/static/ic_star.webp?v=12" alt="">${Number(d.rating ?? 5).toFixed(1)} · <img class="mi" src="/static/ic_bolt.webp?v=12" alt="">${d.activity}</p>
    ${d.phone ? `<a class="btn call" href="tel:${esc(d.phone)}">📞 Чалуу</a>` : ""}
    ${d.diag && (d.diag.bad || d.diag.warn) ? `<div class="pdg"><b>🩺 Диагностика</b>${d.diag.items.map(([l, t]) => `<div class="${l}">${l === "bad" ? "❌" : "⚠️"} ${esc(t)}</div>`).join("")}</div>`
      : d.diag ? `<div class="pdg ok">🩺 Диагностика жайында ✓</div>` : ""}
    ${d.status === "active" ? `<button class="btn rd" id="dBlk" style="margin-top:8px;width:100%">🚫 Убактылуу бөгөттөө</button>` : ""}
    <h3 style="margin:14px 0 0;font-size:15px">Акыркы 7 күн</h3>
    <div class="bars">${d.days.map(x => `<div><em>${x.gross ? fmt(x.gross) : ""}</em><i style="height:${Math.round(80 * x.gross / mx)}%"></i>${WD[x.wd]}<br>${x.rides}</div>`).join("")}</div>
    <p class="muted" style="font-size:11.5px;margin:0">Мамычанын үстүндө — тапкан сом, астында — сапар саны.</p>
    ${d.praise.length ? `<h3 style="margin:14px 0 4px;font-size:15px">Жүргүнчүлөр мактаган</h3><p style="margin:0;font-size:13.5px">${d.praise.map(x => esc(x.t) + " ×" + x.n).join(" · ")}</p>` : ""}
    <h3 style="margin:14px 0 4px;font-size:15px">Акыркы сапарлар</h3>
    ${d.recent.length ? d.recent.map(r => `<div class="rr"><span>${dm(r.at)} ${new Date(r.at * 1000).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"})}</span><div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.to || r.from)}</div><b>${fmt(r.price)} с</b></div>`).join("") : `<p class="muted">Сапар жок.</p>`}</div>`;
  o.onclick = e => { if (e.target === o || e.target.dataset.close !== undefined) o.remove(); };
  const bk = o.querySelector("#dBlk"); if (bk) bk.onclick = async () => { if (!confirm("Бөгөттөйсүзбү? Айдоочу линияга чыга албай калат. Кийин өзүңүз ачсаңыз болот.")) return;
    const x = await api("/api/park/driver_action", {uid, action:"block"}); alert(x.result === "ok" ? "Бөгөттөлдү" : "Ката"); o.remove(); refresh(); };
  document.body.appendChild(o);
}
async function loadMap() {
  const x = await api("/api/park/map?_=1" + PQ);
  if (x.error) return;
  MST = x; drawMap();
}
function drawMap() {
  if (!window.L) { BOX.querySelector("#pmap").innerHTML = `<p class="muted" style="padding:20px">Карта жүктөлгөн жок.</p>`; return; }
  if (!PMAP) {
    PMAP = L.map(BOX.querySelector("#pmap"), {zoomControl:false, attributionControl:false}).setView([41.43, 72.6], 9);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19}).addTo(PMAP);
    PLAY = L.layerGroup().addTo(PMAP); PMAP._fit = false;
  }
  setTimeout(() => PMAP.invalidateSize(), 50);
  const C = MST.count, list = MST.drivers.filter(d => !MF || d.st === MF);
  BOX.querySelector("#mChips").innerHTML = [["free", STN.free], ["busy", STN.busy], ["off", STN.off]]
    .map(([k, t]) => `<button data-mf="${k}" class="${MF === k ? "on" : ""}">${t} ${C[k]}</button>`).join("");
  BOX.querySelectorAll("[data-mf]").forEach(b => b.onclick = () => { MF = MF === b.dataset.mf ? "" : b.dataset.mf; drawMap(); });
  PLAY.clearLayers();
  const pts = [];
  list.forEach(d => {
    const m = L.marker([d.lat, d.lon], {icon:L.divIcon({className:"", html:`<div class="pm ${d.st}"></div>`, iconSize:[16, 16], iconAnchor:[8, 8]})}).addTo(PLAY);
    m.bindPopup(popHtml(d)); m._uid = d.uid; pts.push([d.lat, d.lon]);
  });
  if (pts.length && !PMAP._fit) { PMAP.fitBounds(pts, {padding:[30, 30], maxZoom:14}); PMAP._fit = true; }
  BOX.querySelector("#mList").innerHTML = MF ? (list.length ? list.map(d => `<div class="dr" data-mu="${esc(d.uid)}"><span class="pm ${d.st}" style="width:12px;height:12px;border-width:2px"></span>
      <div class="i"><b>${esc(d.name || d.phone)}</b><small>${esc(d.plate)} · ${d.st === "busy" && d.trip ? esc(d.trip.from + " → " + d.trip.to) : d.st === "off" ? ago(d.seen) : "бош"}</small></div>
      <div class="n"><b>${d.today}</b> бүгүн</div></div>`).join("") : `<p class="muted">Бул тизме бош.</p>`) : "";
  BOX.querySelectorAll("[data-mu]").forEach(b => b.onclick = () => { const d = list.find(z => z.uid === b.dataset.mu);
    if (d) { PMAP.setView([d.lat, d.lon], 15); PLAY.eachLayer(m => { if (m._uid === d.uid) m.openPopup(); }); BOX.querySelector("#pmap").scrollIntoView({behavior:"smooth", block:"center"}); } });
}
function popHtml(d) {
  return `<b>${esc(d.name || d.phone)}</b><br>${esc(d.car)} · ${esc(d.plate)}<br>${STN[d.st]}${d.st === "busy" && d.trip ? " · " + esc(d.trip.from + " → " + d.trip.to) : ""}${d.st === "off" ? " · " + ago(d.seen) : ""}
    <br>Бүгүн: ${d.today} сапар · ${fmt(d.today_gross)} с${d.phone ? `<br><a href="tel:${esc(d.phone)}" style="font-weight:600">📞 Чалуу</a>` : ""}`;
}
async function refresh() { const id = new URLSearchParams(location.search).get("id"); ST = await api("/api/park/state" + (id ? "?id=" + id : "")); if (!ST.error) draw(); }
boot(); setInterval(refresh, 30000);
</script>
