<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>Таксопарк кабинети — Такси ТАП!</title>
<link rel="apple-touch-icon" href="/static/icon-192.png?v=4">
<link rel="stylesheet" href="/static/theme.css?v=69">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fff;color:#16161a;position:relative}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 40px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;background:none!important;box-shadow:none!important;border:0!important;padding:0!important}
.logo img{width:36px;height:36px;border-radius:10px}.logo b{color:#ffb703}
.tag{background:#16161a;color:#ffc61a;font-size:11px;font-weight:900;border-radius:8px;padding:4px 8px;letter-spacing:.5px}
h1{font-size:23px;font-weight:900;margin:8px 0 2px}
.muted{color:#6b6b76;font-size:14px}
.per{display:flex;gap:8px;margin:14px 0 10px;overflow-x:auto}
.per button{border:0;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-family:inherit;font-size:14px;box-shadow:0 3px 10px rgba(20,20,30,.06);cursor:pointer;white-space:nowrap}
.per button.on{background:linear-gradient(135deg,#ffd31a,#fcbc00)}
.big{background:#16161a;color:#fff;border-radius:24px;padding:18px;margin-bottom:12px}
.big .v{font-size:34px;font-weight:900;color:#ffc61a}
.big .s{color:#c9c9cf;font-size:13px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 4px 14px rgba(20,20,30,.06)}
.st span{display:block;color:#6b6b76;font-size:13px}.st b{font-size:20px;font-weight:900}.st i{display:block;font-style:normal;font-size:11.5px;line-height:1.3;color:#8a8a94;margin-top:4px}
.big .wk{display:flex;gap:14px;align-items:flex-end;margin:6px 0 8px}.big .wk>div:first-child{flex:1}.big .v2{font-size:22px;font-weight:900;color:#fff}
.how{background:#fff;border-radius:18px;padding:12px 16px;margin:12px 0;box-shadow:0 4px 14px rgba(20,20,30,.06)}.how summary{font-weight:800;cursor:pointer}.how p{margin:8px 0;font-size:14px;line-height:1.45;color:#333}
.card{background:#fff;border-radius:22px;padding:14px 16px;margin-top:14px;box-shadow:0 6px 18px rgba(20,20,30,.07)}
.card h2{font-size:18px;font-weight:900;margin:0 0 8px}.card{border-radius:20px}
.dr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.dr:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:#c9c9cf;flex:none}.dot.on{background:#1D9E75}.dot.busy{background:#ffb703}
.dr .i{flex:1;min-width:0}.dr b{display:block;font-size:15px}.dr small{color:#6b6b76;font-size:12.5px}
.dr .n{text-align:right;font-size:13px;color:#3a3a44;white-space:nowrap}.dr .n b{font-size:15px}
.x{border:0;background:#f1f1f4;border-radius:10px;width:30px;height:30px;cursor:pointer;font-size:13px}
.row{display:flex;gap:8px;margin-top:10px}
input.f{flex:1;border:1.5px solid #e3e3e8;border-radius:14px;padding:12px;font-size:16px;font-family:inherit;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:900;font-size:15px;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#ffd31a,#fcbc00);color:#16161a}
.btn.g{background:#f1f1f4}
.qr{display:flex;gap:14px;align-items:center}
.qr #qr{width:140px;height:140px;flex:none;background:#f6f6f8;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.qr #qr img,.qr #qr svg{width:132px;height:132px}
.code{font-size:26px;font-weight:900;letter-spacing:1px}
.err{color:#b42318;font-size:13px;margin-top:6px}.ok{color:#16764f;font-size:13px;margin-top:6px}
.note{background:#fff8e6;border-radius:14px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.pay{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f3;font-size:14px}
#sticker{display:none}
@media print{body *{visibility:hidden}#sticker,#sticker *{visibility:visible}#sticker{display:block;position:absolute;left:0;top:0;width:100%}}
.ih{display:flex;align-items:center;gap:10px}.ih img{width:52px;height:38px;border-radius:19px;object-fit:cover;background:#f0f0f3}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st3 div{background:#fffaf0;border-radius:14px;padding:8px;text-align:center}.st3 b{display:block;font-size:20px;font-weight:900}.st3 small{font-size:11px;color:#6b6b76}
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tpl button{border:2px solid #eee;background:#fff;border-radius:14px;padding:8px 4px;font:800 12px Inter,system-ui,sans-serif;cursor:pointer;color:#16161a}
.tpl button.on{border-color:#ffb703;background:#fffaf0}.tpl img{display:block;width:64px;height:46px;border-radius:23px;object-fit:cover;margin:0 auto 4px;background:#f0f0f3}
.btn.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.ib svg{width:18px;height:18px}
#sticker{font-family:Inter,system-ui,sans-serif;color:#16161a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#sticker .ph{background:linear-gradient(135deg,#ffd31a,#fcbc00);padding:4mm 5mm;display:flex;align-items:center;gap:3mm}
#sticker .ph img{width:12mm;height:12mm;border-radius:3mm}#sticker .ph b{font-size:20pt;font-weight:900}#sticker .ph span{color:#fff}
#sticker .pb{padding:4mm 5mm;text-align:center}#sticker .pb p{margin:2mm 0;font-weight:800;font-size:12pt}#sticker .pb .pm{font-size:9pt;font-weight:600;color:#555}
#sticker .pf{background:#16161a;color:#ffc61a;text-align:center;font-weight:900;padding:2.5mm;font-size:11pt}
#sticker .pd{display:inline-block;background:#ffc61a;border-radius:2mm;padding:1mm 3mm;font-weight:900;font-size:12pt;margin-top:2mm}
#sticker .ps{width:95mm;border:1px solid #ddd;border-radius:6mm;overflow:hidden;margin:6mm auto;break-inside:avoid}
#sticker .ps svg{width:58mm;height:58mm}
#sticker .pp{width:180mm;border:1px solid #ddd;border-radius:8mm;overflow:hidden;margin:6mm auto}
#sticker .pp .ph b{font-size:34pt}#sticker .pp .big1{font-size:30pt}#sticker .pp p{font-size:15pt}#sticker .pp svg{width:110mm;height:110mm}
#sticker .pv{display:inline-flex;align-items:center;gap:3mm;width:85mm;height:55mm;border:1px dashed #bbb;padding:4mm;box-sizing:border-box;vertical-align:top;margin:1mm}
#sticker .pv svg{width:36mm;height:36mm}#sticker .pv .t{font-size:15pt;font-weight:900}#sticker .pv .t span{color:#e9a100}
#sticker .pv .s{font-size:9pt;color:#555}#sticker .pv .n{font-weight:800;font-size:11pt;margin-top:2mm}
</style>
</head>
<body>
<div class="pkbg"></div><div class="wrap" id="app"><p class="muted">Жүктөлүүдө…</p></div>
<div id="sticker"></div>
<script src="/static/qr.js"></script>
<script src="/static/qrshare.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = (u, b) => fetch(u, b ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b)} : {})
  .then(r => r.json()).catch(() => ({error:"net"}));
const fmt = n => Math.round(n || 0).toLocaleString("ru-RU").replace(/,/g, " ");
const dm = t => { const d = new Date(t * 1000); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0"); };
// Кийинки төлөмгө чейин канча калды (Бишкек убактысы = сервердин period_starts)
function payHead(s) {
  const t = s.pay_time, hm = x => { const [h, m] = x.split(":"); return h * 3600 + m * 60; };
  const now = Date.now() / 1000, mon = s.this_monday, a = mon + hm(t.from), b = mon + hm(t.to);
  const hhmm = u => new Date(u * 1000).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
  if (s.paid_this_week) return `✅ Ушул аптанын төлөмү берилди · ${dm(s.paid_this_week)}, ${hhmm(s.paid_this_week)}`;
  if (now < b && now >= mon && s.due > 0) return now >= a ? `💸 Бүгүн төлөм күнү · саат ${t.from}–${t.to}` : `📅 Бүгүн төлөм күнү · саат ${t.from}дөн баштап`;
  const left = s.next_pay + hm(t.from) - now, d = Math.floor(left / 86400), h = Math.floor(left % 86400 / 3600);
  return `📅 Дүйшөмбү, ${dm(s.next_pay)} · саат ${t.from}–${t.to}<br><span style="color:#ffc61a">⏳ Төлөмгө ${d ? d + " күн " : ""}${h} саат калды</span>`;
}
const f1 = n => (Math.round((n || 0) * 10) / 10).toLocaleString("ru-RU");
let ST = null, PER = "month";
const PN = {today:"Бүгүн", week:"Ушул жума", month:"Ушул ай", all:"Баары"};

async function boot() {
  const me = await api("/api/me");
  if (!me.auth) {
    $("#app").innerHTML = `<div class="hd"><div class="logo"><img src="/static/logo.png?v=2" alt="">Такси <b>ТАП!</b></div><span class="tag">ПАРК</span></div>
      <h1>Таксопарк кабинети</h1><p class="muted">Кирүү үчүн адегенде парктын ээсинин номери менен сайтка кириңиз.</p>
      <a class="btn" href="/?next=park" style="display:inline-block;text-decoration:none;margin-top:12px">Кирүү</a>`;
    return;
  }
  const id = new URLSearchParams(location.search).get("id");
  ST = await api("/api/park/state" + (id ? "?id=" + id : ""));
  if (ST.error) {
    $("#app").innerHTML = `<div class="hd"><div class="logo"><img src="/static/logo.png?v=2" alt="">Такси <b>ТАП!</b></div><span class="tag">ПАРК</span></div>
      <h1>Таксопарк кабинети</h1><p class="muted">Бул номерге парк катталган эмес. Паркыңызды кошуу үчүн Такси ТАП! админине кайрылыңыз.</p>
      <a class="btn g" href="/" style="display:inline-block;text-decoration:none;margin-top:12px">Башкы бетке</a>`;
    return;
  }
  draw();
}

const TPL = [["car", "c_car", "Унаага стикер"], ["shop", "c_addr", "Дүкөнгө плакат"], ["card", "c_card", "Визитка"]];
let TK = "car";
const IC = {print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>'};
function printTpl(k, p, link) {
  const hd = `<div class="ph"><img src="/static/logo.png?v=2" alt=""><b>ТАКСИ <span>ТАП!</span></b></div>`;
  const disc = p.promo_amount ? `<div class="pd">Биринчи сапарга −${p.promo_amount} сом</div>` : "";
  if (k === "card") return Array(8).fill(`<div class="pv"><div>${qrSvg(link, 150)}</div><div><b class="t">ТАКСИ <span>ТАП!</span></b>
      <div class="s">Бир басууда такси</div><div class="n">${esc(p.name)}</div><div class="s">код ${esc(p.code)}</div></div></div>`).join("");
  if (k === "shop") return `<div class="pp">${hd}<div class="pb"><p class="big1">Такси керекпи?</p><p>Телефондун камерасы менен сканерлеңиз — бир басууда чакырасыз</p>
      ${qrSvg(link, 420)}${disc}<p class="pm">код <b>${esc(p.code)}</b> · ${esc(ST.area || "")}</p></div><div class="pf">${esc(p.name)}</div></div>`;
  return Array(2).fill(`<div class="ps">${hd}<div class="pb"><p>Кийинки жолу телефондон чакырыңыз!</p>${qrSvg(link, 230)}${disc}
      <p class="pm">Камера менен сканерлеңиз · код <b>${esc(p.code)}</b></p></div><div class="pf">${esc(p.name)}</div></div>`).join("");
}
function draw() {
  const p = ST.park, s = ST.stats, P = s.periods[PER];
  const link = (ST.site || location.origin) + "/p/" + (p.code || "");
  $("#app").innerHTML = `<div class="hd"><div class="logo"><img src="/static/logo.png?v=2" alt="">Такси <b>ТАП!</b></div><span class="tag">ПАРК</span></div>
    <h1>🏢 ${esc(p.name)}</h1><p class="muted">Айдоочулар: ${s.drivers_total} · линияда: <b style="color:#1D9E75">${s.drivers_online}</b></p>
    <div class="per">${Object.keys(PN).map(k => `<button data-p="${k}" class="${k === PER ? "on" : ""}">${PN[k]}</button>`).join("")}</div>
    <div class="big"><div class="s">${payHead(s)}</div>
      <div class="wk"><div><div class="s">Бул дүйшөмбүдө төлөнөт</div><div class="v">${fmt(s.due)} сом</div></div>
        <div><div class="s">Ушул апта топтолууда</div><div class="v2">${fmt(s.this_week)} с</div></div></div>
      <div class="s">Ар дүйшөмбүдө, саат ${s.pay_time.from}–${s.pay_time.to} аралыгында өткөн аптада тапканыңыз төлөнөт · ✅ бардыгы төлөнгөн: <b style="color:#fff">${fmt(s.paid)} с</b></div></div>
    <div class="card"><h2>✅ Төлөнгөн акчалар</h2>
      ${ST.payouts.length ? ST.payouts.map(x => `<div class="pay"><span><b>${new Date(x.at * 1000).toLocaleDateString("ru-RU")}, ${new Date(x.at * 1000).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"})}</b>${x.note ? "<br><small>" + esc(x.note) + "</small>" : ""}</span><b style="color:#16764f">+${fmt(x.amount)} с</b></div>`).join("")
        + `<div class="pay" style="border:0"><span>Бардыгы</span><b>${fmt(s.paid)} с</b></div>`
        : `<p class="muted">Азырынча төлөм болгон жок. Биринчи төлөм — дүйшөмбү, ${dm(s.next_pay)}, саат ${s.pay_time.from}–${s.pay_time.to}.</p>`}</div>
    <div class="grid">
      <div class="st"><span>Сапарлар</span><b>${P.rides}</b><i>Парктын айдоочулары бүтүргөн сапарлар</i></div>
      <div class="st"><span>Жүгүртүү</span><b>${fmt(P.gross)} с</b><i>Ошол сапарлар үчүн жүргүнчүлөр төлөгөн жалпы акча</i></div>
      <div class="st"><span>Комиссиядан үлүш (${p.share}%)</span><b>${fmt(P.share)} с</b><i>Такси ТАП! айдоочулардан алган комиссиянын ${p.share}% сизге</i></div>
      <div class="st"><span>Жаңы жүргүнчүлөр</span><b>${P.refs} <small style="font-size:13px;color:#6b6b76">(${P.refs_active} сапарда)</small></b><i>QR же промокод менен келгендер · кашаада: биринчи сапарын бүтүргөндөр</i></div>
      <div class="st"><span>Жүргүнчү бонусу</span><b>${fmt(P.bonus)} с</b><i>Ар бир жаңы жүргүнчүнүн биринчи сапары үчүн ${fmt(p.ref_bonus)} сом</i></div>
      <div class="st"><span>${PN[PER]} тапкан</span><b style="color:#16764f">${fmt(P.earned)} с</b><i>Комиссиядан үлүш + жүргүнчү бонусу</i></div>
    </div>
    <details class="how"><summary>❓ Кантип эсептелет? Мисал</summary>
      <p>Сиздин айдоочу 100 сомдук сапар бүтүрдү дейли:</p>
      <p>• <b>Жүгүртүүгө</b> 100 сом кошулат.</p>
      <p>• Такси ТАП! айдоочудан комиссия алат${ST.commission_pct > 0 ? ` (азыр ${ST.commission_pct}%) — ${f1(ST.commission_pct)} сом` : " (мисалы 10% — 10 сом)"}.
        Анын <b>${p.share}%</b> сизге: ${f1(100 * (ST.commission_pct > 0 ? ST.commission_pct : 10) / 100 * p.share / 100)} сом.</p>
      <p>• Эгер ал жүргүнчү сиздин QR же <b>${esc(p.promo || "промокод")}</b> аркылуу келип, бул анын биринчи сапары болсо — дагы <b>${fmt(p.ref_bonus)} сом</b> бонус. Бонус бир жүргүнчү үчүн бир жолу гана, ал катталгандан кийин 30 күндүн ичинде сапар бүтүрсө берилет.</p>
      <p>• Аптада (дүйшөмбүдөн жекшембиге чейин) тапканыңыз кийинки дүйшөмбүдө төлөнөт жана «✅ Төлөнгөн акчалар» тизмесине түшөт. Төлөнгөндө Telegram'га кабар келет.</p></details>
    ${ST.commission_pct > 0 ? "" : `<div class="note">ℹ️ Азыр пилот: Такси ТАП! комиссия албайт (0%), ошондуктан комиссиядан үлүш 0. Жүргүнчү бонустары эсептеле берет.</div>`}
    <div class="card"><h2>🚕 Айдоочулар</h2>
      ${ST.drivers.length ? ST.drivers.map(d => `<div class="dr"><span class="dot ${d.busy ? "busy" : d.online ? "on" : ""}"></span>
        <div class="i"><b>${esc(d.name || d.phone)}</b><small>${esc(d.car)} · ${esc(d.plate)} · ★${Number(d.rating ?? 5).toFixed(1)} · ⚡${d.activity}${d.status !== "active" ? " · " + esc(d.status) : ""}</small></div>
        <div class="n"><b>${d.today}</b> бүгүн<br>${d.week_rides} · ${fmt(d.week_gross)} с/жума</div>
        <button class="x" data-rm="${esc(d.uid)}" aria-label="Чыгаруу">✕</button></div>`).join("")
        : `<p class="muted">Азырынча айдоочу жок. Айдоочу адегенде сайтта «Айдоочу болуу» аркылуу катталып, текшерүүдөн өтүшү керек, андан кийин аны бул жерге номери менен кошосуз.</p>`}
      <div class="row"><input class="f" id="dph" placeholder="Айдоочунун номери: 0700 123 456" inputmode="tel"><button class="btn" id="dadd">Кошуу</button></div>
      <div id="dmsg"></div></div>
    <div class="card"><h2 class="ih"><img src="/static/c_gift.webp?v=8" alt="">Жүргүнчүлөрдү тартуу</h2>
      <div class="qr"><div id="qr"></div><div><div class="muted">Паркыңыздын коду</div><div class="code">${esc(p.code)}</div>
        <div class="muted" style="margin-top:4px">Жаңы жүргүнчү ушул QR менен келип, биринчи сапарын бүтүрсө — сизге <b>${fmt(p.ref_bonus)} сом</b>.${p.promo_amount ? ` Ага биринчи сапарга <b>−${p.promo_amount} сом</b>.` : ""}</div></div></div>
      <div class="st3"><div><b>${ST.qr.scans}</b><small>сканерленди</small></div><div><b>${ST.qr.joined}</b><small>катталды</small></div><div><b>${ST.qr.rode}</b><small>сапар бүтүрдү</small></div></div>
      <div class="muted" style="margin:12px 0 6px">Басып чыгаруу үлгүсү</div>
      <div class="tpl">${TPL.map(([k, im, t]) => `<button data-t="${k}" class="${k === TK ? "on" : ""}"><img src="/static/${im}.webp?v=8" alt="">${t}</button>`).join("")}</div>
      <div class="row"><button class="btn ib" id="print">${IC.print}Басып чыгаруу</button><button class="btn g ib" id="share">${IC.share}Бөлүшүү</button></div>
      <p class="muted" style="margin-top:8px;word-break:break-all">${esc(link)}</p>
      <p class="muted" style="font-size:12.5px">Ар бир айдоочуңуздун да өзүнүн QR'ы бар (айдоочунун кабинетинде) — ким канча жүргүнчү тартканы көрүнөт.</p>
    </div>
    <div class="note">Шарт: парктын айдоочулары төлөгөн комиссиянын <b>${p.share}%</b>ы + ар бир жаңы жүргүнчү үчүн <b>${fmt(p.ref_bonus)} сом</b>. Такси ТАП! комиссиясы азыр: ${ST.commission_pct}%. Төлөм — ар дүйшөмбүдө, саат ${s.pay_time.from}–${s.pay_time.to}.</div>`;
  document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { PER = b.dataset.p; draw(); });
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm("Айдоочуну парктан чыгарасызбы?")) return;
    await api("/api/park/remove_driver", {uid:b.dataset.rm}); refresh(); });
  $("#dadd").onclick = async () => {
    const x = await api("/api/park/add_driver", {phone:$("#dph").value});
    const M = {ok:"✓ Айдоочу кошулду", no_driver:"Бул номер менен катталган айдоочу жок", other_park:"Бул айдоочу башка паркта"};
    $("#dmsg").className = x.result === "ok" ? "ok" : "err"; $("#dmsg").textContent = M[x.result] || "Ката";
    if (x.result === "ok") setTimeout(refresh, 600);
  };
  if (window.qrSvg) $("#qr").innerHTML = qrSvg(link, 132);
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { TK = b.dataset.t; draw(); });
  $("#share").onclick = () => QRS.share({link, title:"Такси ТАП!",
    text:`🚕 Такси ТАП! — ${ST.area ? ST.area + ": " : ""}бир басууда такси.${p.promo_amount ? `\nБиринчи сапарга −${p.promo_amount} сом!` : ""}\n«${p.name}» 👇`});
  $("#print").onclick = () => { $("#sticker").innerHTML = printTpl(TK, p, link); setTimeout(() => window.print(), 150); };
}
async function refresh() { const id = new URLSearchParams(location.search).get("id"); ST = await api("/api/park/state" + (id ? "?id=" + id : "")); if (!ST.error) draw(); }
boot(); setInterval(refresh, 30000);
</script>
</body>
</html>
