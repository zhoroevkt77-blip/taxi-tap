<!DOCTYPE html>
<html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта стилдери — салыштыруу</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#f4f4f6;color:#16161a}
h1{font-size:18px;margin:14px 14px 4px}p{margin:0 14px 10px;color:#666}
.card{margin:0 12px 16px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card b{display:block;padding:10px 14px;font-size:16px}.card b span{font-weight:500;color:#777;font-size:13px}
.m{height:300px}
.pin{width:18px;height:18px;border-radius:50%;background:#16161a;border:3px solid #ffc21a;box-shadow:0 1px 4px rgba(0,0,0,.4)}
</style></head><body>
<h1>Карта стилдери — салыштыруу</h1>
<p>Үчөө тең акысыз. Бир картаны жылдырсаңыз, калгандары да ошол жерге жылат.</p>
<div class="card"><b>1. Азыркы (OpenStreetMap) <span>— кадимки</span></b><div class="m" id="m1"></div></div>
<div class="card"><b>2. CARTO Voyager <span>— Google'га окшош, жумшак түстөр</span></b><div class="m" id="m2"></div></div>
<div class="card"><b>3. CARTO Light <span>— ак, минималдуу</span></b><div class="m" id="m3"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const C = [40.9330, 73.0110], Z = 15;
const T = [
  ["https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", "© OpenStreetMap"],
  ["https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", "© OpenStreetMap © CARTO"],
  ["https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", "© OpenStreetMap © CARTO"]];
const maps = T.map(([u, a], i) => {
  const m = L.map("m" + (i + 1), {zoomControl:false}).setView(C, Z);
  L.tileLayer(u, {maxZoom:19, attribution:a, subdomains:"abcd"}).addTo(m);
  L.marker(C, {icon:L.divIcon({className:"", html:'<div class="pin"></div>', iconSize:[24, 24], iconAnchor:[12, 12]})}).addTo(m);
  return m;
});
let busy = false;
maps.forEach(m => m.on("move", () => { if (busy) return; busy = true;
  maps.forEach(o => o !== m && o.setView(m.getCenter(), m.getZoom(), {animate:false})); busy = false; }));
</script></body></html>
