<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {credentials:"same-origin"} :
    {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json();
};
const map = L.map("map", {zoomControl:false}).setView([41.0377, 72.7470], 14);
setupArea(map, {zoom:14, bounds:false});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
const icon = (cls, t) => L.divIcon({className:"", html:`<div class="carm ${cls}">${t}</div>`, iconSize:[30,30], iconAnchor:[15,15]});
const layer = L.layerGroup().addTo(map);
let me = null, myHead = null, mySpeed = 0, myPos = null, D = null, poll = null, watch = null, lock = null, lastOffer = null, lastRide = null, pingT = null;

NAV.init(map, {onFix: (ll, h, sp, acc) => { myAcc = acc; myPos = ll; myHead = h; mySpeed = sp; myAt = Date.now(); drawMe(); nearCheck(); },   // линияда эмес кезде да жаңы жер
  single: true,
  // ➤: ээрчибей турса — машинага кайтат; ээрчип турса — «Жол өйдө» күйөт (ошол жерде компас чыгат)
  onLocate: () => getPos().then(p => { if (FOLLOW && !HUP) { HUP = true; try { localStorage.setItem("hup", "1"); } catch (e) {} toast("🧭 Жол өйдө", 1500); }
    FOLLOW = true; const b = $("#navLoc"); b && b.classList.remove("off");
  if (p) { NAV.set(myPos, myHead, mySpeed); if (map.getZoom() < 16) map.setZoom(16, {animate:false}); hupSync(); followMe(true); } }),
  onComp: () => { HUP = false; try { localStorage.setItem("hup", "0"); } catch (e) {}
    if (HUP) { FOLLOW = true; const b = $("#navLoc"); b && b.classList.remove("off"); }
    hupSync(); followMe(true); toast(HUP ? "🧭 Жол өйдө — карта машинанын жүрүшүнө карай айланат" : "🧭 Түндүк өйдө — карта айланбайт", 2200); }});
// ---------- «Жол өйдө»: стрелка дайыма өйдө, карта машина бараткан тарапка айланат ----------
// Карта блогу экрандан чоңураак (диагоналы боюнча) жасалып, машинанын чекитинин тегерегинде CSS менен айланат.
let HUP = (() => { try { return localStorage.getItem("hup") !== "0"; } catch (e) { return true; } })(), hupOn = false, hupAng = 0, hupHead = null;
const mapEl = document.getElementById("map");
function hupLayout(on) {
  const c = map.getCenter ? map.getCenter() : null, z = map.getZoom();      // өлчөм өзгөргөндө борбор ордунда калсын
  if (!on) { mapEl.removeAttribute("style"); mapEl.classList.remove("hup"); }
  else {
    const W = innerWidth, H = innerHeight, cx = W / 2, cy = Math.round(H * 0.6);
    const S = Math.ceil(2 * Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy))) + 20;
    mapEl.style.cssText = `inset:auto;width:${S}px;height:${S}px;left:${cx - S / 2}px;top:${cy - S / 2}px;transform:rotate(${hupAng}deg)`;
    mapEl.classList.add("hup");
  }
  map.invalidateSize && map.invalidateSize(false);
  if (c && map.setView) map.setView(c, z, {animate:false});
}
function hupSync() {                                         // режим күйүк жана карта машинаны ээрчиши керек болсо — айлантабыз
  const want = HUP && FOLLOW && !!myPos;
  if (want !== hupOn) { hupOn = want; hupAng = 0; hupHead = null; hupLayout(want); }   // жаңыдан күйгөндө — машина жүрө баштаганча түндүк өйдө

  const line = L.polyline([from, to], {color:"#17365C", weight:4, dashArray:"6 8", opacity:.8}).addTo(tapLayer);
  const rt = await api(`/api/route?a=${from[0]},${from[1]}&b=${to[0]},${to[1]}`);
  if (my !== tapSeq || !tapLayer) return;
  if (rt.coords && rt.coords.length > 2) { line.remove(); L.polyline(rt.coords, {color:"#17365C", weight:5, opacity:.85}).addTo(tapLayer); }
  const el = $("#tapInfo"); if (el) el.textContent = rt.km != null ? `📍 ${String(rt.km).replace(".", ",")} км · ~${rt.min} мүн` : "📍 Маршрут табылган жок";

// Манжаны картада ~0,6 сек кармап турса (кыймылдатпай) — ошол жерге маршрут. Жөн тийүү/жылдыруу эч нерсе кылбайт.
// Android'де узун басуу «contextmenu» чыгарып, touchcancel жиберет — ошону да кармайбыз.
(() => {
  const el = mapEl; let t = null, x0 = 0, y0 = 0, ring = null, armed = false, fired = 0;
  const clear = () => { clearTimeout(t); t = null; if (ring) { ring.remove(); ring = null; } };
  const fire = () => {
    if (!armed || Date.now() - fired < 800) return; armed = false; fired = Date.now(); clear();
    const r = mapEl.getBoundingClientRect();
    tapRoute(tapLatLng({originalEvent:{clientX:x0, clientY:y0}, latlng:map.containerPointToLatLng([x0 - r.left, y0 - r.top])}));
  };
  const down = (x, y) => {
    clear(); armed = false;
    if (!D || D.ride || document.querySelector(".areachip")) return;
    x0 = x; y0 = y; armed = true;
    ring = document.createElement("div"); ring.className = "holdring"; ring.style.left = x0 + "px"; ring.style.top = y0 + "px"; document.body.appendChild(ring);
    t = setTimeout(fire, 600);
  };
  const move = (x, y) => { if (armed && (Math.abs(x - x0) > 18 || Math.abs(y - y0) > 18)) { armed = false; clear(); } };
  const up = () => { if (t) { armed = false; clear(); } };
  el.addEventListener("touchstart", e => { if (e.touches.length === 1) down(e.touches[0].clientX, e.touches[0].clientY); else { armed = false; clear(); } }, {passive:true, capture:true});
  el.addEventListener("touchmove", e => move(e.touches[0].clientX, e.touches[0].clientY), {passive:true, capture:true});
  el.addEventListener("touchend", up, {passive:true, capture:true});
  el.addEventListener("touchcancel", () => { if (t) { clearTimeout(t); t = setTimeout(fire, 300); } }, {passive:true, capture:true});   // узун басуу — cancel келсе да аткарабыз
  el.addEventListener("contextmenu", e => { e.preventDefault();
    if (armed) return fire();
    if (!("ontouchstart" in window) && D && !D.ride) { x0 = e.clientX; y0 = e.clientY; armed = true; fire(); } }, true);   // компьютерде: оң баскыч
})();

}

function waitText(r) {
  const w = r.wait; if (!w || !w.arrived_at) return "";
  const skew = Date.now() / 1000 - w.now, left = Math.round(w.arrived_at + w.free_min * 60 - (Date.now() / 1000 - skew));
  if (left > 0) return `⏳ Акысыз күтүү: <b>${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}</b>`;
  return `⏳ Акылуу күтүү: <b>+${w.fee} сом</b> (${w.per_min} с/мүн) — баага кошулат`;
}
setInterval(() => { if (D && D.ride && D.ride.status === "arrived" && $("#wt")) $("#wt").innerHTML = waitText(D.ride); }, 1000);

function unread() {
  const n = D.ride ? (D.ride.msgs || []).filter(m => !m.me).length : 0, el = $("#chatN");

  if (el) { el.textContent = n - seen > 0 ? n - seen : ""; el.classList.toggle("hide", n - seen <= 0); }
  if (n > seen && D.ride && unread.last !== n) { unread.last = n; if (n > 0 && unread.ready) { beep(); speak(["d_msg"], 750); } }
  unread.ready = true;
}
function drawMsgs() {
  const box = $("#msgs"); if (!box || !D.ride) return;

  box.innerHTML = ms.length ? ms.map(m => `<div class="${m.me ? "me" : ""}">${esc(m.text)}</div>`).join("") : `<p class="muted">Жүргүнчүгө жазыңыз.</p>`;

}

let RING = null, OFF_END = 0, OFF_TOT = 15, OFFL = null, OFF_VIEW = null;
// Заказ келгенде: картада жүргүнчүгө чейин сары жол + A (жана B) белгиси
function offerMapClear() {
  if (OFFL) { try { OFFL.clearLayers(); map.removeLayer ? map.removeLayer(OFFL) : OFFL.remove(); } catch (e) {} OFFL = null; }
  document.body.classList.remove("offering");
}
function offerMap(o) {
  offerMapClear(); if (!o.p) return;
  document.body.classList.add("offering");
  OFFL = L.layerGroup().addTo(map);
  const pin = (t, c) => L.marker(c === "a" ? o.p : o.d, {icon:L.divIcon({className:"", html:`<div class="abpin ${c}">${t}</div>`, iconSize:[34, 34], iconAnchor:[17, 17]}), interactive:false}).addTo(OFFL);
  if (o.d) L.polyline([o.p, o.d], {color:"#8a8a95", weight:3, dashArray:"4 7", opacity:.8}).addTo(OFFL);
  pin("А", "a"); if (o.d) pin("Б", "b");
  const me = myPos || (D.lat != null ? [D.lat, D.lon] : null);
  if (me) {
    const ln = L.polyline([me, o.p], {color:"#ffb703", weight:6, opacity:.95, dashArray:"8 8"}).addTo(OFFL);
    const g = OFFL;
    api(`/api/route?a=${me[0]},${me[1]}&b=${o.p[0]},${o.p[1]}`).then(rt => {
      if (OFFL !== g || !rt || !rt.coords || rt.coords.length < 3) return;
      ln.remove(); L.polyline(rt.coords, {color:"#ffb000", weight:7, opacity:1}).addTo(g);
    }).catch(() => {});
    const pts = [me, o.p].concat(o.d ? [o.d] : []), la = pts.map(x => x[0]), lo = pts.map(x => x[1]);
    try { map.fitBounds(L.latLngBounds([[Math.min(...la), Math.min(...lo)], [Math.max(...la), Math.max(...lo)]]), {paddingTopLeft:[40, 130], paddingBottomRight:[90, 400], maxZoom:16}); } catch (e) {}
  }
}
function showOffer() {

    if (!D || !D.offer || lastOffer !== D.offer.id || Date.now() > OFF_END) { clearInterval(RING); RING = null; return; } beep(); }, 3000);
  speak(orderToks(o.chained ? "next_order" : o.cls === "delivery" ? "new_delivery" : "new_order", o.price, o.to_pickup_km), 750);
  box.classList.remove("hide"); offerMap(o);
  const sk = o.surge && o.surge > 1.04 ? o.surge : 0;
  $("#ocard").innerHTML = `<div style="display:flex;align-items:center;gap:14px">
      <div style="flex:1"><div class="muted ohead">${o.stops ? `<span class="ocls stp">🔁 ${o.stops} токтоочу жер</span>` : ""}${o.del_size ? `<span class="ocls dsz">${o.del_size.ic} ${esc(o.del_size.name)} · ${esc(o.del_size.lim)}</span>` : ""}<span class="ocls ${esc(o.cls || "econom")}">${ICON[o.cls] || "🚕"} ${esc((D.class_names || {})[o.cls] || (o.cls === "delivery" ? "Жеткирүү" : "Эконом"))}</span>${o.chained ? "🔁 Кийинки заказ · азыркы сапардан кийин" : "Жаңы заказ"}</div>
      <div class="ochips"><span>📍 ${o.to_pickup_km} км</span><span>⏱ ${Math.max(1, Math.round(o.to_pickup_km * 2.4))} мүн</span><span class="k">💵 ${o.price ? o.price + " с" : "Тариф"}</span>${o.p_rating ? `<span>⭐ ${o.p_rating}</span>` : ""}</div>
      <div class="muted">${o.has_dest ? "Сапар ~" + o.dist_km + " км" + (o.est_min ? " · " + o.est_min + " мүн" : "") : "Багытын жүргүнчү айтат"}</div>
      ${o.p_addr || o.d_addr ? `<div class="muted">${esc(o.p_addr || "")}${o.d_addr ? " → " + esc(o.d_addr) : ""}</div>` : ""}
      ${o.discount ? `<div class="muted">🎁 Жүргүнчү ${o.price - Math.round(o.discount)} с төлөйт, +${Math.round(o.discount)} с балансыңызга</div>` : ""}
      ${o.note ? `<div class="muted">📝 ${esc(o.note)}</div>` : ""}</div></div>
    <button class="accbig" id="acc"><i id="accBar" style="width:${frac * 100}%"></i><span>АЛАМ <em id="oLeft">${o.left}</em></span>${sk ? `<b class="osurge">⚡×${sk.toFixed(1)}</b>` : ""}</button>
    <button class="btn ghost" id="dec">Жок</button>`;
  const tickBar = () => { const b = $("#accBar"); if (!b || lastOffer !== o.id) return;
    const left = Math.max(0, (OFF_END - Date.now()) / 1000); b.style.width = (100 * left / OFF_TOT) + "%"; $("#oLeft").textContent = Math.ceil(left);
    if (left > 0) requestAnimationFrame(tickBar); };
  requestAnimationFrame(tickBar);
  const accept = async () => { D = await api("/api/d/accept", {id:o.id}); box.classList.add("hide"); say("");
    if (D.error === "too_late") alert("Кечигип калдыңыз — заказ башка айдоочуга кетти."); lastOffer = null; show(); };
  $("#acc").onclick = () => { const b = $("#acc"); if (b.disabled) return; b.disabled = true; b.classList.add("ok");
    clearInterval(RING); RING = null; try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} accept(); };
  $("#dec").onclick = async () => { say(""); clearInterval(RING); RING = null; D = await api("/api/d/decline", {id:o.id}); box.classList.add("hide"); lastOffer = null; show(); };
}
// Сүрүп кабыл алуу: кокус басылып кетпейт
function swipe(track, knob, done) {
  let x0 = null, x = 0, fired = false;
  const max = () => track.clientWidth - knob.offsetWidth - 8;
  const setX = v => { x = Math.max(0, Math.min(max(), v)); knob.style.transform = `translateX(${x}px)`; track.style.setProperty("--p", x / max()); };
  knob.addEventListener("pointerdown", e => { x0 = e.clientX - x; knob.setPointerCapture(e.pointerId); knob.style.transition = "none"; });
  knob.addEventListener("pointermove", e => { if (x0 !== null) setX(e.clientX - x0); });
  const end = () => { if (x0 === null) return; x0 = null;
    if (!fired && x > max() * 0.8) { fired = true; setX(max()); track.classList.add("ok"); try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} done(); }
    else { knob.style.transition = "transform .2s"; setX(0); } };
  knob.addEventListener("pointerup", end); knob.addEventListener("pointercancel", end);
}

// ---------- Линия: чыгуу / токтотуу (баракта да, өйдөкү тилкеде да) ----------
async function goOnline(btn) {

  const r = await api("/api/d/online", {on:true, p, acc:myAcc || 0});

function tuckSet(id, on, save = true) {
  const el = document.getElementById(id); if (!el) return;
  el.classList.toggle("tucked", on);

function tuckPeek(id) {             // маанилүү учур: 5 сек өзү чыгып, кайра жашырылат
  const el = document.getElementById(id); if (!el || !el.classList.contains("tucked") || el.dataset.peek) return;
  el.dataset.peek = "1"; el.classList.remove("tucked"); el.classList.add("peek");
  setTimeout(() => { delete el.dataset.peek; el.classList.remove("peek"); if (localStorage.getItem("tuck_" + id)) el.classList.add("tucked"); }, 5000);
}
TUCK.forEach(id => {
  const el = document.getElementById(id); if (!el) return;
  try { if (localStorage.getItem("tuck_" + id)) el.classList.add("tucked"); } catch (e) {}
  let x0 = null, y0 = 0, moved = false;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false; }, {passive:true});
  el.addEventListener("touchmove", e => { if (x0 === null) return; const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { moved = true; el.style.transform = el.classList.contains("tucked") ? "" : `translateX(${Math.max(0, dx)}px)`; } }, {passive:true});
  el.addEventListener("touchend", e => { if (x0 === null) return; const dx = (e.changedTouches[0] || {}).clientX - x0; el.style.transform = ""; x0 = null;
    if (!moved) return; el.dataset.swiped = "1"; setTimeout(() => delete el.dataset.swiped, 400);
    if (dx > 40) tuckSet(id, true); else if (dx < -30) tuckSet(id, false); });

    if (el.dataset.swiped || el.classList.contains("tucked")) { e.stopImmediatePropagation(); e.preventDefault(); if (!el.dataset.swiped) tuckSet(id, false); }
  }, true);
});

function shrink(file, max = 1600, q = 0.72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function docInput(el, store, key) {
  el.querySelector("input").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    store[key] = await shrink(f);
    el.style.backgroundImage = `url(${store[key]})`; el.classList.add("ok");
  };
}

    setTimeout(() => { const g = $("#inGo"), n = $("#inNo"); if (g) g.onclick = () => { closeOverlay(); goOnline(); }; if (n) n.onclick = closeOverlay; }, 0); }
  const low = s.min_balance > 0 && s.balance < s.min_balance;
  if (VE.low === false && low && !sr) speak(["d_lowbal"]);
  VE.low = low;
  nearCheck();
}

async function boot() {
  const m = await api("/api/me"); ME_D = m;
  if (m.admin) setInterval(async () => { const x = await api("/api/me"); if (x && x.auth) ME_D = x; }, 60000);   // админдин иштеринин санын жаңылап турат
  if (m.auth && m.ask_role) api("/api/role", {as:"driver"});      // айдоочу баракчасынан келди — суроосуз
  if (!m.auth) return viewLogin(m.pending, m.link);
  if (m.avatar) $("#cabBtn").innerHTML = `<img src="${esc(m.avatar)}" alt="" class="avbtn">`;
  navAvatar(m.avatar, m.name);
  await refresh();
  if (D.online || D.ride) { startGps(); wake(true); }
  else getPos().then(drawMe);
  clearInterval(poll); poll = setInterval(refresh, 2000);
  setTimeout(() => D && D.status && diagChecks().catch(() => {}), 8000);                     // телефондун абалы админ/паркка
  setInterval(() => D && D.status && diagChecks().catch(() => {}), 10 * 60 * 1000);
}
boot();
</script>
