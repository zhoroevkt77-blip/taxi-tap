<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>Такси ТАП! — Айдоочу</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png?v=4">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#17365C;--gold:#C9A03A;--gold2:#E3C368;--ink:#152741;--soft:#5A6880;--paper:#F1F4F9;--line:#E1E7F1;--ok:#1D9E75;--bad:#D8443A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
#map{position:fixed;inset:0;z-index:1}
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;gap:8px;align-items:flex-start}
.logo{background:var(--navy);color:#fff;font-weight:800;font-size:15px;padding:10px 12px;border-radius:14px}
.logo b{color:var(--gold2)}
.pill{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(20,20,30,.15);font-size:13px;line-height:1.2}
.pill b{display:block;font-size:16px;white-space:nowrap}
.rcol{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}.rcol .state{margin-left:0}
.state{margin-left:auto;font-weight:700;font-size:13px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 2px 10px rgba(20,20,30,.15)}
.state.on{background:var(--ok);color:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(20,20,30,.12);max-height:86vh;overflow:auto}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
h2{font-size:20px;margin:2px 0 10px}
.muted{color:var(--soft);font-size:13px}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;display:block;text-align:center;text-decoration:none}
.btn.main{background:var(--gold);color:#16161a}
.btn.go{background:var(--ok);color:#fff;font-size:19px;padding:20px}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.red{background:#FCEBEB;color:var(--bad)}
.btn:disabled{opacity:.5}
input.f{width:100%;font-size:17px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);margin-bottom:10px;outline:none;color:var(--ink)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.stat{background:var(--paper);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}
.offer{position:fixed;inset:0;z-index:20;background:rgba(20,20,30,.55);display:flex;align-items:flex-end}
.ocard{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.ring{width:74px;height:74px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px}
.oprice{font-size:34px;font-weight:800}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.bul{width:10px;height:10px;border-radius:50%;background:var(--navy);flex:none}
.bul.to{background:var(--gold)}
.two{display:flex;gap:10px}.two>*{flex:1}
.carm{width:30px;height:30px;border-radius:50%;background:var(--navy);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:14px}
.carm.me{background:var(--ok)}
.carm.to{background:var(--gold);color:#16161a}
.wait{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:14px}
.blink{width:12px;height:12px;border-radius:50%;background:var(--ok);animation:b 1.2s infinite}
@keyframes b{50%{opacity:.25}}
.hist{font-size:14px}
.hide{display:none!important}
table.fin{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.fin th{font-size:11px;color:var(--soft);font-weight:600;text-align:right;padding:6px 4px}
table.fin td{text-align:right;padding:9px 4px;border-top:1px solid var(--line)}
table.fin td:first-child,table.fin th:first-child{text-align:left}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 0 6px}
.doc{border:1.5px dashed var(--line);border-radius:14px;aspect-ratio:1.5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--soft);text-align:center;padding:6px;cursor:pointer;background:var(--paper) center/cover no-repeat;position:relative}
.doc.ok{border:2px solid var(--ok);color:transparent}
.doc input{position:absolute;inset:0;opacity:0;cursor:pointer}
.doc i{font-style:normal;font-size:24px;display:block;margin-bottom:4px}
label.l{font-size:13px;color:var(--soft);display:block;margin:6px 0 4px}
.note{background:#fff8e6;border-radius:14px;padding:12px;font-size:14px;margin:6px 0}
.tag{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-right:4px}
.tag.g{background:var(--gold);color:#16161a}
.stars{display:flex;justify-content:center;gap:6px;font-size:36px;margin:6px 0}
.stars span{cursor:pointer;color:var(--line)}.stars span.on{color:var(--gold)}
.chatb{position:relative}
.chatb em{position:absolute;top:6px;right:10px;background:var(--bad);color:#fff;border-radius:10px;font-style:normal;font-size:12px;padding:1px 7px}
.msgs{max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.msgs div{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--paper);font-size:15px;align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msgs div.me{align-self:flex-end;background:var(--navy);color:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;font-size:13px;cursor:pointer}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);margin-top:10px}
</style>
<link rel="stylesheet" href="/static/theme.css?v=74">
</head>
<body>
<nav id="bnav" class="bnav pro"><a data-k="earn"><img src="/static/n_earn.webp?v=9" alt="">Киреше</a><a data-k="hist"><img src="/static/n_trips.webp?v=9" alt="">Сапарлар</a><a data-k="line" class="big on"><img src="/static/n_go.webp?v=9" alt="">Линия</a><a data-k="help"><img src="/static/n_help.webp?v=9" alt="">Жардам</a><a data-k="cab"><img src="/static/n_cab.webp?v=9" alt="">Кабинет</a></nav>
<div id="map"></div>
<div class="top">
  <div class="lcol"><div class="logo"><img src="/static/logo.png?v=2" alt="">Такси <b>ТАП!</b></div>
    <div class="role drole"><a href="/"><img src="/static/r_bag.webp?v=9" alt="">Жүргүнчү</a><a class="on"><img src="/static/r_car.webp?v=9" alt="" class="rc">Айдоочу</a></div></div>
  <div class="rcol"><button class="state hide" id="stBadge" style="display:none">Офлайн</button>
    <button class="tbtn hide topav" id="cabBtn" aria-label="Менин кабинетим">👤</button>
    <div class="r2"><button class="ep hide" id="earn"></button></div>
    <div class="tools hide" id="tools"><button class="sbtn" id="heatBtn" aria-label="Коэффициент"><i>💓</i>×1.0</button></div></div>
</div>
<div class="sheet"><div class="grab"></div><div id="view"></div></div>
<div class="offer hide" id="offer"><div class="ocard" id="ocard"></div></div>
<div class="offer hide" id="ovl"><div class="ocard" id="ovlc"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/area.js"></script>
<script src="/static/qr.js"></script>
<script src="/static/qrshare.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {credentials:"same-origin"} :
    {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json();
};
const map = L.map("map", {zoomControl:false}).setView([41.0377, 72.7470], 14);
setupArea(map, {zoom:14});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
const icon = (cls, t) => L.divIcon({className:"", html:`<div class="carm ${cls}">${t}</div>`, iconSize:[30,30], iconAnchor:[15,15]});
const layer = L.layerGroup().addTo(map);
let me = null, myHead = null, mySpeed = 0, myPos = null, D = null, poll = null, watch = null, lock = null, lastOffer = null, lastRide = null, pingT = null;

NAV.init(map, {onLocate: () => getPos().then(p => { if (p) { drawMe(); map.setView(p, Math.max(map.getZoom(), 16)); } })});
// ---------- GPS ----------
function startGps() {
  if (!navigator.geolocation || watch !== null) return;
  watch = navigator.geolocation.watchPosition(p => {
    myPos = [p.coords.latitude, p.coords.longitude]; myHead = p.coords.heading; mySpeed = p.coords.speed;
    drawMe();
  }, () => {}, {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
  clearInterval(pingT);
  pingT = setInterval(() => { if (myPos && D && D.online) api("/api/d/location", {p:myPos}); }, 5000);
}
function getPos() {
  return new Promise(res => {
    if (myPos) return res(myPos);
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => { myPos = [p.coords.latitude, p.coords.longitude]; res(myPos); },
      () => res(null), {enableHighAccuracy:true, timeout:10000});
  });
}
function drawMe() {
  if (!myPos) return;
  NAV.set(myPos, myHead, mySpeed);
  if (!me) { me = true; map.setView(myPos, 16); }
}
async function wake(on) {
  try {
    if (on && "wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); }
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && D && D.online) wake(true); });

// ---------- үн ----------
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.25, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t + 0.2);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.22);
    });
    navigator.vibrate && navigator.vibrate([300, 120, 300]);
  } catch (e) {}
}

// ---------- көрүнүштөр ----------
const render = h => { $("#view").innerHTML = h; window.SHEET && SHEET.refresh(); };
const navUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${p[0]},${p[1]}`;

function viewLogin(pending, link, err) {
  $("#earn").classList.add("hide"); $("#stBadge").classList.add("hide");
  if (pending) {
    render(`<h2>Номериңизди ырастаңыз</h2><p class="muted">Telegram'да ботко өтүп, «Номеримди жөнөтүү» басыңыз.</p>
      ${link ? `<a class="btn dark" href="${esc(link)}" target="_blank">Telegram'да ырастоо</a>` : ""}
      <button class="btn ghost" id="relog">Артка</button>`);
    $("#relog").onclick = () => viewLogin(false);
    const t = setInterval(async () => { const m = await api("/api/me"); if (m.auth) { clearInterval(t); boot(); } }, 2500);
    return;
  }
  render(`<h2>Айдоочунун кабинети</h2>
    <p class="muted">Номериңиз менен кириңиз. Айдоочу эмес болсоңуз — кийинки кадамда арыз толтурасыз.</p>
    <input class="f" id="nm" placeholder="Атыңыз" autocomplete="given-name">
    <input class="f" id="ph" placeholder="0700 123 456" inputmode="tel" autocomplete="tel">
    <div class="err" id="er">${esc(err || "")}</div>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft);margin:2px 0 6px">
      <input type="checkbox" id="agree" style="width:20px;height:20px;flex:none;margin-top:1px">
      <span><a href="/terms" target="_blank" style="color:var(--navy)">Колдонуу шарттары жана купуялык саясаты</a> менен макулмун</span></label>
    <button class="btn main" id="go">Кирүү</button>`);
  $("#ph").oninput = () => $("#er").textContent = "";
  $("#go").onclick = async () => {
    if (!$("#agree").checked) return $("#er").textContent = "Шарттар менен макул экениңизди белгилеңиз.";
    const r = await api("/api/login", {phone:$("#ph").value, name:$("#nm").value, kind:"driver", agree:true});
    if (r.error) return $("#er").textContent = "Номерди толук жазыңыз: 0700 123 456";
    r.auth ? boot() : viewLogin(true, r.link);
  };
}

function ring(p, col) {
  const r = 17, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, p));
  return `<span class="ring"><svg width="42" height="42" viewBox="0 0 42 42"><circle cx="21" cy="21" r="${r}" fill="none" stroke="#eeeef2" stroke-width="5"/>
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 21 21)"/></svg><em>${Math.round(f * 100)}%</em></span>`;
}
const EYE = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.6M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>`;
function earnPill() {
  const e = $("#earn"), got = D.today.earned || 0, goal = D.goal || 1000;
  const low = D.min_balance > 0 && D.balance < D.min_balance;
  let hid = false; try { hid = localStorage.getItem("earnHide") === "1"; } catch (x) {}
  const key = [low, got, goal, D.balance, hid].join("|"); if (e.dataset.k === key) return; e.dataset.k = key;
  if (low) {
    e.className = "ep bad";
    e.innerHTML = `<span class="ei">⚠️</span><span><b>Баланс аз!</b><small>${D.balance} с · толуктоо ›</small></span>`;
    e.onclick = () => { window.SHEET && SHEET.expand(); D.pending_topup ? viewCabinet("earn") : viewTopup(); };
    return;
  }
  const done = got >= goal;
  // Басса — сумма жашырылат, кайра басса — көрүнөт (жанындагы адам көрбөсүн)
  e.onclick = () => { try { localStorage.setItem("earnHide", hid ? "0" : "1"); } catch (x) {} earnPill(); };
  if (hid) {
    e.className = "ep";
    e.innerHTML = `<span class="ring"><svg width="42" height="42" viewBox="0 0 42 42"><circle cx="21" cy="21" r="17" fill="none" stroke="#eeeef2" stroke-width="5"/></svg><em>•••</em></span><span><b>••• с</b><small>жашыруун</small></span><span class="eye">${EYE_OFF}</span>`;
    return;
  }
  e.className = "ep" + (done ? " done" : "");
  e.innerHTML = `${ring(got / goal, done ? "#16161a" : "#ffb703")}<span><b>${got} с</b><small>${done ? "🎉 Аткарылды!" : "максат " + goal}</small></span><span class="eye">${EYE}</span>`;
  if (done) { const day = new Date().toDateString();
    try { if (localStorage.getItem("goalDay") !== day) { localStorage.setItem("goalDay", day); toast("🎉 Күндүк максат аткарылды: " + got + " с!", 3500); say("Күндүк максат аткарылды"); } } catch (x) {} }
}
function header() {
  const act = D.status === "active";
  $("#earn").classList.toggle("hide", !act); $("#tools").classList.toggle("hide", !act); $("#cabBtn").classList.toggle("hide", !act);
  if (!act) return;
  earnPill();
  $("#stBadge").innerHTML = D.ride ? "🚕 Сапарда" : D.online ? "🟢 Линияда" : "▶ Линияга чыгуу";
  $("#stBadge").classList.toggle("on", D.online || !!D.ride);
}

const ICON = {econom:"🚕", comfort:"🚘", minivan:"🚐", delivery:"📦"};
const clsTag = c => c && c !== "econom" ? `<span class="tag g">${ICON[c] || ""} ${esc((D.class_names || {})[c] || c)}</span>` : "";
function homeHTML() {
  const h = D.home || {};
  if (!h.set) return `<div class="sw"><div><b>🏠 Үйгө карай</b><div class="muted">Үйүңүздүн жагына бара турган заказдар гана келет. Адегенде үйүңүздү белгилеңиз.</div></div>
    <button class="btn ghost" id="hset" style="width:auto;margin:0;padding:10px 12px;font-size:14px;white-space:nowrap;flex:none">Ушул жер — үйүм</button></div>`;
  return `<div class="sw"><div><b>🏠 Үйгө карай</b><div class="muted">${h.on ? "Күйүк: үйүңүздүн жагына заказдар гана келет" : `Бүгүн дагы ${h.left} жолу күйгүзсө болот`}</div>
    <a href="#" id="hset" class="muted" style="font-size:12px">Үйдүн жерин жаңыртуу (азыркы жериңиз)</a></div>
    <input type="checkbox" id="hon" ${h.on ? "checked" : ""} ${!h.on && !h.left ? "disabled" : ""} style="width:24px;height:24px"></div>`;
}
function bindHome() {
  const hs = $("#hset"); if (hs) hs.onclick = async e => { e.preventDefault();
    const p = await getPos(); if (!p) return alert("GPS'ке уруксат бериңиз.");
    if (!confirm("Азыркы жериңизди үйүңүз катары сактайсызбы?")) return;
    D = await api("/api/d/home_set", {p}); lastView = ""; show(); };
  const ho = $("#hon"); if (ho) ho.onchange = async () => {
    D = await api("/api/d/home", {on:ho.checked});
    if (D.error === "home_limit") alert("Бүгүнкү лимит бүттү (күнүнө 2 жолу).");
    lastView = ""; show(); };
}

// ---------- айдоочу дарек сунуштайт (турган жеринен) ----------
function viewAddAddr() {
  const K = [["poi","📍 Белгилүү жер"],["shop","🏪 Дүкөн"],["food","🍽 Кафе / той-кана"],["school","🏫 Мектеп / бала бакча"],
             ["health","🏥 Оорукана / дарыкана"],["mosque","🕌 Мечит"],["gov","🏛 Мекеме"],["bus","🚌 Бекет"],["street","🛣 Көчө"],["village","🏘 Айыл / кичи район"]];
  render(`<h2>📍 Дарек кошуу</h2>
    <p class="muted">Ушул жерде турганда атын жазыңыз — жайгашкан жериңиз GPS'тен алынат. Жүргүнчүлөр кийин бул жерди тизмеден табышат.</p>
    <input class="f" id="an" maxlength="80" placeholder="Мис. Нурбек той-кана, Ак-Тилек дүкөнү">
    <select class="f" id="ak" style="width:100%">${K.map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select>
    <div class="err" id="ae"></div>
    <button class="btn main" id="as">Кошуу</button><button class="btn ghost" id="ab">Артка</button>`);
  $("#ab").onclick = viewCabinet;
  $("#as").onclick = async () => {
    const nm = $("#an").value.trim(); if (nm.length < 2) return $("#ae").textContent = "Атын жазыңыз.";
    $("#as").disabled = true;
    const p = await getPos(); if (!p) { $("#as").disabled = false; return $("#ae").textContent = "GPS'ке уруксат бериңиз."; }
    const r = await api("/api/d/addr_suggest", {name:nm, kind:$("#ak").value, p});

let seenRide = null;
function viewRide() {
  const r = D.ride;
  if (seenRide !== r.id) { seenRide = r.id; seen = 0; unread.last = 0; }
  layer.clearLayers();
  L.marker(r.p, {icon:icon("", "👤"), interactive:false}).addTo(layer);
  if (r.d) L.marker(r.d, {icon:icon("to", "Б"), interactive:false}).addTo(layer);
  const target = r.status === "in_trip" ? r.d : r.p;
  if (lastRide !== r.id + r.status && myPos && target) {
    // жол боюнча маршрут: айдоочудан → жүргүнчүгө, сапарда → бара турган жерге
    const line = L.polyline([myPos, target], {color:"#17365C", weight:4, dashArray:"6 8"}).addTo(layer);
    map.fitBounds(L.latLngBounds([myPos, target]), {paddingTopLeft:[40, 90], paddingBottomRight:[40, 360]});
    api(`/api/route?a=${myPos[0]},${myPos[1]}&b=${target[0]},${target[1]}`).then(rt => {
      if (!rt.coords || rt.coords.length < 3) return;
      line.remove ? line.remove() : null;
      L.polyline(rt.coords, {color:"#17365C", weight:5, opacity:.85}).addTo(layer);
      map.fitBounds(L.latLngBounds(rt.coords), {paddingTopLeft:[40, 90], paddingBottomRight:[40, 360]});
      const el = $("#rinfo"); if (el) el.textContent = `${rt.km} км · ~${rt.min} мүн`;
    });
  }
  lastRide = r.id + r.status;
  const del = r.cls === "delivery";
  const title = del ? {accepted:"Буюмду алууга барыңыз", arrived:"Буюмду алыңыз", in_trip:"Алуучуга жеткириңиз"}[r.status]
    : {accepted:"Жүргүнчүгө барыңыз", arrived:"Жүргүнчүнү күтүңүз", in_trip:"Сапар жүрүп жатат"}[r.status];
  const next = {accepted:["📍 Келдим", "main"], arrived:[del ? "▶️ Алдым, жолго чыктым" : "▶️ Сапарды баштоо", "go"], in_trip:[del ? "🏁 Жеткирдим" : "🏁 Сапарды бүтүрүү", "dark"]}[r.status];
  const who = r.other_name || r.other_phone ? `${esc(r.other_name || "Башка адам")}<div class="muted">Заказ берген: ${esc(r.passenger)}</div>` : esc(r.passenger);
  const callPh = !del && r.other_phone ? r.other_phone : r.phone;
  render(`<h2>${clsTag(r.cls)}${title}</h2><div class="muted" id="rinfo" style="margin:-6px 0 6px"></div>
    <div class="row"><span class="bul lt">А</span><div style="flex:1"><b>${who}</b>${r.p_rating ? `<span class="muted"> · ★ ${r.p_rating}</span>` : ""}
      <div class="muted">${r.price ? r.price + " сом" : "Тариф боюнча"}${r.dist_km ? " · ~" + r.dist_km + " км" : ""}${r.p_addr ? " · " + esc(r.p_addr) : ""}</div></div></div>

  return `⏳ Акылуу күтүү: <b>+${w.fee} сом</b> (${w.per_min} с/мүн) — баага кошулат`;
}

// Сүрүп кабыл алуу: кокус басылып кетпейт
function swipe(track, knob, done) {
  let x0 = null, x = 0, fired = false;
  const max = () => track.clientWidth - knob.offsetWidth - 8;
  const setX = v => { x = Math.max(0, Math.min(max(), v)); knob.style.transform = `translateX(${x}px)`; track.style.setProperty("--p", x / max()); };
  knob.addEventListener("pointerdown", e => { x0 = e.clientX - x; knob.setPointerCapture(e.pointerId); knob.style.transition = "none"; });
  knob.addEventListener("pointermove", e => { if (x0 !== null) setX(e.clientX - x0); });
  const end = () => { if (x0 === null) return; x0 = null;
    if (!fired && x > max() * 0.8) { fired = true; setX(max()); track.classList.add("ok"); try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} done(); }
    else { knob.style.transition = "transform .2s"; setX(0); } };
  knob.addEventListener("pointerup", end); knob.addEventListener("pointercancel", end);
}

const voiceOn = () => { try { return localStorage.getItem("voice") !== "off"; } catch (e) { return true; } };
function say(text) {
  if (!("speechSynthesis" in window) || !voiceOn()) return;
  try {
    speechSynthesis.cancel();
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices().find(x => /^ky/i.test(x.lang)) || speechSynthesis.getVoices().find(x => /^ru/i.test(x.lang));
    if (v) u.voice = v; u.lang = v ? v.lang : "ru-RU"; u.rate = 1.0;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function hexPts(lat, lon, r) {
  const c = Math.cos(41 * Math.PI / 180);
  return [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 3 * i; return [lat + r * Math.sin(a), lon + r * Math.cos(a) / c]; });
}

// ---------- сүрөттү кичирейтүү (браузерде) ----------
function shrink(file, max = 1600, q = 0.72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function docInput(el, store, key) {
  el.querySelector("input").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    store[key] = await shrink(f);
    el.style.backgroundImage = `url(${store[key]})`; el.classList.add("ok");
  };
}

  $("#back").onclick = () => { lastView = ""; show(); };
  $("#send").onclick = async () => {
    if (!box.license) return $("#er").textContent = "Күбөлүктүн сүрөтүн жүктөңүз.";
    if (!$("#nd").value) return $("#er").textContent = "Мөөнөтүн жазыңыз.";
    $("#send").disabled = true;
    const r = await api("/api/d/license", {license:box.license, lic_until:$("#nd").value});
    if (r.error) { $("#send").disabled = false; return $("#er").textContent = LIC_ERR[r.error] || "Ката."; }
    D = r; toast("✅ Сакталды"); lastView = ""; show();
  };
}

// ---------- Унаа: түс, марка/модель, номер ----------
const CAR_COLORS = [["Ак", "#ffffff"], ["Кара", "#16161a"], ["Күмүш", "linear-gradient(135deg,#f2f2f5,#a9adb5)"], ["Боз", "#8d9199"],
  ["Асфальт", "#4b5058"], ["Көк", "#1f5fbf"], ["Кызыл", "#d4252f"], ["Жашыл", "#2f8f4e"], ["Сары", "#ffc61a"], ["Күрөң", "#7a4a2a"], ["Кызгылт", "#c9a07a"]];
const CAR_MODELS = {
  "Тойота": ["Камри", "Королла", "Приус", "Аква", "Ярис", "Витц", "Авенсис", "Эстима", "Альфард", "Хайландер", "РАВ4", "Ленд Крузер"],
  "Хюндай": ["Солярис", "Соната", "Элантра", "Акцент", "Аванте", "Гетц", "Грандеур", "Туссан", "Санта Фе", "Старекс"],
  "Киа": ["Рио", "К5", "Оптима", "Серато", "Спортейдж", "Соренто", "Карнивал", "Морнинг"],
  "Хонда": ["Фит", "Цивик", "Аккорд", "Одиссей", "Степвагон", "CR-V", "Инсайт"],
  "Лексус": ["ES", "RX", "GS", "LX"], "Мерседес-Бенц": ["E-класс", "C-класс", "S-класс", "Вито", "Спринтер"],
  "Дэу": ["Нексия", "Матиз", "Джентра", "Ласетти"], "Шевроле": ["Кобальт", "Нексия", "Спарк", "Малибу", "Каптива", "Ласетти"],
  "Ниссан": ["Тиида", "Ноут", "Алмера", "Икс-Трейл", "Серена"], "Мазда": ["Мазда 3", "Мазда 6", "Демио", "Премаси"],
  "Фольксваген": ["Пассат", "Гольф", "Поло", "Джетта", "Шаран"], "Лада": ["Гранта", "Веста", "Приора", "Калина", "Ларгус", "Нива"],
  "BYD": ["Хан", "Сонг", "Чейзер 05", "Сил"], "Субару": ["Легаси", "Аутбек", "Форестер", "Импреза"],
  "Митсубиси": ["Лансер", "Аутлендер", "Паджеро", "Делика"], "Ауди": ["А4", "А6", "Q5", "Q7"], "БМВ": ["3", "5", "X5"]};
const PLATE_REG = {"01":"Бишкек", "02":"Ош ш.", "03":"Баткен", "04":"Жалал-Абад", "05":"Нарын", "06":"Ош обл.", "07":"Талас", "08":"Чүй", "09":"Ысык-Көл"};
const CYR_LAT = {А:"A", В:"B", Е:"E", К:"K", М:"M", Н:"H", О:"O", Р:"P", С:"C", Т:"T", У:"Y", Х:"X", Г:"G", Д:"D", Л:"L", И:"I", Ф:"F", З:"Z", Ж:"J"};
function plateVal() {
  const n = $("#rpN").value.replace(/\D/g, ""), l = $("#rpL").value.toUpperCase().replace(/[А-ЯЁ]/g, c => CYR_LAT[c] || "").replace(/[^A-Z]/g, "");
  return n.length === 3 && l.length >= 2 ? `${$("#rpR").value}KG${n}${l}` : "";
}
function carForm() {
  // мурунку маалыматты толтуруу
  const pm = /^(0[1-9])KG(\d{3})([A-Z]{2,3})$/.exec(D.car_plate || "");
  if (pm) { $("#rpR").value = pm[1]; $("#rpN").value = pm[2]; $("#rpL").value = pm[3]; }
  const prev = () => { const p = plateVal(); $("#carPrev").innerHTML = ($("#rc").value && $("#rm").value) || p
    ? `${PLATE_REG[$("#rpR").value]} · жүргүнчүгө ушундай көрүнөт: <b>${esc(carText($("#rc").value, $("#rm").value) || "…")}, ${p || "…"}</b>` : ""; };
  const pickColor = (n, typed) => { $("#rcP").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.c === n));
    $("#rc").classList.toggle("hide", n !== "*"); if (n !== "*") $("#rc").value = n; else if (!typed) { $("#rc").value = ""; $("#rc").focus(); } prev(); };
  $("#rcP").querySelectorAll("button").forEach(b => b.onclick = () => pickColor(b.dataset.c));
  if (D.car_color) pickColor(CAR_COLORS.some(c => c[0] === D.car_color) ? D.car_color : "*", true);
  const setModels = (b, keep) => { const m = CAR_MODELS[b] || [];
    $("#rmS").innerHTML = `<option value="">Модели…</option>${m.map(x => `<option>${x}</option>`).join("")}<option value="*">✏️ Башка</option>`;
    $("#rmS").disabled = !b || b === "*"; $("#rmS").classList.toggle("hide", b === "*"); $("#rm").classList.toggle("hide", b !== "*");
    if (!keep) $("#rm").value = b === "*" ? "" : ""; };
  $("#rb").onchange = () => { setModels($("#rb").value); if ($("#rb").value === "*") $("#rm").focus(); prev(); };
  $("#rmS").onchange = () => { const v = $("#rmS").value, b = $("#rb").value;
    if (v === "*") { $("#rm").classList.remove("hide"); $("#rm").value = b + " "; $("#rm").focus(); } else { $("#rm").classList.add("hide"); $("#rm").value = v ? b + " " + v : ""; } prev(); };
  if (D.car_model) { const b = Object.keys(CAR_MODELS).find(k => D.car_model.startsWith(k + " "));
    if (b) { $("#rb").value = b; setModels(b, true); const m = D.car_model.slice(b.length + 1);
      if (CAR_MODELS[b].includes(m)) $("#rmS").value = m; else { $("#rmS").value = "*"; $("#rm").classList.remove("hide"); } }
    else { $("#rb").value = "*"; setModels("*", true); } }
  ["#rc", "#rm", "#rpN", "#rpL", "#rpR"].forEach(s => $(s).addEventListener("input", prev));
  $("#rpL").addEventListener("input", () => { const e = $("#rpL"); e.value = e.value.toUpperCase().replace(/[А-ЯЁ]/g, c => CYR_LAT[c] || "").replace(/[^A-Z]/g, ""); });
  $("#rpN").addEventListener("input", () => { const e = $("#rpN"); e.value = e.value.replace(/\D/g, ""); if (e.value.length === 3) $("#rpL").focus(); });
  prev();
}
function viewRegister() {
  $("#earn").classList.add("hide");
  const again = D.status === "rejected" || D.status === "pending";
  const docs = {};
  render(`<h2>${again ? "Арызды оңдоо" : "Айдоочу болуу"}</h2>
    ${D.status === "rejected" ? `<div class="note">Арыз кабыл алынган жок.${D.reject_note ? " Себеби: " + esc(D.reject_note) : ""}</div>` : ""}
    <label class="l">Аты-жөнүңүз</label><input class="f" id="rn" value="${esc(D.name || "")}" autocomplete="name">
    <label class="l">Унаанын түсү</label>
    <div class="cpick" id="rcP">${CAR_COLORS.map(([n, c]) => `<button type="button" data-c="${n}" style="--c:${c}"><i></i>${n}</button>`).join("")}<button type="button" data-c="*"><i class="o">✏️</i>Башка</button></div>
    <input class="f hide" id="rc" placeholder="Түсүн жазыңыз" value="${esc(D.car_color || "")}">
    <label class="l">Маркасы жана модели</label>
    <div class="two"><select class="f" id="rb"><option value="">Маркасы…</option>${Object.keys(CAR_MODELS).map(b => `<option>${b}</option>`).join("")}<option value="*">✏️ Башка</option></select>
      <select class="f" id="rmS" disabled><option value="">Модели…</option></select></div>
    <input class="f hide" id="rm" placeholder="Мис. Хюндай Солярис" value="${esc(D.car_model || "")}">
    <label class="l">Мамлекеттик номери</label>
    <div class="kgp"><select id="rpR">${Object.entries(PLATE_REG).map(([k, v]) => `<option value="${k}" ${k === "04" ? "selected" : ""}>${k}</option>`).join("")}</select>
      <span class="kg"><b>🇰🇬</b>KG</span><input id="rpN" inputmode="numeric" maxlength="3" placeholder="338"><input id="rpL" maxlength="3" placeholder="APG" autocapitalize="characters"></div>
    <p class="muted" id="carPrev" style="margin:-2px 0 8px"></p>
    <label class="l">Документтердин сүрөтү${again ? " (өзгөрбөсө жүктөбөй эле коюңуз)" : ""}</label>
    <div class="docs">
      <div class="doc" id="dl"><i>🪪</i>Айдоочулук күбөлүк<input type="file" accept="image/*"></div>
      <div class="doc" id="dt"><i>📄</i>Техпаспорт<input type="file" accept="image/*"></div>
      <div class="doc" id="dc"><i>🚗</i>Унаанын сүрөтү<input type="file" accept="image/*"></div>
      <div class="doc" id="ds"><i>🤳</i>Күбөлүктү колуңузга кармап селфи<input type="file" accept="image/*" capture="user"></div>
    </div>
    <label class="l">Күбөлүктүн мөөнөтү (качанга чейин жарактуу)</label>
    <input class="f" id="rl" type="date" value="${esc(D.lic_until || "")}">
    <p class="muted">Документтерди админ гана көрөт.</p>
    <div class="err" id="er"></div><button class="btn main" id="send">Арызды жөнөтүү</button>
    `);
  docInput($("#dl"), docs, "license"); docInput($("#dt"), docs, "techpass"); docInput($("#dc"), docs, "car"); docInput($("#ds"), docs, "selfie");
  carForm();
  $("#send").onclick = async () => {
    const plate = plateVal();
    const body = {name:$("#rn").value, model:$("#rm").value, color:$("#rc").value, plate, lic_until:$("#rl").value, ...docs};
    if (!body.name.trim() || !body.model.trim() || !body.color.trim()) return $("#er").textContent = "Аты-жөнүңүздү, унаанын түсүн жана маркасын тандаңыз.";
    if (!plate) return $("#er").textContent = "Номерди толук жазыңыз: 3 цифра жана 2–3 латын тамгасы (мис. 338 APG).";
    if (!again && Object.keys(docs).length < 4) return $("#er").textContent = "Төрт сүрөттү тең жүктөңүз (селфи да).";
    if (!body.lic_until) return $("#er").textContent = "Күбөлүктүн мөөнөтүн жазыңыз.";
    $("#send").disabled = true; $("#send").textContent = "Жөнөтүлүүдө…";
    const r = await api("/api/d/register", body);
    if (r.error) { $("#send").disabled = false; $("#send").textContent = "Арызды жөнөтүү";
      return $("#er").textContent = r.error === "plate" ? "Номер туура эмес. Мисалы: 04 KG 338 APG." : LIC_ERR[r.error] || (r.error.startsWith("doc_") ? "Документтин сүрөтүн жүктөңүз." : "Ката. Талааларды текшериңиз."); }
    D = r; lastView = ""; show();
  };
}

function viewTopup() {
  let proof = null;
  render(`<h2>Балансты толуктоо</h2>
    <div class="note">1. Төмөнкү реквизитке акча которуңуз:<br><b>${esc(D.pay_info)}</b><br>2. Чектин скриншотун жүктөп, сумманы жазыңыз.</div>
    <label class="l">Сумма (сом)</label><input class="f" id="am" inputmode="numeric" placeholder="500">
    <div class="docs" style="grid-template-columns:1fr"><div class="doc" id="pf" style="aspect-ratio:2"><i>🧾</i>Чектин скриншоту<input type="file" accept="image/*"></div></div>
    <div class="err" id="er"></div><button class="btn main" id="send">Жөнөтүү</button><button class="btn ghost" id="back">Артка</button>`);
  const box = {}; docInput($("#pf"), box, "proof");
  $("#back").onclick = () => { lastView = ""; show(); };
  $("#send").onclick = async () => {
    const am = +$("#am").value;
    if (!(am > 0)) return $("#er").textContent = "Сумманы жазыңыз.";
    if (!box.proof) return $("#er").textContent = "Чектин скриншотун жүктөңүз.";
    $("#send").disabled = true;
    const r = await api("/api/d/topup", {amount:am, proof:box.proof});
    if (r.error) { $("#send").disabled = false; return $("#er").textContent = "Ката, кайра аракет кылыңыз."; }
    D = r; lastView = ""; show();
  };
}

let lastView = "";
function viewHelp() {
  navOn("help");
  render(`<h2>💬 Жардам</h2>
    <button class="btn red" id="hSos">🆘 Шашылыш жардам (112 / админге)</button>
    ${D.bot ? `<a class="btn main" href="https://t.me/${esc(D.bot)}" target="_blank" style="display:block;text-align:center;text-decoration:none">✈️ Telegram аркылуу жазуу</a>` : ""}
    <details class="faq"><summary>Заказ кантип келет?</summary><p>«Линияга чыгуу» баскычын басыңыз. Жакын жердеги заказ экранга чыгат — сүрүп кабыл аласыз. Сайт жабык болсо Telegram'га кабар келет.</p></details>
    <details class="faq"><summary>Баланс эмне үчүн керек?</summary><p>Комиссия балансыңыздан кемийт. Баланс аз болсо заказ келбейт — «Киреше» бөлүмүнөн толуктаңыз.</p></details>
    <details class="faq"><summary>Активдүүлүк деген эмне?</summary><p>Заказ алып бүтүрсөңүз көбөйөт, баш тартсаңыз азаят. Заказ эң жакын айдоочуга берилет, бирок аралыгы окшош болсо — активдүүлүгү жогору айдоочуга биринчи келет.</p></details>
    <details class="faq"><summary>Жүргүнчү менен көйгөй чыкса?</summary><p>Ушул бөлүмдөгү же сапар бетиндеги «🆘 Шашылыш жардам» баскычы админге жериңизди жана сапарды дароо жөнөтөт. Коркунуч болсо 112ге чалыңыз.</p></details>
    <details class="faq"><summary>Күбөлүктүн мөөнөтү бүтсө?</summary><p>«Кабинет → Документтер» бөлүмүнөн жаңы күбөлүктүн сүрөтүн жана мөөнөтүн жүктөңүз.</p></details>`);
  $("#hSos").onclick = sosOpen;
  window.SHEET && SHEET.expand();
}
function confirmOut() {
  if (D && D.ride) return overlay(`<div class="lgx"><div class="lg-ic" style="background:#fff6dd"><img src="/static/r_car.webp?v=9" alt="" style="width:56px"></div><h2>Азыр чыгууга болбойт</h2>
      <p class="muted">Сизде жүрүп жаткан сапар бар. Адегенде сапарды бүтүрүңүз.</p>
      <button class="btn main" id="ovlX">Сапарга кайтуу</button></div>`);
  overlay(`<div class="lgx"><div class="lg-ic">🚪</div><h2>Аккаунттан чыгасызбы?</h2>${D && D.online ? `<div class="lg-warn">🟢 Сиз азыр <b>линиядасыз</b>. Чыксаңыз линиядан да чыгасыз — заказ келбей калат.</div>` : ""}
      <p class="muted">Кайра кирүү үчүн номериңизди Telegram аркылуу кайра ырастайсыз.</p>
      <button class="btn lg-red" id="lgYes">Ооба, чыгуу</button><button class="btn ghost" id="lgNo">Калуу</button></div>`);
  $("#lgNo").onclick = closeOverlay;
  $("#lgYes").onclick = async () => { $("#lgYes").disabled = true; if (D && D.online) await api("/api/d/online", {on:false}); await api("/api/logout", {}); location.replace("/driver"); };
}
function navOn(k) { document.querySelectorAll("#bnav a").forEach(a => a.classList.toggle("on", a.dataset.k === k));
  const sh = document.querySelector(".sheet"); if (sh) sh.classList.add("cabbg"); }
// Ачык турган бөлүмдү кайра басса — панель жабылат, жабык болсо — ачылат
function openTab(k) {
  const cur = document.querySelector("#bnav a.on"), same = cur && cur.dataset.k === k;
  if (same && window.SHEET) { SHEET.isOpen() ? SHEET.collapse() : SHEET.expand(); return; }
  window.SHEET && SHEET.expand();
  if (k === "line") { lastView = ""; show(); } else if (k === "hist") viewHistory(); else if (k === "help") viewHelp(); else viewCabinet(k);
}
document.querySelectorAll("#bnav a").forEach(a => a.onclick = () => openTab(a.dataset.k));
function show() {
  if (!D || D.error) return;
  header();
  document.body.classList.toggle("dnav", D.status === "active" && !D.ride);
  if (D.status !== "active") {
    const k = "st" + D.status;
    if (k === lastView) return;
    lastView = k;
    if (!D.status || D.status === "rejected") return viewRegister();
    if (D.status === "pending") return render(`<h2>Арызыңыз текшерилүүдө</h2>
      <p class="muted">Админ документтериңизди карап чыгып, ырастайт. Адатта бир нече саат ичинде.${D.tg ? " Жыйынтыгы Telegram'га келет." : ""}</p>
      <div class="note">🚗 ${esc(carText(D.car_color, D.car_model))}, <b>${esc(D.car_plate)}</b></div>
      <button class="btn ghost" id="edit">Арызды оңдоо</button>`) || ($("#edit").onclick = viewRegister);
    return render(`<h2>Аккаунт бөгөттөлгөн</h2><p class="muted">Админ менен байланышыңыз.</p>`);
  }
  showOffer();
  if (chatOpen && D.ride) return unread();
  chatOpen = false;
  const key = D.ride ? "ride" + D.ride.id + D.ride.status + (D.next ? D.next.id : "") : (D.online ? "on" : "off") + (D.in_area === false ? "x" : "");
  if (key !== lastView) { if (D.ride && window.SHEET) SHEET.expand(); lastView = key; D.ride ? viewRide() : viewHome(); }
  else if (D.ride) unread();
  if (!D.ride) layer.clearLayers();
}

async function refresh() {
  const s = await api("/api/d/state");
  if (s.error === "auth") { clearInterval(poll); return viewLogin(false); }
  D = s;
  show();
}

async function boot() {
  const m = await api("/api/me"); ME_D = m;
  if (!m.auth) return viewLogin(m.pending, m.link);
  if (m.avatar) $("#cabBtn").innerHTML = `<img src="${esc(m.avatar)}" alt="" class="avbtn">`;
  await refresh();
  if (D.online || D.ride) { startGps(); wake(true); }
  else getPos().then(drawMe);
  clearInterval(poll); poll = setInterval(refresh, 2000);
}
boot();
</script>
