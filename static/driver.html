<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>Такси ТАП! — Айдоочу</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#17365C;--gold:#C9A03A;--gold2:#E3C368;--ink:#152741;--soft:#5A6880;--paper:#F1F4F9;--line:#E1E7F1;--ok:#1D9E75;--bad:#D8443A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
#map{position:fixed;inset:0;z-index:1}
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;gap:8px;align-items:flex-start}
.logo{background:var(--navy);color:#fff;font-weight:800;font-size:15px;padding:10px 12px;border-radius:14px}
.logo b{color:var(--gold2)}
.pill{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(20,20,30,.15);font-size:13px;line-height:1.2}
.pill b{display:block;font-size:16px;white-space:nowrap}
.rcol{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}.rcol .state{margin-left:0}
.state{margin-left:auto;font-weight:700;font-size:13px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 2px 10px rgba(20,20,30,.15)}
.state.on{background:var(--ok);color:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(20,20,30,.12);max-height:86vh;overflow:auto}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
h2{font-size:20px;margin:2px 0 10px}
.muted{color:var(--soft);font-size:13px}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;display:block;text-align:center;text-decoration:none}
.btn.main{background:var(--gold);color:#16161a}
.btn.go{background:var(--ok);color:#fff;font-size:19px;padding:20px}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.red{background:#FCEBEB;color:var(--bad)}
.btn:disabled{opacity:.5}
input.f{width:100%;font-size:17px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);margin-bottom:10px;outline:none;color:var(--ink)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.stat{background:var(--paper);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}
.offer{position:fixed;inset:0;z-index:20;background:rgba(20,20,30,.55);display:flex;align-items:flex-end}
.ocard{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.ring{width:74px;height:74px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px}
.oprice{font-size:34px;font-weight:800}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.bul{width:10px;height:10px;border-radius:50%;background:var(--navy);flex:none}
.bul.to{background:var(--gold)}
.two{display:flex;gap:10px}.two>*{flex:1}
.carm{width:30px;height:30px;border-radius:50%;background:var(--navy);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:14px}
.carm.me{background:var(--ok)}
.carm.to{background:var(--gold);color:#16161a}
.wait{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:14px}
.blink{width:12px;height:12px;border-radius:50%;background:var(--ok);animation:b 1.2s infinite}
@keyframes b{50%{opacity:.25}}
.hist{font-size:14px}
.hide{display:none!important}
table.fin{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.fin th{font-size:11px;color:var(--soft);font-weight:600;text-align:right;padding:6px 4px}
table.fin td{text-align:right;padding:9px 4px;border-top:1px solid var(--line)}
table.fin td:first-child,table.fin th:first-child{text-align:left}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.doc{border:1.5px dashed var(--line);border-radius:14px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--soft);text-align:center;padding:6px;cursor:pointer;background:var(--paper) center/cover no-repeat;position:relative}
.doc.ok{border:2px solid var(--ok);color:transparent}
.doc input{position:absolute;inset:0;opacity:0;cursor:pointer}
.doc i{font-style:normal;font-size:24px;display:block;margin-bottom:4px}
label.l{font-size:13px;color:var(--soft);display:block;margin:6px 0 4px}
.note{background:#fff8e6;border-radius:14px;padding:12px;font-size:14px;margin:6px 0}
.tag{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-right:4px}
.tag.g{background:var(--gold);color:#16161a}
.stars{display:flex;justify-content:center;gap:6px;font-size:36px;margin:6px 0}
.stars span{cursor:pointer;color:var(--line)}.stars span.on{color:var(--gold)}
.chatb{position:relative}
.chatb em{position:absolute;top:6px;right:10px;background:var(--bad);color:#fff;border-radius:10px;font-style:normal;font-size:12px;padding:1px 7px}
.msgs{max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.msgs div{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--paper);font-size:15px;align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msgs div.me{align-self:flex-end;background:var(--navy);color:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;font-size:13px;cursor:pointer}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);margin-top:10px}
</style>
<link rel="stylesheet" href="/static/theme.css?v=15">
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="lcol"><div class="logo"><img src="/static/icon-192.png" alt="">Такси <b>ТАП!</b></div>
    <div class="role"><a href="/">🧳 Жүргүнчүмүн</a><a class="on">🚗 Айдоочумун</a></div></div>
  <div class="rcol"><div class="state hide" id="stBadge">Офлайн</div>
    <div class="pill hide" id="earn"><span class="muted">Бүгүн</span><b id="earnV">0 с</b></div></div>
</div>
<div class="sheet"><div class="grab"></div><div id="view"></div></div>
<div class="offer hide" id="offer"><div class="ocard" id="ocard"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/area.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {credentials:"same-origin"} :
    {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json();
};
const map = L.map("map", {zoomControl:false}).setView([41.0377, 72.7470], 14);
setupArea(map, {zoom:14});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
const icon = (cls, t) => L.divIcon({className:"", html:`<div class="carm ${cls}">${t}</div>`, iconSize:[30,30], iconAnchor:[15,15]});
const layer = L.layerGroup().addTo(map);
let me = null, myHead = null, mySpeed = 0, myPos = null, D = null, poll = null, watch = null, lock = null, lastOffer = null, lastRide = null, pingT = null;

NAV.init(map, {onLocate: () => getPos().then(p => { if (p) { drawMe(); map.setView(p, Math.max(map.getZoom(), 16)); } })});
// ---------- GPS ----------
function startGps() {
  if (!navigator.geolocation || watch !== null) return;
  watch = navigator.geolocation.watchPosition(p => {
    myPos = [p.coords.latitude, p.coords.longitude]; myHead = p.coords.heading; mySpeed = p.coords.speed;
    drawMe();
  }, () => {}, {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
  clearInterval(pingT);
  pingT = setInterval(() => { if (myPos && D && D.online) api("/api/d/location", {p:myPos}); }, 5000);
}
function getPos() {
  return new Promise(res => {
    if (myPos) return res(myPos);
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => { myPos = [p.coords.latitude, p.coords.longitude]; res(myPos); },
      () => res(null), {enableHighAccuracy:true, timeout:10000});
  });
}
function drawMe() {
  if (!myPos) return;
  NAV.set(myPos, myHead, mySpeed);
  if (!me) { me = true; map.setView(myPos, 16); }
}
async function wake(on) {
  try {
    if (on && "wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); }
    if (!on && lock) { await lock.release(); lock = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && D && D.online) wake(true); });

// ---------- үн ----------
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.25, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t + 0.2);
      o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.22);
    });
    navigator.vibrate && navigator.vibrate([300, 120, 300]);
  } catch (e) {}
}

// ---------- көрүнүштөр ----------
const render = h => { $("#view").innerHTML = h; window.SHEET && SHEET.refresh(); };
const navUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${p[0]},${p[1]}`;

function viewLogin(pending, link, err) {
  $("#earn").classList.add("hide"); $("#stBadge").classList.add("hide");
  if (pending) {
    render(`<h2>Номериңизди ырастаңыз</h2><p class="muted">Telegram'да ботко өтүп, «Номеримди жөнөтүү» басыңыз.</p>
      ${link ? `<a class="btn dark" href="${esc(link)}" target="_blank">Telegram'да ырастоо</a>` : ""}
      <button class="btn ghost" id="relog">Артка</button>`);
    $("#relog").onclick = () => viewLogin(false);
    const t = setInterval(async () => { const m = await api("/api/me"); if (m.auth) { clearInterval(t); boot(); } }, 2500);
    return;
  }
  render(`<h2>Айдоочунун кабинети</h2>
    <p class="muted">Номериңиз менен кириңиз. Айдоочу эмес болсоңуз — кийинки кадамда арыз толтурасыз.</p>
    <input class="f" id="nm" placeholder="Атыңыз" autocomplete="given-name">
    <input class="f" id="ph" placeholder="0700 123 456" inputmode="tel" autocomplete="tel">
    <div class="err" id="er">${esc(err || "")}</div>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft);margin:2px 0 6px">
      <input type="checkbox" id="agree" style="width:20px;height:20px;flex:none;margin-top:1px">
      <span><a href="/terms" target="_blank" style="color:var(--navy)">Колдонуу шарттары жана купуялык саясаты</a> менен макулмун</span></label>
    <button class="btn main" id="go">Кирүү</button>`);
  $("#ph").oninput = () => $("#er").textContent = "";
  $("#go").onclick = async () => {
    if (!$("#agree").checked) return $("#er").textContent = "Шарттар менен макул экениңизди белгилеңиз.";
    const r = await api("/api/login", {phone:$("#ph").value, name:$("#nm").value, kind:"driver", agree:true});
    if (r.error) return $("#er").textContent = "Номерди толук жазыңыз: 0700 123 456";
    r.auth ? boot() : viewLogin(true, r.link);
  };
}

function header() {
  const act = D.status === "active";
  $("#earn").classList.toggle("hide", !act); $("#stBadge").classList.toggle("hide", !act);
  if (!act) return;
  $("#earnV").textContent = D.today.earned + " с";
  $("#stBadge").textContent = D.ride ? "Сапарда" : D.online ? "Онлайн" : "Офлайн";
  $("#stBadge").classList.toggle("on", D.online || !!D.ride);
}

const ICON = {econom:"🚕", comfort:"🚘", minivan:"🚐", delivery:"📦"};
const clsTag = c => c && c !== "econom" ? `<span class="tag g">${ICON[c] || ""} ${esc((D.class_names || {})[c] || c)}</span>` : "";
function homeHTML() {
  const h = D.home || {};
  if (!h.set) return `<div class="sw"><div><b>🏠 Үйгө карай</b><div class="muted">Үйүңүздүн жагына бара турган заказдар гана келет. Адегенде үйүңүздү белгилеңиз.</div></div>
    <button class="btn ghost" id="hset" style="width:auto;margin:0;padding:10px 12px;font-size:14px;white-space:nowrap;flex:none">Ушул жер — үйүм</button></div>`;
  return `<div class="sw"><div><b>🏠 Үйгө карай</b><div class="muted">${h.on ? "Күйүк: үйүңүздүн жагына заказдар гана келет" : `Бүгүн дагы ${h.left} жолу күйгүзсө болот`}</div>
    <a href="#" id="hset" class="muted" style="font-size:12px">Үйдүн жерин жаңыртуу (азыркы жериңиз)</a></div>
    <input type="checkbox" id="hon" ${h.on ? "checked" : ""} ${!h.on && !h.left ? "disabled" : ""} style="width:24px;height:24px"></div>`;
}
function bindHome() {
  const hs = $("#hset"); if (hs) hs.onclick = async e => { e.preventDefault();
    const p = await getPos(); if (!p) return alert("GPS'ке уруксат бериңиз.");
    if (!confirm("Азыркы жериңизди үйүңүз катары сактайсызбы?")) return;
    D = await api("/api/d/home_set", {p}); lastView = ""; show(); };
  const ho = $("#hon"); if (ho) ho.onchange = async () => {
    D = await api("/api/d/home", {on:ho.checked});
    if (D.error === "home_limit") alert("Бүгүнкү лимит бүттү (күнүнө 2 жолу).");
    lastView = ""; show(); };
}

// ---------- айдоочу дарек сунуштайт (турган жеринен) ----------
function viewAddAddr() {
  const K = [["poi","📍 Белгилүү жер"],["shop","🏪 Дүкөн"],["food","🍽 Кафе / той-кана"],["school","🏫 Мектеп / бала бакча"],
             ["health","🏥 Оорукана / дарыкана"],["mosque","🕌 Мечит"],["gov","🏛 Мекеме"],["bus","🚌 Бекет"],["street","🛣 Көчө"],["village","🏘 Айыл / кичи район"]];
  render(`<h2>📍 Дарек кошуу</h2>
    <p class="muted">Ушул жерде турганда атын жазыңыз — жайгашкан жериңиз GPS'тен алынат. Жүргүнчүлөр кийин бул жерди тизмеден табышат.</p>
    <input class="f" id="an" maxlength="80" placeholder="Мис. Нурбек той-кана, Ак-Тилек дүкөнү">
    <select class="f" id="ak" style="width:100%">${K.map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select>
    <div class="err" id="ae"></div>
    <button class="btn main" id="as">Кошуу</button><button class="btn ghost" id="ab">Артка</button>`);
  $("#ab").onclick = viewCabinet;
  $("#as").onclick = async () => {
    const nm = $("#an").value.trim(); if (nm.length < 2) return $("#ae").textContent = "Атын жазыңыз.";
    $("#as").disabled = true;
    const p = await getPos(); if (!p) { $("#as").disabled = false; return $("#ae").textContent = "GPS'ке уруксат бериңиз."; }
    const r = await api("/api/d/addr_suggest", {name:nm, kind:$("#ak").value, p});
    if (r.error) { $("#as").disabled = false; return $("#ae").textContent = "Кошулган жок: жер иштөө аймагынын ичинде болушу керек."; }
    render(`<h2>✓ Рахмат!</h2><p class="muted">«${esc(nm)}» сунушталды. Админ ырастагандан кийин (же дагы бир адам ушул жерди белгилесе) тизмеге кошулат.</p>
      <button class="btn main" id="more">Дагы кошуу</button><button class="btn ghost" id="ab">Артка</button>`);
    $("#more").onclick = viewAddAddr; $("#ab").onclick = viewCabinet;
  };
  $("#an").focus();
}

function outHTML() {
  if (D.in_area !== false) return "";
  return `<div class="note" style="background:#fdecef!important;border-color:#f5c2cb!important">⚠️ <b>Сиз ${D.area_name ? esc(D.area_name) + " районунун" : "иштөө аймагынын"} сыртындасыз.</b>
    Такси ТАП! сервиси ${D.area_name ? esc(D.area_name) + " районунун аймагында" : "иштөө аймагында"} гана иштейт — бул жерде заказ келбейт. Аймакка киргенде заказдар өзү келе баштайт.</div>`;
}

function viewHome() {
  const low = D.balance < D.min_balance;
  const stats = `<div class="grid">
      <div class="stat"><span class="muted">Бүгүн сапар</span><b>${D.today.rides}</b></div>
      <div class="stat"><span class="muted">Баланс</span><b style="color:${low ? "var(--bad)" : "inherit"}">${D.balance} с</b></div>
      <div class="stat"><span class="muted">Рейтинг</span><b>★ ${D.rating ?? "5.0"}</b></div>
      <div class="stat"><span class="muted">Бардык сапар</span><b>${D.rides_done ?? 0}</b></div></div>`;
  const topup = D.pending_topup ? `<div class="note">🕓 Чегиңиз текшерилүүдө. Ырасталганда балансыңызга кошулат.</div>`
    : `<button class="btn ghost" id="top">➕ Балансты толуктоо</button>`;
  const sw = D.tg ? `<div class="sw"><div><b>Telegram билдирүүлөрү</b><div class="muted">Сайт жабык болсо да жаңы заказ жөнүндө кабар келет</div></div>
    <input type="checkbox" id="nt" ${D.notify ? "checked" : ""} style="width:24px;height:24px"></div>` : "";
  if (D.online) {
    render(`${outHTML()}<div class="wait"><div class="blink"${D.in_area === false ? ' style="background:var(--bad)"' : ""}></div><div><b>${D.in_area === false ? "Заказ келбейт — аймактын сыртындасыз" : "Заказ күтүлүүдө"}${D.home && D.home.on ? " · 🏠 үйгө карай" : ""}</b><div class="muted">${D.in_area === false ? "1 сааттын ичинде аймакка кирбесеңиз, линиядан өзү чыгарылат" : "Экранды өчүрбөңүз — GPS иштеп турат"}</div></div></div>
      ${stats}${homeHTML()}<button class="btn red" id="off">Линиядан чыгуу</button>`);
    bindHome();
    $("#off").onclick = async () => { D = await api("/api/d/online", {on:false}); wake(false); lastView = ""; show(); };
  } else {
    render(`<h2>Салам, ${esc(D.name || "айдоочу")}!</h2><p class="muted">${esc(D.car_color)} ${esc(D.car_model)}, ${esc(D.car_plate)}</p>
      ${low ? `<p class="err">Баланс жетишсиз — заказдар келбейт.</p>` : ""}${outHTML()}
      <button class="btn go" id="on">Линияга чыгуу</button>
      <div class="err" id="er"></div>${stats}${topup}
      <button class="btn ghost" id="cab">💼 Менин кабинетим</button>
      ${homeHTML()}${sw}
      ${installHTML()}<button class="btn ghost" id="out">Чыгуу</button>`);
    bindInstall();
    $("#top") && ($("#top").onclick = viewTopup);
    $("#cab").onclick = viewCabinet;
    $("#nt") && ($("#nt").onchange = () => api("/api/notify", {on:$("#nt").checked}));
    $("#out").onclick = async () => { await api("/api/logout", {}); location.reload(); };

function waitText(r) {
  const w = r.wait; if (!w || !w.arrived_at) return "";
  const skew = Date.now() / 1000 - w.now, left = Math.round(w.arrived_at + w.free_min * 60 - (Date.now() / 1000 - skew));
  if (left > 0) return `⏳ Акысыз күтүү: <b>${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}</b>`;
  return `⏳ Акылуу күтүү: <b>+${w.fee} сом</b> (${w.per_min} с/мүн) — баага кошулат`;
}

// ---------- сүрөттү кичирейтүү (браузерде) ----------
function shrink(file, max = 1600, q = 0.72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function docInput(el, store, key) {
  el.querySelector("input").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    store[key] = await shrink(f);
    el.style.backgroundImage = `url(${store[key]})`; el.classList.add("ok");
  };
}

  header();
  if (D.status !== "active") {
    const k = "st" + D.status;
    if (k === lastView) return;
    lastView = k;
    if (!D.status || D.status === "rejected") return viewRegister();
    if (D.status === "pending") return render(`<h2>Арызыңыз текшерилүүдө</h2>
      <p class="muted">Админ документтериңизди карап чыгып, ырастайт. Адатта бир нече саат ичинде.${D.tg ? " Жыйынтыгы Telegram'га келет." : ""}</p>
      <div class="note">🚗 ${esc(D.car_color)} ${esc(D.car_model)}, <b>${esc(D.car_plate)}</b></div>
      <button class="btn ghost" id="edit">Арызды оңдоо</button>`) || ($("#edit").onclick = viewRegister);
    return render(`<h2>Аккаунт бөгөттөлгөн</h2><p class="muted">Админ менен байланышыңыз.</p>`);
  }
  showOffer();
  if (chatOpen && D.ride) return unread();
  chatOpen = false;
  const key = D.ride ? "ride" + D.ride.id + D.ride.status + (D.next ? D.next.id : "") : (D.online ? "on" : "off") + (D.in_area === false ? "x" : "");
  if (key !== lastView) { if (D.ride && window.SHEET) SHEET.expand(); lastView = key; D.ride ? viewRide() : viewHome(); }
  else if (D.ride) unread();
  if (!D.ride) layer.clearLayers();
}

async function refresh() {
  const s = await api("/api/d/state");
  if (s.error === "auth") { clearInterval(poll); return viewLogin(false); }
  D = s;
  show();
}

async function boot() {
  const m = await api("/api/me");
  if (!m.auth) return viewLogin(m.pending, m.link);
  await refresh();
  if (D.online || D.ride) { startGps(); wake(true); }
  else getPos().then(drawMe);
  clearInterval(poll); poll = setInterval(refresh, 2000);
}
boot();
</script>
</body>
</html>
