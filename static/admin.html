<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>Такси ТАП! — Админ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#17365C;--gold:#C9A03A;--gold2:#E3C368;--ink:#152741;--soft:#5A6880;--paper:#F1F4F9;--line:#E1E7F1;--ok:#1D9E75;--bad:#D8443A;--warn:#BA7517}
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header .logo{font-weight:800;font-size:17px}header .logo b{color:var(--gold2)}
header .live{margin-left:auto;font-size:12px;opacity:.8}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:9}
nav button{border:0;background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;position:relative}
nav button.on{background:var(--navy);color:#fff}
nav .badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:5px}
main{padding:12px;max-width:1100px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.card span{font-size:12px;color:var(--soft)}.card b{display:block;font-size:24px;margin-top:2px}
#map{height:420px;border-radius:14px;border:1px solid var(--line);overflow:hidden;position:relative;background:#EDEAE2}
.legend{display:flex;gap:14px;font-size:12px;color:var(--soft);margin:8px 2px 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.panel{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.panel h3{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.item{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border:0}
.item .main{flex:1;min-width:170px}.item .main b{display:block}
.muted{color:var(--soft);font-size:13px}
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--paper);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:#FCEBEB;color:var(--bad)}.btn.gold{background:var(--gold);color:#16161a}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap}
.t-searching{background:#FAEEDA;color:#854F0B}.t-scheduled{background:#EEEDFE;color:#3C3489}.t-accepted,.t-arrived{background:#E6F1FB;color:#0C447C}
.t-in_trip{background:#E1F5EE;color:#085041}.t-completed{background:#EAF3DE;color:#27500A}.t-cancelled{background:#F1EFE8;color:#5F5E5A}
.t-active{background:#E1F5EE;color:#085041}.t-pending{background:#FAEEDA;color:#854F0B}.t-blocked,.t-rejected{background:#FCEBEB;color:#A32D2D}
.empty{padding:18px 14px;color:var(--soft);font-size:14px}
input.f{font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);width:100%;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--soft);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
td input.f{padding:7px 8px;max-width:90px;min-width:58px}
.scroll table{min-width:620px}
.scroll{overflow-x:auto}
.login{max-width:380px;margin:60px auto;background:#fff;border-radius:18px;padding:22px;border:1px solid var(--line)}
.login h2{margin:0 0 12px}.login .btn{width:100%;padding:14px;font-size:16px;margin-top:10px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.proof{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--paper);cursor:zoom-in}
.mk{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.hide{display:none!important}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:14px 14px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--soft)}
.bars i{display:block;width:100%;max-width:46px;background:var(--gold);border-radius:6px 6px 0 0;min-height:2px}
.bars b{font-size:12px;color:var(--ink);margin-bottom:4px}
.fset{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:12px 14px}
.fset label{font-size:12px;color:var(--soft);display:block;margin-bottom:4px}
.mode{display:inline-block;background:#E1F5EE;color:#085041;font-weight:700;border-radius:10px;padding:6px 12px;font-size:14px}
#amap{height:min(62vh,520px);border-radius:14px;border:1px solid var(--line);overflow:hidden;position:relative;background:#EDEAE2}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tools .btn{padding:11px 14px;font-size:14px}
.vx{width:16px;height:16px;border-radius:50%;background:#D8443A;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vx.first{background:#1D9E75;width:20px;height:20px}
.docs{display:flex;gap:8px;margin-top:8px}.docs a{display:block}.docs img{width:92px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
.docs span{display:block;font-size:11px;color:var(--soft);text-align:center;margin-top:2px}
</style>
<link rel="stylesheet" href="/static/theme.css?v=20">
</head>
<body class="adm">
<header><div class="logo"><img src="/static/icon-192.png" alt="">Такси <b>ТАП!</b><span class="ver">Админ</span></div><div class="live" id="live"></div></header>
<nav id="nav" class="hide">
  <button data-t="map" class="on">Карта</button>
  <button data-t="drivers">Айдоочулар<span class="badge hide" id="bD"></span></button>
  <button data-t="topups">Толуктоо<span class="badge hide" id="bT"></span></button>
  <button data-t="rides">Сапарлар</button>
  <button data-t="finance">Каржы</button>
  <button data-t="tariffs">Тарифтер</button>
  <button data-t="addr">Даректер</button>
  <button data-t="area">Аймак</button>
</nav>
<main id="main"></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/area.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (p, b) => (await fetch(p, b === undefined ? {credentials:"same-origin"} :
  {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b)})).json();
const ST = {scheduled:"Алдын ала", searching:"Изделүүдө", accepted:"Айдоочу жолдо", arrived:"Күтүүдө", in_trip:"Жолдо", completed:"Бүттү", cancelled:"Жабылды",
            active:"Активдүү", pending:"Текшерүүдө", blocked:"Бөгөттөлгөн", rejected:"Четке кагылды"};
const tag = s => `<span class="tag t-${s}">${ST[s] || s}</span>`;
const when = t => t ? new Date(t * 1000).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
let tab = "map", O = null, map = null, lyr = null, fitted = false, timer = null;

// ---------- кирүү ----------
function login(pending, link) {
  $("#nav").classList.add("hide");
  $("#main").innerHTML = pending
    ? `<div class="login"><h2>Номерди ырастаңыз</h2><p class="muted">Telegram'да ботко өтүп, номериңизди жөнөтүңүз.</p>
       ${link ? `<a href="${esc(link)}" target="_blank"><button class="btn gold">Telegram'да ырастоо</button></a>` : ""}</div>`
    : `<div class="login"><h2>Админ панели</h2><p class="muted">Админдин номери (ADMIN_PHONES же ADMIN_IDS).</p>
       <input class="f" id="ph" placeholder="0700 123 456" inputmode="tel"><div class="err" id="er"></div>
       <button class="btn gold" id="go">Кирүү</button></div>`;
  if (pending) { const t = setInterval(async () => { if ((await api("/api/me")).auth) { clearInterval(t); boot(); } }, 2500); return; }
  $("#go").onclick = async () => {
    const r = await api("/api/login", {phone:$("#ph").value, kind:"admin"});
    if (r.error) return $("#er").textContent = r.error === "not_admin" ? "Бул номер админ эмес." : "Номерди толук жазыңыз.";
    r.auth ? boot() : login(true, r.link);
  };
}

// ---------- карта ----------
function viewMap() {
  const s = O.stats;
  $("#main").innerHTML = `<div class="cards">
    <div class="card"><span>Онлайн айдоочу</span><b>${s.online}</b><span>${s.busy} сапарда${s.online_out ? ` · ${s.online_out} аймактан сыртта` : ""}</span></div>
    <div class="card"><span>Активдүү заказ</span><b>${s.active}</b><span>${s.searching} изделүүдө</span></div>
    <div class="card"><span>Бүгүн бүттү</span><b>${s.done_today}</b><span>${s.lost_today} айдоочусуз калды</span></div>
    <div class="card"><span>Бүгүнкү жүгүртүү</span><b>${s.gross_today.toLocaleString("ru-RU")} с</b><span>комиссия ${s.fee_today} с</span></div></div>
    <div class="panel" id="po"><div class="item"><div class="main"><b>📞 Телефон аркылуу заказ</b>
      <span class="muted">Кардар чалса — номерин жазып, картадан жерин басыңыз. Заказ жакынкы айдоочуга кетет, айдоочу кардарга өзү чалат.</span></div>
      <button class="btn gold" id="poOpen">Жаңы заказ</button></div><div id="poForm"></div></div>
    <div id="map"></div>
    <div class="legend"><label style="cursor:pointer"><input type="checkbox" id="lostT"> <i style="background:#D8443A"></i>Айдоочусуз калгандар (7 күн)</label><span><i style="background:var(--ok)"></i>Бош айдоочу</span><span><i style="background:var(--navy)"></i>Сапардагы айдоочу</span><span><i style="background:var(--gold)"></i>Айдоочу изделүүдө</span><span><i style="background:#378ADD"></i>Жүргүнчү күтүп турат</span></div>
    <div class="panel"><h3>Активдүү заказдар</h3><div id="act"></div></div>`;
  map = L.map("map", {zoomControl:true}).setView([41.0377, 72.7470], 12);
  setupArea(map, {minZoom:9, center:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  lyr = L.layerGroup().addTo(map); fitted = false; drawMap();
  PO.lyr = L.layerGroup().addTo(map);
  const lostL = L.layerGroup().addTo(map);
  $("#lostT").onchange = async e => {
    lostL.clearLayers();
    if (!e.target.checked) return;
    const {lost} = await api("/api/a/lost?days=7");
    lost.forEach(x => L.circleMarker([x.p_lat, x.p_lon], {radius:7, color:"#D8443A", fillColor:"#D8443A", fillOpacity:.45, weight:1})
      .bindTooltip(new Date(x.created_at * 1000).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})).addTo(lostL));
    if (!lost.length) alert("Акыркы 7 күндө айдоочусуз калган заказ жок.");
  };
  map.on("click", e => { if (!PO.pick) return; PO[PO.pick] = [e.latlng.lat, e.latlng.lng]; PO.pick = null; phoneForm(); });
  $("#poOpen").onclick = () => { Object.assign(PO, {open:true, p:null, d:null, pick:"p"}); phoneForm(); };
}

// ---------- телефон заказ (диспетчер) ----------
const PO = {open:false, p:null, d:null, pick:null, lyr:null};
async function phoneForm() {
  const box = $("#poForm"); if (!box) return;
  PO.lyr && PO.lyr.clearLayers();
  if (!PO.open) { box.innerHTML = ""; return; }
  if (PO.p) L.marker(PO.p, {icon:dot("#378ADD")}).addTo(PO.lyr);
  if (PO.d) L.marker(PO.d, {icon:dot("#C9A03A")}).addTo(PO.lyr);
  const keep = id => ($("#" + id) || {}).value || "";
  const vals = {ph:keep("poPh"), nm:keep("poNm"), nt:keep("poNt")};
  let price = "";
  if (PO.p) { const q = await api("/api/a/quote", {p:PO.p, d:PO.d});
    price = !q.city ? `<span class="err">Бул жер иштөө аймагынын сыртында</span>`
      : q.dest_out ? `<span class="err">Бара турган жер райондун сыртында — шаар аралык каттам жок</span>`
      : `Баасы: <b>${q.price ? q.price + " сом" : "тариф боюнча"}</b>${q.dist_km ? " · ~" + q.dist_km + " км" : ""}`; }
  const pickTxt = k => PO.pick === k ? "👆 Картадан басыңыз…" : PO[k] ? "✓ Белгиленди (өзгөртүү)" : "Картадан белгилөө";
  box.innerHTML = `<div class="fset">
      <div><label>Телефон</label><input class="f" id="poPh" inputmode="tel" placeholder="0700 123 456" value="${esc(vals.ph)}"></div>
      <div><label>Аты</label><input class="f" id="poNm" placeholder="Айгүл эже" value="${esc(vals.nm)}"></div>
      <div><label>Кайдан</label><button class="btn" id="poP" style="width:100%">${pickTxt("p")}</button></div>
      <div><label>Кайда</label><button class="btn" id="poD" style="width:100%">${pickTxt("d")}</button></div>
      <div style="grid-column:1/-1"><label>Белги (айдоочуга көрүнөт)</label><input class="f" id="poNt" placeholder="Базардын жанында, көк дарбаза" value="${esc(vals.nt)}"></div>
    </div><div style="padding:0 14px 14px"><div class="muted" style="margin-bottom:8px">${price}</div>
      <button class="btn ok" id="poGo">Заказ берүү</button> <button class="btn" id="poX">Жабуу</button> <span class="err" id="poEr"></span></div>`;
  $("#poP").onclick = () => { PO.pick = "p"; phoneForm(); };
  $("#poD").onclick = () => { PO.pick = "d"; phoneForm(); };
  $("#poX").onclick = () => { PO.open = false; phoneForm(); };
  $("#poGo").onclick = async () => {
    if (!PO.p) return $("#poEr").textContent = "Кайдан экенин картадан басыңыз.";
    if (!PO.d) return $("#poEr").textContent = "Кайда барарын картадан басыңыз.";
    const r = await api("/api/a/order", {phone:$("#poPh").value, name:$("#poNm").value, note:$("#poNt").value, p:PO.p, d:PO.d});
    if (r.error) return $("#poEr").textContent = {bad_phone:"Номерди толук жазыңыз.", have_active:"Бул номерде активдүү заказ бар.",
      no_city:"Бул жер иштөө аймагынын сыртында.", need_dest:"Кайда барарын картадан белгилеңиз.", dest_out:"Бара турган жер райондун сыртында.", bad_point:"Жерди белгилеңиз."}[r.error] || "Ката.";
    PO.open = false; phoneForm(); refresh();
  };
}
const dot = c => L.divIcon({className:"", html:`<div class="mk" style="background:${c}"></div>`, iconSize:[24,24], iconAnchor:[12,12]});
function drawMap() {
  if (!lyr) return;
  lyr.clearLayers();
  const pts = [];
  O.drivers.forEach(d => { pts.push(d.pos); L.marker(d.pos, {icon:dot(d.busy ? "#17365C" : "#1D9E75")}).bindTooltip(`${esc(d.name)} · ${esc(d.plate)}`).addTo(lyr); });
  O.rides.forEach(r => {
    if (["searching", "accepted", "arrived"].includes(r.status)) { pts.push(r.p); L.marker(r.p, {icon:dot(r.status === "searching" ? "#C9A03A" : "#378ADD")}).bindTooltip(`№${r.id} · ${esc(r.passenger)}`).addTo(lyr); }
  });
  if (!fitted && pts.length) { map.fitBounds(L.latLngBounds(pts.length > 1 ? pts : [pts[0], pts[0]]), {padding:[40, 40], maxZoom:15}); fitted = true; }
  const act = $("#act");
  const CLS = {comfort:"🚘 Комфорт", minivan:"🚐 Минивэн", delivery:"📦 Жеткирүү"};
  if (act) act.innerHTML = O.rides.length ? O.rides.map(r => `<div class="item"><div class="main"><b>${r.source === "phone" ? "📞 " : ""}№${r.id} · ${esc(r.passenger || "")} ${tag(r.status)} ${CLS[r.cls] ? `<span class="tag">${CLS[r.cls]}</span>` : ""}</b>
      ${r.other ? `<span class="muted">👤 ${esc(r.other)}</span>` : ""}
      ${r.note ? `<span class="muted">📝 ${esc(r.note)}</span>` : ""}
      ${r.scheduled_at ? `<span class="muted">🕐 ${new Date(r.scheduled_at * 1000).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})}</span>` : ""}
      <span class="muted">${esc(r.city)} · ${r.price ? r.price + " с" : "тариф"} · ${Math.floor(r.age / 60)} мүн мурун · ${esc(r.phone || "")}</span></div>
      <button class="btn bad" data-cx="${r.id}">Жокко чыгаруу</button></div>`).join("") : `<div class="empty">Азыр активдүү заказ жок.</div>`;
  act && act.querySelectorAll("[data-cx]").forEach(b => b.onclick = async () => {
    if (!confirm("№" + b.dataset.cx + " заказды жокко чыгарасызбы?")) return;
    await api("/api/a/cancel", {id:+b.dataset.cx}); refresh();
  });
}

// ---------- айдоочулар ----------
async function viewDrivers() {
  const {drivers} = await api("/api/a/drivers");
  const pend = drivers.filter(d => d.status === "pending"), rest = drivers.filter(d => d.status !== "pending");
  const file = n => n ? `/api/a/file?n=${encodeURIComponent(n)}` : "";
  const docs = d => `<div class="docs">${[["doc_license", "Күбөлүк"], ["doc_techpass", "Техпаспорт"], ["doc_car", "Унаа"]].map(([k, t]) =>
      d[k] ? `<a href="${file(d[k])}" target="_blank"><img src="${file(d[k])}" alt="${t}" loading="lazy"><span>${t}</span></a>` : "").join("")}</div>`;
  const row = d => `<div class="item"><div class="main"><b>${esc(d.name)} ${tag(d.status)} ${d.is_online ? '<span class="tag t-in_trip">онлайн</span>' : ""}</b>
      <span class="muted">${esc(d.phone)} · ${esc(d.car_color)} ${esc(d.car_model)}, ${esc(d.car_plate)}${d.status === "active" || d.status === "blocked" ? ` · ★ ${d.rating} · ${d.rides_done} сапар · баланс <b>${Math.round(d.balance)} с</b>` : ""}</span>
      ${d.status === "rejected" && d.reject_note ? `<span class="muted">Себеби: ${esc(d.reject_note)}</span>` : ""}${d.status === "pending" ? docs(d) : ""}
      ${d.status === "active" ? `<span class="muted" data-cl="${esc(d.uid)}">${[["econom","Эконом"],["comfort","Комфорт"],["minivan","Минивэн"],["delivery","Жеткирүү"]].map(([c, t]) =>
        `<label style="margin-right:10px;white-space:nowrap"><input type="checkbox" value="${c}" ${(d.classes || "econom,delivery").split(",").includes(c) ? "checked" : ""}> ${t}</label>`).join("")}</span>` : ""}</div>
      ${d.status === "pending" ? `<button class="btn ok" data-a="approve" data-u="${esc(d.uid)}">Ырастоо</button><button class="btn bad" data-a="reject" data-u="${esc(d.uid)}">Баш тартуу</button>`
        : `<button class="btn" data-bal="${esc(d.uid)}">± Баланс</button>` + (d.status === "blocked"
          ? `<button class="btn ok" data-a="unblock" data-u="${esc(d.uid)}">Ачуу</button>` : `<button class="btn bad" data-a="block" data-u="${esc(d.uid)}">Бөгөттөө</button>`)}</div>`;
  $("#main").innerHTML = (pend.length ? `<div class="panel"><h3>Ырастоону күткөндөр (${pend.length})</h3>${pend.map(row).join("")}</div>` : "")
    + `<div class="panel"><h3>Бардык айдоочулар (${rest.length})</h3>${rest.map(row).join("") || `<div class="empty">Айдоочу жок.</div>`}</div>`;
  $("#main").querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    let reason = "";
    if (b.dataset.a === "block" && !confirm("Бөгөттөйсүзбү?")) return;
    if (b.dataset.a === "reject") { reason = prompt("Себеби (айдоочуга көрүнөт):", "Документтин сүрөтү бүдөмүк"); if (reason === null) return; }
    await api("/api/a/driver", {uid:b.dataset.u, action:b.dataset.a, reason}); viewDrivers(); refresh();
  });

    const cl = [...box.querySelectorAll("input:checked")].map(x => x.value);
    if (!cl.length) { i.checked = true; return; }
    await api("/api/a/driver_classes", {uid:box.dataset.cl, classes:cl});
  }));

    await api("/api/a/balance", {uid:b.dataset.bal, amount:+v}); viewDrivers();
  });
}

// ---------- аймак (иштөө чеги) ----------
let amap = null, alyr = null, draw = null;
async function viewArea() {
  const a = await (await fetch("/api/area")).json();
  const src = {custom:"өзүңүз тарткан чек", osm:"OpenStreetMap'теги райондун чеги", bbox:"болжолдуу төрт бурчтук"}[a.source] || a.source;
  $("#main").innerHTML = `<div class="panel"><h3>Иштөө аймагы: ${esc(a.name)}</h3>
      <div class="item"><div class="main"><span class="muted">Азыркы чек: <b>${esc(src)}</b>. Жүргүнчүлөр ушул чектин ичинде гана заказ бере алат.</span></div></div></div>
    <div id="amap"></div>
    <div class="tools" id="tools"></div>
    <p class="muted" id="hint"></p>`;
  amap = L.map("amap", {zoomControl:true}).setView(a.center, 11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(amap);
  alyr = L.layerGroup().addTo(amap);
  const rings = areaRings(a.geojson).map(r => r.map(([lon, lat]) => [lat, lon]));
  rings.forEach(r => L.polygon(r, {color:"#17365C", weight:2, fillColor:"#1D9E75", fillOpacity:.12}).addTo(alyr));
  if (rings.length) amap.fitBounds(L.latLngBounds(rings.flat()), {padding:[20, 20]});
  draw = null; areaTools(a);
  amap.on("click", e => { if (!draw) return; draw.push([e.latlng.lat, e.latlng.lng]); drawPreview(); });
}
function areaTools(a) {
  const t = $("#tools");
  if (!draw) {
    t.innerHTML = `<button class="btn gold" id="aNew">✏️ Жаңы чек тартуу</button>
      ${a.source === "custom" ? `<button class="btn" id="aReset">↺ Райондун чегине кайтаруу</button>` : ""}`;
    $("#hint").textContent = "«Жаңы чек тартуу» басып, картаны аймактын четтери боюнча кезек-кезек басыңыз. Кеминде 3 чекит.";
    $("#aNew").onclick = () => { draw = []; alyr.clearLayers(); drawPreview(); areaTools(a); };
    const r = $("#aReset");
    if (r) r.onclick = async () => { if (!confirm("Өзүңүз тарткан чекти өчүрүп, райондун чегине кайтасызбы?")) return;
      await api("/api/a/area", {reset:true}); setTimeout(viewArea, 1500); };
    return;
  }
  t.innerHTML = `<button class="btn ok" id="aSave">✓ Сактоо</button><button class="btn" id="aUndo">↶ Акыркы чекит</button>
    <button class="btn bad" id="aCancel">Жокко чыгаруу</button>`;
  $("#aSave").onclick = async () => {
    if (draw.length < 3) return $("#hint").textContent = "Кеминде 3 чекит коюңуз.";
    const r = await api("/api/a/area", {points:draw});
    if (r.error) return $("#hint").textContent = "Сакталган жок: чекиттер Кыргызстандын ичинде болушу керек.";
    draw = null; viewArea();
  };
  $("#aUndo").onclick = () => { draw.pop(); drawPreview(); };
  $("#aCancel").onclick = () => { draw = null; viewArea(); };
}
function drawPreview() {
  alyr.clearLayers();
  if (draw.length > 1) L.polygon(draw, {color:"#D8443A", weight:3, dashArray:"8 6", fillColor:"#D8443A", fillOpacity:.1}).addTo(alyr);
  draw.forEach((p, i) => L.marker(p, {icon:L.divIcon({className:"", html:`<div class="vx ${i ? "" : "first"}"></div>`,
    iconSize:[20, 20], iconAnchor:[10, 10]}), interactive:false}).addTo(alyr));
  $("#hint").textContent = draw.length ? `${draw.length} чекит. Аймакты толук айланып чыккандан кийин «Сактоо» басыңыз.` : "Картаны аймактын четтери боюнча басыңыз.";
}

        <button class="btn ${DONLY === "" ? "gold" : ""}" data-only="">Баары</button>
        <button class="btn ${DONLY === "pending" ? "gold" : ""}" data-only="pending">🆕 Жаңы сунуштар (${c.pending})</button>
        <button class="btn ${DONLY === "approx" ? "gold" : ""}" data-only="approx">📍 Жери болжолдуу (${c.approx})</button>
        <span class="muted">${DONLY === "pending" ? "Жүргүнчүлөр жана айдоочулар сунуштаган жерлер. ✓ басыңыз — тизмеге кошулат. 3 добуш чогулса (айдоочу = 2) өзү кошулат."
          : DONLY === "approx" ? "Аты интернеттен алынган, жери шаардын борбору коюлган. «Оңдоо» басып, картадан так жерин белгилеңиз." : ""}</span></div>
      <div id="dForm"></div></div>
    <div class="panel"><div style="padding:10px 14px"><input class="f" id="dQ" placeholder="Издөө: базар, мектеп, Ленина…" value="${esc(q || "")}"></div>
      <div id="dList">${A.items.length ? A.items.map(x => `<div class="item"><div class="main"><b>${x.icon} ${esc(x.name)} ${x.hidden ? '<span class="tag t-cancelled">жашырылган</span>' : ""}
            ${x.pending ? `<span class="tag t-pending">сунуш · ${x.votes} добуш</span>` : ""}${x.approx ? '<span class="tag t-searching">жери болжолдуу</span>' : ""}</b>
          <span class="muted">${esc(K[x.kind] ? K[x.kind].name : x.kind)}${x.area ? " · " + esc(x.area) : ""}${x.aliases ? " · башка аттары: " + esc(x.aliases) : ""} · ${{admin:"өзүңүз", osm:"OSM", web:"интернет", user:"жүргүнчү/айдоочу"}[x.source] || x.source}</span></div>
          ${x.pending ? `<button class="btn ok" data-ap="${x.id}">✓ Кабыл алуу</button><button class="btn bad" data-rj="${x.id}">✕</button>` : ""}
          <button class="btn" data-ed="${x.id}">Оңдоо</button>${x.pending ? "" : `<button class="btn" data-hd="${x.id}" data-h="${x.hidden ? 0 : 1}">${x.hidden ? "Көрсөтүү" : "Жашыруу"}</button>`}</div>`).join("")
        : `<div class="empty">${q ? "Табылган жок." : "Тизме бош. «OpenStreetMap'тен жүктөө» же «Жаңы дарек» басыңыз."}</div>`}</div></div>`;
  let t = null;
  $("#dQ").oninput = e => { clearTimeout(t); t = setTimeout(() => viewAddr(e.target.value.trim()), 400); };
  if (q) { const i = $("#dQ"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  $("#dImp").onclick = async () => { await api("/api/a/addr_import", {}); setTimeout(() => viewAddr(q), 800);
    setTimeout(() => tab === "addr" && viewAddr(q), 20000); };
  $("#dNew").onclick = () => addrForm({kind:"poi"}, K, q);
  document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => addrForm(A.items.find(x => x.id == b.dataset.ed), K, q));
  document.querySelectorAll("[data-hd]").forEach(b => b.onclick = async () => { await api("/api/a/addr_hide", {id:+b.dataset.hd, hidden:b.dataset.h === "1"}); viewAddr(q); });
  document.querySelectorAll("[data-ap]").forEach(b => b.onclick = async () => { await api("/api/a/addr_approve", {id:+b.dataset.ap}); viewAddr(q); });
  document.querySelectorAll("[data-rj]").forEach(b => b.onclick = async () => { if (!confirm("Бул сунушту өчүрөсүзбү?")) return; await api("/api/a/addr_delete", {id:+b.dataset.rj}); viewAddr(q); });
  document.querySelectorAll("[data-only]").forEach(b => b.onclick = () => { DONLY = b.dataset.only; viewAddr(q); });
}
async function addrForm(x, K, q) {
  DF = {id:x.id || null, p:x.lat ? [x.lat, x.lon] : null};
  $("#dForm").innerHTML = `<div class="fset">
      <div><label>Аталышы (жүргүнчү ушуну көрөт)</label><input class="f" id="dN" placeholder="Борбордук базар" value="${esc(x.name || "")}"></div>
      <div><label>Түрү</label><select class="f" id="dK">${Object.entries(K).map(([k, v]) => `<option value="${k}" ${k === x.kind ? "selected" : ""}>${v.icon} ${esc(v.name)}</option>`).join("")}</select></div>
      <div><label>Башка аттары (үтүр менен)</label><input class="f" id="dAl" placeholder="эски базар, рынок" value="${esc(x.aliases || "")}"></div>
      <div><label>Айыл / кичи район</label><input class="f" id="dAr" placeholder="Базар-Коргон" value="${esc(x.area || "")}"></div>
    </div>
    <div style="padding:0 14px"><p class="muted" id="dHint">Картадан ошол жерди басыңыз.</p><div id="dmap" style="height:300px;border-radius:16px;overflow:hidden;position:relative"></div></div>
    <div style="padding:10px 14px 14px"><button class="btn ok" id="dSave">Сактоо</button> <button class="btn" id="dX">Жабуу</button>
      ${x.id ? `<button class="btn bad" id="dDel">Өчүрүү</button>` : ""} <span class="err" id="dEr"></span></div>`;
  const a = await (await fetch("/api/area")).json();
  dmap = L.map("dmap").setView(DF.p || a.center, DF.p ? 17 : 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(dmap);
  dlyr = L.layerGroup().addTo(dmap);
  const mark = () => { dlyr.clearLayers(); if (DF.p) L.marker(DF.p, {icon:dot("#ffb703")}).addTo(dlyr);
    $("#dHint").textContent = DF.p ? "✓ Жери белгиленди. Өзгөртүү үчүн картаны кайра басыңыз." : "Картадан ошол жерди басыңыз."; };
  mark();
  dmap.on("click", e => { DF.p = [e.latlng.lat, e.latlng.lng]; mark(); });
  $("#dX").onclick = () => { $("#dForm").innerHTML = ""; };
  $("#dSave").onclick = async () => {
    if (!$("#dN").value.trim()) return $("#dEr").textContent = "Аталышын жазыңыз.";
    if (!DF.p) return $("#dEr").textContent = "Картадан жерин басыңыз.";
    const r = await api("/api/a/addr", {id:DF.id, name:$("#dN").value, kind:$("#dK").value, aliases:$("#dAl").value, area:$("#dAr").value, p:DF.p});
    if (r.error) return $("#dEr").textContent = "Сакталган жок: жер иштөө аймагынын ичинде болушу керек.";
    viewAddr(q);
  };
  const del = $("#dDel");
  if (del) del.onclick = async () => { if (!confirm("Бул даректи биротоло өчүрөсүзбү?")) return; await api("/api/a/addr_delete", {id:DF.id}); viewAddr(q); };
  $("#dN").focus();
}
function show(t) {
  tab = t; lyr = null;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  ({map:viewMap, drivers:viewDrivers, topups:viewTopups, rides:viewRides, tariffs:viewTariffs, area:viewArea, finance:viewFinance, addr:() => viewAddr("")})[t]();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.t));
async function boot() {
  const m = await api("/api/me");
  if (!m.auth) return login(m.pending, m.link);
  if (!m.admin) { $("#main").innerHTML = `<div class="login"><h2>Кирүүгө уруксат жок</h2><p class="muted">Бул номер админ эмес.</p><button class="btn" id="lo">Башка номер</button></div>`;
    $("#lo").onclick = async () => { await api("/api/logout", {}); location.reload(); }; return; }
  $("#nav").classList.remove("hide");
  await refresh(); show("map");
  clearInterval(timer); timer = setInterval(refresh, 4000);
}
boot();
</script>
</body>
</html>
