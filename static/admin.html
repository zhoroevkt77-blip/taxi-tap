<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>Такси ТАП! — Админ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
.ulbl span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:600 12px/1 system-ui;color:#17365C;background:#fffc;padding:3px 6px;border-radius:8px}
:root{--navy:#17365C;--gold:#C9A03A;--gold2:#E3C368;--ink:#152741;--soft:#5A6880;--paper:#F1F4F9;--line:#E1E7F1;--ok:#1D9E75;--bad:#D8443A;--warn:#BA7517}
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header .logo{font-weight:600;font-size:17px}header .logo b{color:var(--gold2)}
header .live{margin-left:auto;font-size:12px;opacity:.8}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:9}
nav button{border:0;background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;position:relative}
nav button.on{background:var(--navy);color:#fff}
nav .badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:5px}
main{padding:12px;max-width:1100px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.card span{font-size:12px;color:var(--soft)}.card b{display:block;font-size:24px;margin-top:2px}
#map{height:420px;border-radius:14px;border:1px solid var(--line);overflow:hidden;position:relative;background:#EDEAE2}
.legend{display:flex;gap:14px;font-size:12px;color:var(--soft);margin:8px 2px 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.panel{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.panel h3{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}
.item{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border:0}
.item .main{flex:1;min-width:170px}.item .main b{display:block}
.muted{color:var(--soft);font-size:13px}
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--paper);color:var(--ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap}.item .main{flex:1;min-width:220px}a.btn{text-decoration:none;display:inline-block}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:#FCEBEB;color:var(--bad)}.btn.gold{background:var(--gold);color:#16161a}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap}
.t-searching{background:#FAEEDA;color:#854F0B}.t-scheduled{background:#EEEDFE;color:#3C3489}.t-accepted,.t-arrived{background:#E6F1FB;color:#0C447C}
.t-in_trip{background:#E1F5EE;color:#085041}.t-completed{background:#EAF3DE;color:#27500A}.t-cancelled{background:#F1EFE8;color:#5F5E5A}
.t-active{background:#E1F5EE;color:#085041}.t-pending{background:#FAEEDA;color:#854F0B}.t-blocked,.t-rejected{background:#FCEBEB;color:#A32D2D}
.empty{padding:18px 14px;color:var(--soft);font-size:14px}
input.f{font-size:15px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);width:100%;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--soft);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
td input.f{padding:7px 8px;max-width:90px;min-width:58px}
.scroll table{min-width:620px}
.scroll{overflow-x:auto}
.login{max-width:380px;margin:60px auto;background:#fff;border-radius:18px;padding:22px;border:1px solid var(--line)}
.login h2{margin:0 0 12px}.login .btn{width:100%;padding:14px;font-size:16px;margin-top:10px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.proof{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--paper);cursor:zoom-in}
.mk{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.hide{display:none!important}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:14px 14px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--soft)}
.bars i{display:block;width:100%;max-width:46px;background:var(--gold);border-radius:6px 6px 0 0;min-height:2px}
.bars b{font-size:12px;color:var(--ink);margin-bottom:4px}
.fset{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:12px 14px}
.fset label{font-size:12px;color:var(--soft);display:block;margin-bottom:4px}
.mode{display:inline-block;background:#E1F5EE;color:#085041;font-weight:600;border-radius:10px;padding:6px 12px;font-size:14px}
#amap{height:min(62vh,520px);border-radius:14px;border:1px solid var(--line);overflow:hidden;position:relative;background:#EDEAE2}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tools .btn{padding:11px 14px;font-size:14px}
.vx{width:16px;height:16px;border-radius:50%;background:#D8443A;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vx.first{background:#1D9E75;width:20px;height:20px}
.docs{display:flex;gap:8px;margin-top:8px}.docs a{display:block}.docs img{width:92px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
.docs span{display:block;font-size:11px;color:var(--soft);text-align:center;margin-top:2px}
.docs{flex-wrap:wrap}.chk{margin:10px 0 2px;padding:10px 12px;border-radius:12px;background:#fff8e1}.chk label{font-weight:500!important;color:#222!important;font-size:14px!important;display:flex!important;gap:8px;align-items:flex-start}.chk input{width:18px;height:18px;flex:none;margin-top:1px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.phrev{margin:8px 0;padding:10px;border-radius:12px;background:#fff8e6}
.blegend{position:absolute;right:8px;top:8px;z-index:500;background:#fff;border-radius:10px;padding:6px 9px;font-size:11.5px;line-height:1.75;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.blegend i{display:inline-block;width:18px;vertical-align:middle;margin-right:6px}
.bh{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}.bh .btn{margin-left:auto;padding:4px 9px;font-size:12px}
.vsets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}.vsets button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:14px;border:0;background:#f4f4f7;font:inherit;cursor:pointer}.vsets button img{height:64px;mix-blend-mode:multiply}.vsets button b{font-size:13px}.vsets button small{font-size:11px;color:#8a8a94}.vsets button.on{background:#fff3c4;box-shadow:inset 0 0 0 2px #ffb703}
.vsec{font-size:12px;font-weight:600;color:#8a8a94;letter-spacing:.06em;margin:16px 4px 2px;text-transform:uppercase}
.vbar{height:8px;background:#eee;border-radius:9px;margin-top:8px;width:100%}.vbar i{display:block;height:8px;border-radius:9px;background:#ffb703}
.vrow{flex-wrap:nowrap!important;align-items:center}.vrow .main{flex:1;min-width:0}.vrow .btn{flex:0 0 auto;min-width:46px;width:auto}.vrec{background:#fff8e1;border-radius:18px;padding:18px;margin:10px 0;text-align:center}
.vword{font-size:26px;font-weight:600;margin:6px 0 14px}.vmic{width:110px;height:110px;border-radius:50%;border:0;background:#e5383b;color:#fff;font-size:44px;cursor:pointer;box-shadow:0 0 0 12px rgba(229,56,59,.12)}
.vmic.on{animation:vpulse 1s infinite}@keyframes vpulse{50%{box-shadow:0 0 0 22px rgba(229,56,59,.22)}}
.dgl{display:block;margin-top:6px;font-size:13px}.dgl.ok{color:#1a7a40;font-weight:600}.dgl summary{cursor:pointer;list-style:none;font-weight:600}
.dgl summary::-webkit-details-marker{display:none}.dgl summary b{display:inline!important;margin:0!important}.dgl summary{display:block}.dgl .r{color:#c22}.dgl .o{color:#b26a00}.dgi{padding:3px 0 0 4px;font-size:13px}.dgi.bad{color:#b42318}
</style>

</head>
<body class="adm">
<header><div class="logo"><img src="/static/logo.png?v=2" alt="">Такси <b>ТАП!</b><span class="ver">Админ</span></div><div class="live" id="live"></div></header>
<nav id="nav" class="hide">
  <button data-t="map" class="on">Карта</button>
  <button data-t="disp">☎ Диспетчер</button>
  <button data-t="drivers">Айдоочулар<span class="badge hide" id="bD"></span></button>
  <button data-t="topups">Толуктоо<span class="badge hide" id="bT"></span></button>
  <button data-t="rides">Сапарлар</button>
  <button data-t="finance">Каржы</button>
  <button data-t="tariffs">Тарифтер</button>
  <button data-t="addr">Даректер</button>
  <button data-t="area">Аймак</button>
  <button data-t="parks">Парктар</button>
  <button data-t="voice">🎙 Үн</button>
</nav>
<main id="main"></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/area.js?v=12"></script>
<script>
function shareTxt(p) {
  if (!p.share_until) return p.share + "%";
  const d = new Date(p.share_until * 1000), ds = String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear();
  return Date.now() / 1000 < p.share_until ? `${p.share}% (${ds} чейин, андан кийин ${p.share_after}%)` : `${p.share_after}% (${ds} баштап)`;
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (p, b) => (await fetch(p, b === undefined ? {credentials:"same-origin"} :
  {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b)})).json();
const ST = {scheduled:"Алдын ала", searching:"Изделүүдө", accepted:"Айдоочу жолдо", arrived:"Күтүүдө", in_trip:"Жолдо", completed:"Бүттү", cancelled:"Жабылды",
            active:"Активдүү", pending:"Текшерүүдө", blocked:"Бөгөттөлгөн", rejected:"Четке кагылды"};
const tag = s => `<span class="tag t-${s}">${ST[s] || s}</span>`;
const when = t => t ? new Date(t * 1000).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
let tab = "map", O = null, map = null, lyr = null, fitted = false, timer = null;

// ---------- кирүү ----------
function login(pending, link) {
  $("#nav").classList.add("hide");
  $("#main").innerHTML = pending
    ? `<div class="login"><h2>Номерди ырастаңыз</h2><p class="muted">Telegram'да ботко өтүп, номериңизди жөнөтүңүз.</p>
       ${link ? `<a href="${esc(link)}" target="_blank"><button class="btn gold">Telegram'да ырастоо</button></a>` : ""}</div>`
    : `<div class="login"><h2>Админ панели</h2><p class="muted">Админдин номери (ADMIN_PHONES же ADMIN_IDS).</p>
       <input class="f" id="ph" placeholder="0700 123 456" inputmode="tel"><div class="err" id="er"></div>
       <button class="btn gold" id="go">Кирүү</button></div>`;
  if (pending) { const t = setInterval(async () => { if ((await api("/api/me")).auth) { clearInterval(t); boot(); } }, 2500); return; }
  $("#go").onclick = async () => {
    const r = await api("/api/login", {phone:$("#ph").value, kind:"admin"});
    if (r.error) return $("#er").textContent = r.error === "not_admin" ? "Бул номер админ эмес." : "Номерди толук жазыңыз.";
    r.auth ? boot() : login(true, r.link);
  };
}

// ---------- карта ----------
function viewMap() {
  const s = O.stats;
  $("#main").innerHTML = `<div class="cards">
    <div class="card"><span>Онлайн айдоочу</span><b>${s.online}</b><span>${s.busy} сапарда${s.online_out ? ` · ${s.online_out} аймактан сыртта` : ""}</span></div>
    <div class="card"><span>Активдүү заказ</span><b>${s.active}</b><span>${s.searching} изделүүдө</span></div>
    <div class="card"><span>Бүгүн бүттү</span><b>${s.done_today}</b><span>${s.lost_today} айдоочусуз калды</span></div>
    <div class="card"><span>Бүгүн айдоочулар тапкан</span><b>${s.gross_today.toLocaleString("ru-RU")} с</b><span>комиссия ${s.fee_today} с</span></div></div>
    <div class="panel"><div class="item"><div class="main"><b>📞 Телефон аркылуу заказ</b>
      <span class="muted">Кардар чалса — «☎ Диспетчер» бөлүмүнөн заказ бериңиз.</span></div>
      <button class="btn gold" id="poOpen">☎ Диспетчер</button></div></div>
    <div id="map"></div>
    <div class="legend"><label style="cursor:pointer"><input type="checkbox" id="lostT"> <i style="background:#D8443A"></i>Айдоочусуз калгандар (7 күн)</label><span><i style="background:var(--ok)"></i>Бош айдоочу</span><span><i style="background:var(--navy)"></i>Сапардагы айдоочу</span><span><i style="background:var(--gold)"></i>Айдоочу изделүүдө</span><span><i style="background:#378ADD"></i>Жүргүнчү күтүп турат</span></div>
    <div class="panel"><h3>Активдүү заказдар</h3><div id="act"></div></div>`;
  map = L.map("map", {zoomControl:true}).setView([41.0377, 72.7470], 12);
  setupArea(map, {minZoom:9, center:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  lyr = L.layerGroup().addTo(map); fitted = false; drawMap();
  const lostL = L.layerGroup().addTo(map);
  $("#lostT").onchange = async e => {
    lostL.clearLayers();
    if (!e.target.checked) return;
    const {lost} = await api("/api/a/lost?days=7");
    lost.forEach(x => L.circleMarker([x.p_lat, x.p_lon], {radius:7, color:"#D8443A", fillColor:"#D8443A", fillOpacity:.45, weight:1})
      .bindTooltip(new Date(x.created_at * 1000).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})).addTo(lostL));
    if (!lost.length) alert("Акыркы 7 күндө айдоочусуз калган заказ жок.");
  };
  $("#poOpen").onclick = () => show("disp");
}

// ---------- ☎ Диспетчер: телефон аркылуу заказ ----------
const DS = {p:null, d:null, pa:"", da:"", pick:null, cls:"econom", client:null, lyr:null, map:null, t:null};
const ST_TXT = {searching:["⏳ Айдоочу изделүүдө", "#C9A03A"], accepted:["🚕 Айдоочу келе жатат", "#378ADD"], arrived:["📍 Айдоочу жетти", "#1D9E75"],
  in_trip:["🛣 Жолдо", "#17365C"], completed:["✅ Бүттү", "#1D9E75"], cancelled:["✕ Жокко чыкты", "#D8443A"], scheduled:["🕐 Алдын ала", "#888"]};
async function viewDisp() {
  $("#main").innerHTML = `<div class="panel"><h3>☎ Телефон аркылуу заказ</h3><div class="dsf">
      <div class="two2"><div><label>Телефон</label><input class="f" id="dsPh" inputmode="tel" placeholder="0700 123 456" autocomplete="off"></div>
        <div><label>Аты</label><input class="f" id="dsNm" placeholder="Айгүл эже"></div></div>
      <div id="dsCl" class="muted"></div>
      ${["p", "d"].map(k => `<div class="dsw"><label>${k === "p" ? "🅰 Кайдан" : "🅱 Кайда"}</label>
        <div class="dsrow"><div style="position:relative;flex:1"><input class="f" id="ds${k}" placeholder="${k === "p" ? "Дарек, дүкөн, мекеме…" : "Кайда барат…"}" autocomplete="off">
          <div class="fxdd" id="ds${k}dd"></div></div><button class="btn" id="ds${k}M" title="Картадан">🗺</button></div>
        <div class="dsch" id="ds${k}C"></div></div>`).join("")}
      <div id="dsCls" class="dscls"></div>
      <div><label>Белги (айдоочуга көрүнөт)</label><input class="f" id="dsNt" placeholder="Базардын жанында, көк дарбаза"></div>
      <div id="dsPr" class="dspr"></div>
      <button class="btn ok" id="dsGo" style="width:100%;padding:14px;font-size:17px">Заказ берүү</button><span class="err" id="dsEr"></span>
      <div id="dsMap" style="height:260px;border-radius:16px;margin-top:10px"></div><p class="muted" id="dsHint"></p></div></div>
    <div class="panel"><h3>📋 Бүгүнкү телефон заказдар</h3><div id="dsList"><div class="empty">Жүктөлүүдө…</div></div></div>`;
  DS.map = L.map("dsMap", {zoomControl:true}).setView((window.AREA && AREA.center) || [41.0377, 72.7470], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(DS.map);
  DS.lyr = L.layerGroup().addTo(DS.map);
  DS.map.on("click", async e => { if (!DS.pick) return; const k = DS.pick; DS.pick = null;
    DS[k] = [e.latlng.lat, e.latlng.lng]; DS[k + "a"] = "Картадагы чекит";
    try { const r = await (await fetch(`/api/rev?lat=${DS[k][0]}&lon=${DS[k][1]}`)).json(); DS[k + "a"] = r.addr || r.near || DS[k + "a"]; } catch (x) {}
    $("#ds" + k).value = DS[k + "a"]; dsDraw(); });
  ["p", "d"].forEach(k => {
    let tm; const inp = $("#ds" + k), dd = $("#ds" + k + "dd");
    inp.oninput = () => { clearTimeout(tm); DS[k] = null; dsDraw(); tm = setTimeout(async () => {
      const q = inp.value.trim(); if (q.length < 2) return dd.innerHTML = "";
      const c = (window.AREA && AREA.center) || [41.04, 72.75];
      const x = await (await fetch(`/api/addr?q=${encodeURIComponent(q)}&lat=${c[0]}&lon=${c[1]}`)).json();
      dd.innerHTML = (x.items || []).slice(0, 6).map((it, i) => `<div data-i="${i}">${esc(it.name)}<small>${esc(it.addr || it.sub || "")}</small></div>`).join("")
        + `<div data-m="1">🗺 Картадан белгилөө</div>`;
      dd.querySelectorAll("[data-i]").forEach(el => el.onclick = () => { const it = x.items[+el.dataset.i];
        DS[k] = [it.lat, it.lon]; DS[k + "a"] = it.name; inp.value = it.name; dd.innerHTML = ""; dsDraw(); });
      dd.querySelector("[data-m]").onclick = () => { dd.innerHTML = ""; dsPick(k); };
    }, 300); };
    $("#ds" + k + "M").onclick = () => dsPick(k);
  });
  let pt;
  $("#dsPh").oninput = () => { clearTimeout(pt); pt = setTimeout(dsClient, 500); };
  $("#dsGo").onclick = dsOrder;
  dsDraw(); dsList();
  clearInterval(DS.t); DS.t = setInterval(() => { if (tab === "disp") dsList(); else clearInterval(DS.t); }, 5000);
}
function dsPick(k) { DS.pick = k; $("#dsHint").textContent = (k === "p" ? "🅰 Кайдан" : "🅱 Кайда") + " — картадан басыңыз 👇"; $("#dsMap").scrollIntoView({behavior:"smooth", block:"center"}); }
async function dsClient() {
  const ph = $("#dsPh").value.replace(/\D/g, ""); DS.client = null;
  if (ph.length < 9) { $("#dsCl").innerHTML = ""; ["p", "d"].forEach(k => $("#ds" + k + "C").innerHTML = ""); return; }
  const c = await api("/api/a/client?phone=" + encodeURIComponent($("#dsPh").value)); if (c.error) return;
  DS.client = c;
  if (c.name && !$("#dsNm").value) $("#dsNm").value = c.name;
  $("#dsCl").innerHTML = c.active ? `<span class="err">⚠️ Бул номерде активдүү заказ бар (№${c.active})</span>`
    : c.rides ? `👤 Мурунку кардар · ${c.rides} заказ` : "🆕 Жаңы кардар";
  ["p", "d"].forEach(k => { $("#ds" + k + "C").innerHTML = (c.places || []).map((x, i) => `<button data-pi="${i}">${esc(x.name)}</button>`).join("");

async function viewDrivers() {
  const {drivers} = await api("/api/a/drivers");
  const pend = drivers.filter(d => d.status === "pending"), rest = drivers.filter(d => d.status !== "pending");
  const file = n => n ? `/api/a/file?n=${encodeURIComponent(n)}` : "";
  const docs = d => `<div class="docs">${[["doc_selfie", "Селфи"], ["doc_license", "Күбөлүк"], ["doc_techpass", "Техпаспорт"], ["doc_car", "Унаа"]].map(([k, t]) =>
      d[k] ? `<a href="${file(d[k])}" target="_blank"><img src="${file(d[k])}" alt="${t}" loading="lazy"><span>${t}</span></a>` : "").join("")}</div>`;
  const today = new Date().toISOString().slice(0, 10);
  const lic = d => { if (!d.lic_until) return `<span class="muted" style="display:block">🪪 Мөөнөтү жазылган эмес</span>`;
    const left = Math.round((new Date(d.lic_until) - new Date(today)) / 864e5);
    return `<span class="muted" style="display:block;color:${left < 0 ? "var(--bad)" : left <= 30 ? "#b26a00" : ""}">🪪 Күбөлүк ${esc(d.lic_until)} чейин${left < 0 ? " — МӨӨНӨТҮ БҮТКӨН" : left <= 30 ? ` — ${left} күн калды` : ""}</span>`; };
  const checks = d => `<div class="chk" data-ck="${esc(d.uid)}"><b style="font-size:13px">Ырастоодон мурун текшериңиз:</b>${["Селфидеги жүз күбөлүктөгү сүрөткө окшош", "Аты-жөнү күбөлүктөгүдөй", "Унаанын номери техпаспорттогудай",
      "Унаанын сүрөтүндөгү номер дал келет"].map(t => `<label style="margin:6px 0"><input type="checkbox"> <span>${t}</span></label>`).join("")}</div>`;
  const photoBox = d => {
    if (d.status !== "active" || !d.photos) return d.status === "active" && !d.photo_status ? `<span class="muted" style="display:block">📷 Фотоконтроль: али жиберген эмес</span>` : "";
    let P = {}; try { P = JSON.parse(d.photos) || {}; } catch (e) {}
    const imgs = [["front", "Алды"], ["back", "Арты"], ["left", "Сол"], ["right", "Оң"]].map(([k, t]) => P[k] ? `<a href="${file(P[k])}" target="_blank"><img src="${file(P[k])}" alt="${t}" loading="lazy"><span>${t}</span></a>` : "").join("");
    const when = d.photo_at ? new Date(d.photo_at * 1000).toLocaleDateString("ru-RU") : "";
    if (d.photo_status === "pending") return `<div class="phrev"><b>📷 Фотоконтроль — текшериңиз</b> <span class="muted">${when}</span><div class="docs">${imgs}</div>
      <button class="btn ok" data-ph="1" data-u="${esc(d.uid)}">✓ Кабыл алуу</button> <button class="btn bad" data-ph="0" data-u="${esc(d.uid)}">✕ Кайра тарттыруу</button></div>`;
    return `<details><summary class="muted" style="cursor:pointer">📷 Фотоконтроль: ${d.photo_status === "ok" ? "✅ өттү" : "⚠️ кабыл алынган жок"} · ${when}</summary><div class="docs">${imgs}</div></details>`;
  };
  const row = d => `<div class="item"><div class="main"><b>${esc(d.name)} ${tag(d.status)} ${d.is_online ? '<span class="tag t-in_trip">онлайн</span>' : ""}</b>
      <span class="muted">${esc(d.phone)} · ${esc(carText(d.car_color, d.car_model))}, ${esc(d.car_plate)}${d.status === "active" || d.status === "blocked" ? ` · ★ ${d.rating} · ${d.rides_done} сапар · баланс <b>${Math.round(d.balance)} с</b>` : ""}</span>
      ${d.park_name ? `<span class="muted" style="display:block">🏢 ${esc(d.park_name)}${d.park_code ? " · " + esc(d.park_code) : ""}${d.status === "pending" && d.park_self ? " — <b>арызды парк өзү текшерет</b>" : ""}</span>` : ""}
      ${d.approved_by ? `<span class="muted" style="display:block">✓ ${d.approved_by.startsWith("park:") ? esc(d.park_code || "Парк") + " парк тастыктады" : "админ тастыктады"}${d.approved_at ? " · " + when(d.approved_at) : ""}</span>` : ""}
      ${d.status === "blocked" && d.blocked_by && d.blocked_by.startsWith("park:") ? `<span class="muted" style="display:block">⛔ парк бөгөттөгөн</span>` : ""}
      ${d.status === "rejected" && d.reject_note ? `<span class="muted">Себеби: ${esc(d.reject_note)}</span>` : ""}${lic(d)}
      ${diagLine(d.diag)}
      <label style="display:flex;gap:6px;align-items:center;font-size:13px;margin-top:6px"><input type="checkbox" data-afree="${esc(d.uid)}" ${d.area_free ? "checked" : ""}> Аймак чектөөсүз (тест)</label>
      ${d.status === "pending" ? docs(d) + checks(d) : `<details><summary class="muted" style="cursor:pointer">📄 Документтер</summary>${docs(d)}</details>`}
      ${photoBox(d)}
      ${d.status === "active" ? `<span class="muted" data-cl="${esc(d.uid)}">${[["econom","Эконом"],["comfort","Комфорт"],["minivan","Минивэн"],["delivery","Жеткирүү"]].map(([c, t]) =>
        `<label style="margin-right:10px;white-space:nowrap"><input type="checkbox" value="${c}" ${(d.classes || "econom,delivery").split(",").includes(c) ? "checked" : ""}> ${t}</label>`).join("")}</span>` : ""}</div>
      ${d.status === "pending" ? `<button class="btn ok" data-a="approve" data-u="${esc(d.uid)}" disabled title="Адегенде бардык белгилерди коюңуз">Ырастоо</button><button class="btn bad" data-a="reject" data-u="${esc(d.uid)}">Баш тартуу</button>`
        : `<button class="btn" data-bal="${esc(d.uid)}">± Баланс</button>` + (d.status === "blocked"
          ? `<button class="btn ok" data-a="unblock" data-u="${esc(d.uid)}">Ачуу</button>` : `<button class="btn bad" data-a="block" data-u="${esc(d.uid)}">Бөгөттөө</button>`)}</div>`;
  $("#main").innerHTML = (pend.length ? `<div class="panel"><h3>Ырастоону күткөндөр (${pend.length})</h3>${pend.map(row).join("")}</div>` : "")
    + `<div class="panel"><h3>Бардык айдоочулар (${rest.length})</h3>${rest.map(row).join("") || `<div class="empty">Айдоочу жок.</div>`}</div>`;
  $("#main").querySelectorAll("[data-ck]").forEach(box => {
    const btn = $("#main").querySelector(`[data-a="approve"][data-u="${CSS.escape(box.dataset.ck)}"]`), all = [...box.querySelectorAll("input")];
    all.forEach(i => i.onchange = () => { if (btn) btn.disabled = !all.every(x => x.checked); });
  });
  $("#main").querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    let reason = "";
    if (b.dataset.a === "block" && !confirm("Бөгөттөйсүзбү?")) return;
    if (b.dataset.a === "reject") { reason = prompt("Себеби (айдоочуга көрүнөт):", "Документтин сүрөтү бүдөмүк"); if (reason === null) return; }
    await api("/api/a/driver", {uid:b.dataset.u, action:b.dataset.a, reason}); viewDrivers(); refresh();
  });
  $("#main").querySelectorAll("[data-cl]").forEach(box => box.querySelectorAll("input").forEach(i => i.onchange = async () => {
    const cl = [...box.querySelectorAll("input:checked")].map(x => x.value);
    if (!cl.length) { i.checked = true; return; }
    await api("/api/a/driver_classes", {uid:box.dataset.cl, classes:cl});
  }));
  document.querySelectorAll("[data-ph]").forEach(b => b.onclick = async () => {
    const ok = b.dataset.ph === "1", note = ok ? "" : prompt("Себеби (айдоочуга жөнөтүлөт):", "Сүрөттөр бүдөмүк же номер көрүнбөйт");
    if (!ok && note === null) return;
    const r = await api("/api/a/car_photo_review", {uid:b.dataset.u, ok, note});
    toast(r.ok ? (ok ? "✓ Кабыл алынды" : "Айдоочуга кабар кетти") : "Ката", 2500); viewDrivers(); });
  $("#main").querySelectorAll("[data-bal]").forEach(b => b.onclick = async () => {
    const v = prompt("Канча сом кошуу (+) же кемитүү (−)? Мис: 500 же -100");
    if (!v || isNaN(+v) || +v === 0) return;
    await api("/api/a/balance", {uid:b.dataset.bal, amount:+v}); viewDrivers();
  });
}

function diagLine(g) {

  if (!g.bad && !g.warn) return `<span class="dgl ok">✓ Диагностика жайында</span>`;
  return `<details class="dgl"><summary>🩺 ${g.bad ? `<b class="r">${g.bad} ❌</b>` : ""}${g.bad && g.warn ? " · " : ""}${g.warn ? `<b class="o">${g.warn} ⚠️</b>` : ""}</summary>
    ${g.items.map(([l, t]) => `<div class="dgi ${l}">${l === "bad" ? "❌" : "⚠️"} ${esc(t)}</div>`).join("")}</details>`;
}

let amap = null, alyr = null, draw = null;

  const src = {"list+custom":"тизмеден тандалган + өзүңүз тарткан кошумча", custom:"өзүңүз тарткан чек", osm:"OpenStreetMap'теги райондун чеги", list:"тизмеден тандалган (OpenStreetMap чектери)", bbox:"болжолдуу төрт бурчтук"}[a.source] || a.source;

      <div class="item"><div class="main"><span class="muted">Азыркы чек: <b>${esc(src)}</b>. Жүргүнчүлөр ушул чектин ичинде гана заказ бере алат.</span></div></div>
      <div class="item"><div class="main" style="width:100%"><label class="muted">Аймактын аты (кардарларга ушундай көрүнөт)</label>
        <div style="display:flex;gap:8px;margin-top:4px"><input class="f" id="atT" value="${esc(a.title || "")}" placeholder="${esc(a.name)} — мис. Базар-Коргон жана Сузак" style="flex:1;margin:0">

        <p class="muted" style="margin:6px 0 0">Мисалы, айдоочуга: «Такси ТАП! <b id="atP">${esc(a.title || a.name)}</b> аймагында гана иштейт». Бош калса — тандалган аймактын аты колдонулат.</p></div></div></div>
    <div class="panel"><h3>📋 Тизмеден тандоо (облус → район / шаар)</h3>
      <div class="item"><div class="main" style="width:100%">
        <input class="f" id="geoQ" placeholder="🔍 Издөө: мис. Кант, Ноокат, Талас…" autocomplete="off">
        <select class="f" id="obSel"></select>
        <p class="muted" id="geoCnt" style="margin:0 0 6px"></p>

        <button class="btn gold" id="selSave" style="margin-top:10px">✓ Ушул аймакта иштейбиз</button>
        <p class="muted" id="selMsg"></p>
        <p class="muted">Бир нече район же шаар тандаса болот — ар биринин тарифин «Тарифтер» бөлүмүнөн өзүнчө койсо болот. Чектер OpenStreetMap'тен алынат; чеги жок кичи шаарлар үчүн 5 км тегерек коюлат.</p>
      </div></div></div>
    <div id="amap"></div>
    <div class="tools" id="tools"></div>
    <p class="muted" id="hint"></p><div id="bList"></div><div id="zList"></div>`;
  areaPicker(a);
  $("#atT").oninput = () => $("#atP").textContent = $("#atT").value.trim() || a.name;
  $("#atS").onclick = async () => { const r = await api("/api/a/area_title", {title:$("#atT").value}); toast(r.error ? "Ката" : "✓ Аймактын аты сакталды", 2500); };
  amap = L.map("amap", {zoomControl:true}).setView(a.center, 11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(amap);
  alyr = L.layerGroup().addTo(amap);
  const rings = areaRings(a.geojson).map(r => r.map(([lon, lat]) => [lat, lon]));
  rings.forEach(r => L.polygon(r, {color:"#17365C", weight:1, fill:false, dashArray:"4 4"}).addTo(alyr));
  if (rings.length) amap.fitBounds(L.latLngBounds(rings.flat()), {padding:[20, 20]});
  api("/api/a/area_units").then(x => {                  // ар бир район/шаар өз түсү жана аты менен
    const COL = ["#1D9E75", "#378ADD", "#D85A30", "#7F77DD", "#D4537E", "#BA7517"];
    const sz = u => { const b = L.geoJSON(u.gj).getBounds(); return (b.getNorth() - b.getSouth()) * (b.getEast() - b.getWest()); };
    [...(x.units || [])].sort((p, q) => sz(q) - sz(p)).forEach((u, i) => {
      const c = COL[i % COL.length], g = L.geoJSON(u.gj, {style:{color:c, weight:u.name.endsWith("шаары") ? 3 : 2, fillColor:c, fillOpacity:.15}}).addTo(alyr);
      g.bindTooltip(`${esc(u.name)}${u.approx ? " (5 км тегерек)" : ""} · тариф: «${esc(u.city)}»`, {sticky:true});
      L.marker(g.getBounds().getCenter(), {interactive:false, icon:L.divIcon({className:"ulbl", html:`<span>${esc(u.name)}</span>`, iconSize:[0, 0]})}).addTo(alyr);
    });
    UNITS = x.units || []; borderList();
    ZONES = x.zones || []; CITIES_T = [...new Set((x.units || []).map(u => u.city))];
    ZONES.forEach(z => { const g = L.geoJSON(z.gj, {style:{color:"#E8A100", weight:3, dashArray:"6 4", fillColor:"#FFC21A", fillOpacity:.3}}).addTo(alyr);
      g.bindTooltip(`🎯 Тариф зонасы: «${esc(z.city)}»`, {sticky:true});
      L.marker(g.getBounds().getCenter(), {interactive:false, icon:L.divIcon({className:"ulbl", html:`<span>🎯 ${esc(z.city)}</span>`, iconSize:[0, 0]})}).addTo(alyr); });
    zoneList();
  }).catch(() => {});
  draw = null; areaTools(a);
  amap.on("click", e => { if (!draw) return; draw.push([e.latlng.lat, e.latlng.lng]); drawPreview(); });
}
// ---------- облус → район/шаар тизмеси (ТАП!тан) ----------
let GEO = null;
async function areaPicker(a) {
  if (!GEO) GEO = await (await fetch("/static/geo_kg.json")).json();
  let sel = (a.selection || []).filter(x => x.ob);
  const key = x => x.ob + "|" + x.name;
  const ob0 = (sel[0] && sel[0].ob) || "Жалал-Абад облусу";
  $("#obSel").innerHTML = GEO.map(o => `<option${o.name === ob0 ? " selected" : ""}>${esc(o.name)}</option>`).join("");
  const has = (ob, n) => sel.some(x => x.ob === ob && x.name === n);
  const cnt = GEO.reduce((a, o) => { o.units.forEach(u => { a[u.kind === "city" ? "c" : "d"]++; a.t += (u.towns || []).length; }); return a; }, {c:0, d:0, t:0});
  $("#geoCnt").textContent = `${GEO.length} облус/шаар · ${cnt.d} район · ${cnt.c} облустук шаар · ${cnt.t} райондук шаар`;
  function list() {
    const q = ($("#geoQ").value || "").trim().toLowerCase();
    const row = (ob, n, kind, sub, showOb) => `<label class="urow${sub ? " sub" : ""}"><input type="checkbox" data-ob="${esc(ob)}" data-n="${esc(n)}" ${has(ob, n) ? "checked" : ""}>
      <span>${kind === "district" ? "🗺" : "🏙"} ${esc(n)}${showOb ? ` <small class="muted">· ${esc(ob)}</small>` : ""}</span></label>`;
    if (q) {
      const out = [];
      GEO.forEach(o => o.units.forEach(u => {
        if (u.name.toLowerCase().includes(q)) out.push(row(o.name, u.name, u.kind, false, true));
        (u.towns || []).forEach(t => { if (t.name.toLowerCase().includes(q)) out.push(row(o.name, t.name, "town", false, true)); });
      }));
      $("#unitList").innerHTML = out.join("") || `<p class="muted">Табылган жок</p>`;
    } else {
      const o = GEO.find(x => x.name === $("#obSel").value);
      $("#unitList").innerHTML = o.units.map(u => row(o.name, u.name, u.kind) + (u.towns || []).map(t => row(o.name, t.name, "town", true)).join("")).join("");
    }
    $("#obSel").style.display = q ? "none" : "";
    $("#unitList").querySelectorAll("input").forEach(c => c.onchange = () => {
      const n = c.dataset.n, ob = c.dataset.ob;
      sel = c.checked ? sel.concat([{name:n, ob}]) : sel.filter(x => key(x) !== ob + "|" + n);
      chips();
    });
  }
  $("#geoQ").oninput = list;
  function chips() {
    $("#selChips").innerHTML = sel.length ? sel.map((x, i) => `<span class="schip">${esc(x.name)} <b data-i="${i}">✕</b></span>`).join("") : `<span class="muted">— эч нерсе —</span>`;
    $("#selChips").querySelectorAll("b").forEach(b => b.onclick = () => { sel.splice(+b.dataset.i, 1); chips(); list(); });
  }
  $("#obSel").onchange = list; list(); chips();
  $("#selSave").onclick = async () => {
    if (!sel.length) return $("#selMsg").textContent = "Кеминде бир район же шаар тандаңыз.";
    if (a.source === "custom" && !confirm("Колго тартылган чек өчүп, тизмедегилер коюлат. Макулсузбу?")) return;
    $("#selSave").disabled = true; $("#selMsg").textContent = "⏳ OpenStreetMap'тен чектер жүктөлүүдө… (ар бирине 1–3 сек)";
    const r = await api("/api/a/area_sel", {units:sel});
    $("#selSave").disabled = false;
    if (r.error) return $("#selMsg").textContent = r.error === "not_found" ? `«${r.name}» картадан табылган жок.` : "Сакталган жок: " + r.error;
    const ap = (r.units || []).filter(u => u.approx).map(u => u.name);
    toast(`✓ Аймак: ${r.name}${ap.length ? " · болжолдуу (5 км): " + ap.join(", ") : ""}`, 4000);
    viewArea();
  };
}

        ${u.custom ? `<div class="bh">○ OSM (баштапкы) <span class="muted">${u.osm_km2} км²</span></div>` : ""}</details>` : ""}</div>`).join("")}`;

function ringKm2(P) {

// ---------- Туруктуу баалар (айылдар) ----------

// ---------- 🎙 Кыргызча үн: айдоочуга заказды айтуучу сөздөрдү админ өзү жазат ----------
let VQ = [], VR = null, VBLOB = null, VWAV = null, VSET = 1;
const vGrp = k => /^r_/.test(k) ? "🧳 Жүргүнчүгө" : /^n\d/.test(k) ? "🔢 Сандар" : "🚕 Айдоочуга";
async function viewVoice() {

  $("#main").innerHTML = `<div class="panel"><h3>🎙 Кыргызча үн — 4 адамдын үнү, айдоочу Кабинеттен тандайт</h3>

    <div class="item"><div class="main"><b>${esc(V.sets[V.set - 1].name)}: ${n} / ${V.keys.length} жазылды</b><span class="muted">Ар бир сөздү тынч жерде, телефонго жакын, кадимки ылдамдыкта айтыңыз.

      <div class="vbar"><i style="width:${Math.round(100 * n / V.keys.length)}%"></i></div></div></div>
    <div class="item" style="gap:8px"><button class="btn" id="vRen">✏️ Атын өзгөртүү</button>${n < V.keys.length ? `<button class="btn gold" id="vAll">🎙 Жазыла электерди катары менен жазуу</button>` : ""}
      <button class="btn" id="vTest">🔊 Сынап угуу: «Жаңы заказ, 80 сом, 1,2 километр»</button></div>
    <div id="vRec"></div>
    ${V.keys.map((k, i) => { const g = vGrp(k.k), h = i === 0 || vGrp(V.keys[i - 1].k) !== g ? `<div class="vsec">${g}</div>` : ""; return h + `<div class="item vrow"><div class="main"><b>${esc(k.t)}</b><span class="muted">${k.have ? "✓ жазылган" : "жазыла элек"}</span></div>
      ${k.have ? `<button class="btn" data-vp="${k.k}" title="Угуу">▶</button>` : ""}<button class="btn ${k.have ? "" : "gold"}" data-vr="${k.k}" title="Жазуу">🎙</button>
      ${k.have ? `<button class="btn" data-vd="${k.k}" title="Өчүрүү">🗑</button>` : ""}</div>`; }).join("")}</div>`;
  const T = {}; V.keys.forEach(k => T[k.k] = k.t);
  document.querySelectorAll("[data-vset]").forEach(b => b.onclick = () => { VSET = +b.dataset.vset; VQ = []; viewVoice(); });
  $("#vRen").onclick = async () => { const nm = prompt("Үндүн аты (айдоочуга ушундай көрүнөт):", V.sets[V.set - 1].name); if (!nm) return;
    await api("/api/a/voice_name", {set:V.set, name:nm}); viewVoice(); };
  $("#vAll") && ($("#vAll").onclick = () => { VQ = V.keys.filter(k => !k.have).map(k => k.k); vRec(VQ.shift(), T); });
  $("#vTest").onclick = () => vPlay(["new_order", "n80", "som", "n1", "point", "tenth", "n2", "km"], V, T);
  document.querySelectorAll("[data-vr]").forEach(b => b.onclick = () => { VQ = []; vRec(b.dataset.vr, T); });
  document.querySelectorAll("[data-vp]").forEach(b => b.onclick = () => vPlay([b.dataset.vp], V, T));
  document.querySelectorAll("[data-vd]").forEach(b => b.onclick = async () => {
    if (!confirm("«" + T[b.dataset.vd] + "» өчүрүлсүнбү?")) return; await api("/api/a/voice_del", {key:b.dataset.vd, set:VSET}); viewVoice(); });
}
let VAC = null;
const vAC = () => VAC = VAC || new (window.AudioContext || window.webkitAudioContext)();
async function vPlay(keys, V, T) {
  const ac = vAC(); ac.resume && ac.resume();
  for (const k of keys) {
    if (V.have.includes(k)) {
      try { const ab = await (await fetch(`/voice/${V.set}/${k}.wav?v=${V.ver}`)).arrayBuffer();
        const b = await new Promise((ok, no) => ac.decodeAudioData(ab, ok, no));
        await new Promise(ok => { const s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.onended = ok; s.start(); });
      } catch (e) {}
    } else if ("speechSynthesis" in window) {
      await new Promise(ok => { const u = new SpeechSynthesisUtterance(T[k] || ""); u.lang = "ru-RU"; u.onend = u.onerror = ok; speechSynthesis.speak(u); setTimeout(ok, 3000); });
    }
  }
}
function vRec(key, T) {
  if (!key) { VQ = []; return viewVoice(); }

  const box = $("#vRec");
  box.innerHTML = `<div class="vrec"><div class="muted">${VQ.length ? "Дагы " + VQ.length + " сөз калды" : "Жазуу"}</div>
    <div class="vword">«${esc(T[key])}»</div>
    <button class="vmic" id="vMic">🎙</button><div class="muted" id="vSt">Басыңыз да, сөздү айтыңыз — кайра басканда токтойт</div>
    <div class="item" style="gap:8px;justify-content:center"><button class="btn hide" id="vHear">▶ Кайра угуу</button>
      <button class="btn gold hide" id="vSave">✓ Сактоо${VQ.length ? " → «" + esc(T[VQ[0]]) + "»" : ""}</button>
      <button class="btn" id="vCx">✕ Жабуу</button></div></div>`;
  box.scrollIntoView({behavior:"smooth", block:"center"});
  $("#vCx").onclick = () => { try { VR && VR.state === "recording" && VR.stop(); } catch (e) {} VQ = []; box.innerHTML = ""; };
  $("#vMic").onclick = async () => {
    if (VR && VR.state === "recording") return VR.stop();
    let st;
    try { st = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
    catch (e) { return $("#vSt").textContent = "Микрофонго уруксат бериңиз (браузердин жөндөөлөрүнөн)."; }
    const ch = []; VR = new MediaRecorder(st); VR.ondataavailable = e => e.data.size && ch.push(e.data);
    VR.onstop = async () => {
      st.getTracks().forEach(t => t.stop()); $("#vMic").classList.remove("on"); clearTimeout(VR._t);
      $("#vSt").textContent = "Иштетилүүдө…";
      try { VWAV = await toWav(new Blob(ch, {type:VR.mimeType || "audio/webm"}));
        $("#vSt").textContent = "Даяр (" + VWAV.sec.toFixed(1) + " сек). Угуп көрүңүз."; $("#vHear").classList.remove("hide"); $("#vSave").classList.remove("hide"); }
      catch (e) { $("#vSt").textContent = e === "short" ? "Үн угулган жок — кайра басып, катуураак айтыңыз." : "Жазуу иштелбей калды, кайра аракет кылыңыз."; }
    };
    VR.start(); $("#vMic").classList.add("on"); $("#vSt").textContent = "● Жазылып жатат… бүткөндө кайра басыңыз";
    $("#vHear").classList.add("hide"); $("#vSave").classList.add("hide");
    VR._t = setTimeout(() => VR.state === "recording" && VR.stop(), 5000);
  };
  $("#vHear").onclick = () => { const ac = vAC(); ac.resume && ac.resume(); const s = ac.createBufferSource(); s.buffer = VWAV.buf; s.connect(ac.destination); s.start(); };
  $("#vSave").onclick = async () => {
    $("#vSave").disabled = true;
    const r = await api("/api/a/voice_save", {key, b64:VWAV.b64, set:VSET});
    if (!r.ok) { $("#vSave").disabled = false; return toast("Сакталбай калды", 2500); }
    toast("✓ «" + T[key] + "» сакталды", 1500);
    if (VQ.length) { await viewVoice(); vRec(VQ.shift(), T); } else viewVoice();
  };
}
// MediaRecorder'дин файлы → тынчтыгы кесилген, катуулугу теңделген 16 кГц моно WAV (бардык телефондо ойнойт)
async function toWav(blob) {
  const ac = vAC(), ab = await blob.arrayBuffer();
  const buf = await new Promise((ok, no) => ac.decodeAudioData(ab, ok, no));
  const d = buf.getChannelData(0), sr = buf.sampleRate;
  let peak = 0; for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; }
  if (peak < 0.02) throw "short";
  const th = Math.max(0.015, peak * 0.1);
  let a = 0, b = d.length - 1; while (a < d.length && Math.abs(d[a]) < th) a++; while (b > a && Math.abs(d[b]) < th) b--;
  a = Math.max(0, a - Math.round(sr * 0.05)); b = Math.min(d.length, b + Math.round(sr * 0.1));
  if (b - a < sr * 0.15) throw "short";
  const R = 16000, off = new OfflineAudioContext(1, Math.ceil((b - a) * R / sr), R);
  const src = off.createBuffer(1, b - a, sr); src.getChannelData(0).set(d.subarray(a, b));
  const s = off.createBufferSource(); s.buffer = src; s.connect(off.destination); s.start();
  const out = await off.startRendering(), x = out.getChannelData(0), g = 0.9 / peak, fd = Math.round(R * 0.01);
  for (let i = 0; i < x.length; i++) { let v = x[i] * g; if (i < fd) v *= i / fd; if (i > x.length - fd) v *= (x.length - i) / fd; x[i] = Math.max(-1, Math.min(1, v)); }
  const n = x.length, w = new DataView(new ArrayBuffer(44 + n * 2)), str = (o, t) => { for (let i = 0; i < t.length; i++) w.setUint8(o + i, t.charCodeAt(i)); };
  str(0, "RIFF"); w.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt "); w.setUint32(16, 16, true); w.setUint16(20, 1, true); w.setUint16(22, 1, true);
  w.setUint32(24, R, true); w.setUint32(28, R * 2, true); w.setUint16(32, 2, true); w.setUint16(34, 16, true); str(36, "data"); w.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) w.setInt16(44 + i * 2, x[i] * 32767, true);
  const u8 = new Uint8Array(w.buffer); let bin = ""; for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
  return {b64:btoa(bin), buf:out, sec:n / R};
}
function show(t) {
