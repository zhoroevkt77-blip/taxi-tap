<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<title>Такси ТАП!</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#17365C;--navy2:#1E4574;--gold:#C9A03A;--gold2:#E3C368;--ink:#152741;--soft:#5A6880;
--paper:#F1F4F9;--line:#E1E7F1;--ok:#1D9E75;--bad:#D8443A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
#map{position:fixed;inset:0;z-index:1}
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.logo{pointer-events:auto;background:var(--navy);color:#fff;font-weight:800;font-size:16px;padding:10px 14px;border-radius:14px;letter-spacing:.2px}
.logo b{color:var(--gold2)}
.round{pointer-events:auto;width:46px;height:46px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(20,20,30,.15);display:grid;place-items:center;font-size:20px;cursor:pointer}
.pin{position:fixed;left:50%;top:calc(42% - 46px);transform:translateX(-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.pin.up{transform:translate(-50%,-10px)}
.chip{background:#fff;border-radius:16px;padding:9px 14px;box-shadow:0 4px 16px rgba(20,20,30,.15);margin-bottom:8px;max-width:78vw;text-align:center}
.chip small{display:block;color:var(--gold);font-size:13px;font-weight:600}
.chip span{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.head{width:40px;height:40px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.head:after{content:"";width:14px;height:14px;border-radius:50%;background:#fff}
.head.to{background:var(--gold)}
.stick{width:4px;height:20px;background:var(--navy);border-radius:2px}
.stick.to{background:var(--gold)}
.dot{width:6px;height:3px;border-radius:50%;background:rgba(0,0,0,.25)}
.locate{position:fixed;right:14px;z-index:5}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(20,20,30,.12);max-height:82vh;overflow:auto}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
h2{font-size:20px;margin:2px 0 12px}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:14px;padding:14px;font-size:17px;color:var(--soft);cursor:pointer;border:0;width:100%;text-align:left}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.bul{width:10px;height:10px;border-radius:50%;background:var(--navy);flex:none}
.bul.to{background:var(--gold)}
.muted{color:var(--soft);font-size:13px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.main{background:var(--gold);color:#16161a}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.5}
input.f{width:100%;font-size:17px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--paper);margin-bottom:10px;outline:none;color:var(--ink)}
input.f:focus{border-color:var(--navy)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.tariff{border:2px solid var(--gold);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:#fff8e6}
.price{font-size:26px;font-weight:800}
.res{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.res b{display:block;font-size:15px}
.car{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:16px;padding:12px;margin-top:6px}
.plate{border:2px solid var(--ink);border-radius:6px;padding:2px 8px;font-weight:800;font-size:15px;letter-spacing:.5px;background:#fff}
.av{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.pulse{width:64px;height:64px;border-radius:50%;background:var(--gold);margin:8px auto 14px;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,183,3,.5)}100%{box-shadow:0 0 0 26px rgba(255,183,3,0)}}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.stars{display:flex;justify-content:center;gap:6px;font-size:38px;margin:10px 0}
.stars span{cursor:pointer;color:var(--line)}
.stars span.on{color:var(--gold)}
.two{display:flex;gap:10px}.two .btn{margin-top:10px}
.carm{width:30px;height:30px;border-radius:50%;background:var(--navy);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:15px}
.carm.mine{background:var(--gold);color:#16161a}
.hide{display:none!important}
.ab{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:6px}
.abr{display:flex;align-items:center;gap:10px;padding:2px 12px}
.abr+.abr{border-top:1px solid var(--line)}
.abr.on{background:#fff8e6}
.ai{flex:1;border:0;outline:0;background:transparent;font-size:16px;padding:12px 0;color:var(--ink);font-weight:600;min-width:0}
.res{display:flex;gap:10px;align-items:center}
.res .ri{font-size:20px;width:26px;text-align:center;flex:none}
.res .muted{display:block}
.abb{width:100%;border:0;background:#fff;cursor:pointer;text-align:left;padding:8px 12px!important;font:inherit;color:var(--ink)}
.abl{flex:1;min-width:0;display:flex;flex-direction:column}
.abl small{font-size:12px;color:var(--soft);font-weight:600}
.abl b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abl b.ph{color:var(--soft);font-weight:600}
.abe{flex:none;font-size:16px}
.mapb{flex:none;border:1px solid #e6e6eb;background:#fff;border-radius:12px;padding:5px 8px;font-size:11.5px;line-height:1.15;text-align:center;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(20,20,30,.12)}
.mapb:active{transform:scale(.96)}
.fromrow{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:10px 4px 2px;font-size:14px;cursor:pointer;text-align:left;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fromrow b{overflow:hidden;text-overflow:ellipsis}
.hn{width:70px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;text-align:center;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 2px;padding-bottom:2px}
.chips button{flex:none;border:0;background:var(--paper);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.cls>div{flex:1 0 92px;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;background:#fff}
.cls>div.on{border-color:var(--gold);background:#fff8e6}
.cls b{display:block;font-size:18px;margin-top:2px}
.cls i{font-style:normal;font-size:22px}
.wbox{background:#fff8e6;border-radius:14px;padding:12px;margin-top:8px;font-size:14px}
.chatb{position:relative}
.chatb em{position:absolute;top:6px;right:10px;background:var(--bad);color:#fff;border-radius:10px;font-style:normal;font-size:12px;padding:1px 7px}
.msgs{max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.msgs div{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--paper);font-size:15px;align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.msgs div.me{align-self:flex-end;background:var(--navy);color:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 10px;font-size:13px;cursor:pointer}
</style>
<link rel="stylesheet" href="/static/theme.css?v=17">
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="lcol"><div class="logo"><img src="/static/icon-192.png" alt="">Такси <b>ТАП!</b></div>
    <div class="role"><a class="on">🧳 Жүргүнчүмүн</a><a href="/driver">🚗 Айдоочумун</a></div></div>
  <button class="round" id="menuBtn" aria-label="Кабинет">👤</button>
</div>

<div class="pin" id="pin">
  <div class="chip" id="chip"><small id="chipEta"></small><span id="chipAddr">Дарек аныкталууда…</span></div>
  <div class="head" id="pinHead"></div><div class="stick" id="pinStick"></div><div class="dot"></div>
</div>


<div class="sheet" id="sheet"><div class="grab"></div><div id="view"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/area.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {credentials:"same-origin"} :
    {method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json();
};

const S = { cls:"econom", seen:0, mode:"boot", from:null, fromAddr:"", to:null, toAddr:"", ride:null, quote:null, near:null, timer:null };
const map = L.map("map", {zoomControl:false, attributionControl:true}).setView([41.0377, 72.7470], 15);
const areaReady = setupArea(map, {zoom:15});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);

const icon = (cls, txt) => L.divIcon({className:"", html:`<div class="carm ${cls}">${txt}</div>`, iconSize:[30,30], iconAnchor:[15,15]});
let nearLayer = L.layerGroup().addTo(map), rideLayer = L.layerGroup().addTo(map), driverMarker = null;
const aLayer = L.layerGroup().addTo(map);
// Б точканы тандап жатканда А точка картада кара белги болуп турат
function showA(on) { aLayer.clearLayers(); if (on && S.from) L.marker(S.from, {icon:icon("", "А"), interactive:false}).addTo(aLayer); }

// ---------- геокоддоо (OpenStreetMap Nominatim) ----------
let revSeq = 0;
async function reverse(lat, lon) {
  const my = ++revSeq;
  try {
    const x = await (await fetch(`/api/rev?lat=${lat}&lon=${lon}`)).json();
    if (my !== revSeq) return null;
    if (x && (x.addr || x.near)) return x.addr ? (x.near ? `${x.addr} (${x.near} жанында)` : x.addr) : `${x.near} жанында`;
  } catch (e) {}
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&accept-language=ky,ru`);
    const j = await r.json();
    if (my !== revSeq) return null;
    const a = j.address || {};
    const street = a.road || a.pedestrian || a.neighbourhood || a.suburb || "";
    return (street ? street + (a.house_number ? " " + a.house_number : "") : (j.display_name || "").split(",")[0]) || "Картадагы чекит";
  } catch (e) { return "Картадагы чекит"; }
}
// ---------- пин жана карта ----------
let moveTimer = null;
map.on("movestart", () => { if (pinActive()) $("#pin").classList.add("up"); });
map.on("moveend", () => {
  $("#pin").classList.remove("up");
  if (!pinActive()) return;
  clearTimeout(moveTimer);
  moveTimer = setTimeout(onPinMoved, 250);
});
const pinActive = () => S.mode === "idle" || S.mode === "pickDest" || S.mode === "pickFrom";
// Картаны басса — пин ошол жерге барат (жылдырбай эле тандаса болот)
map.on("click", e => {
  if (S.mode === "search") return;
  if (pinActive()) map.panTo(e.latlng);
});
async function onPinMoved() {
  const c = map.getCenter();
  if (S.mode === "idle" && S.fromLock) {           // дарек тизмеден тандалган — өз атын сактайбыз
    S.fromLock = false; $("#chipAddr").textContent = S.fromAddr; if ($("#fromTxt")) $("#fromTxt").textContent = S.fromAddr; loadNear(); return;
  }
  $("#chipAddr").textContent = "…";
  const addr = await reverse(c.lat, c.lng);
  if (addr === null) return;
  $("#chipAddr").textContent = addr;
  if (S.mode === "idle" || S.mode === "pickFrom") { S.from = [c.lat, c.lng]; S.fromAddr = addr; loadNear(); if ($("#fromTxt")) $("#fromTxt").textContent = addr; }
  else { S.to = [c.lat, c.lng]; S.toAddr = addr; }
}
async function loadNear() {
  if (!S.from) return;
  const n = await api(`/api/near?lat=${S.from[0]}&lon=${S.from[1]}`);
  S.near = n;
  nearLayer.clearLayers();
  (n.drivers || []).forEach(p => L.marker(p, {icon:icon("", "🚕"), interactive:false}).addTo(nearLayer));
  $("#chipEta").textContent = n.city && n.eta_min ? `🚕 ${n.eta_min} мүн` : "";
  S.nearMsg = !n.city ? `📍 Биз ${(window.AREA && AREA.name) || "бул аймакта"} гана иштейбиз` : n.eta_min ? "" : "Азыр жакын арада бош айдоочу жок — заказ берсеңиз, табылганда кабар беребиз";
  if ($("#nearMsg")) $("#nearMsg").textContent = S.nearMsg;
}
function setPin(kind) {
  const show = kind !== null;
  $("#pin").classList.toggle("hide", !show);
  $("#pinHead").classList.toggle("to", kind === "to");
  $("#pinStick").classList.toggle("to", kind === "to");
}
NAV.init(map, {onLocate: () => locate(true)});
function locate(force) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    NAV.set(ll, p.coords.heading, p.coords.speed);
    S.gpsBad = p.coords.accuracy > 60 ? Math.round(p.coords.accuracy) : 0;
    if (!inArea(ll[0], ll[1])) {               // аймактан сырткары — карта борборунда калат
      if (force) $("#chipEta").textContent = `Сиз ${window.AREA && AREA.name ? AREA.name + " районунун" : "аймактын"} сыртындасыз`;
      return;
    }
    if (force || S.mode === "idle") map.setView(ll, S.gpsBad ? 17 : 16);
    if (S.gpsBad && (S.mode === "idle")) toast(`📡 GPS так эмес (±${S.gpsBad} м). Картаны жылдырып, А пинди так турган жериңизге коюңуз.`);
  }, () => {}, {enableHighAccuracy:true, timeout:8000});
}

// ---------- көрүнүштөр ----------
function render(html) { $("#view").innerHTML = html; window.SHEET && SHEET.refresh(); positionLocate(); }
window.addEventListener("sheetmove", () => positionLocate());
function positionLocate() {
  requestAnimationFrame(() => NAV.place());
}

function viewLogin(pending, link) {
  S.mode = "login"; setPin(null);
  if (pending) {
    render(`<h2>Номериңизди ырастаңыз</h2>
      <p class="muted">Telegram'да ботко өтүп, «Номеримди жөнөтүү» баскычын басыңыз. Анан ушул бетке кайтыңыз.</p>
      ${link ? `<a href="${esc(link)}" target="_blank"><button class="btn dark">Telegram'да ырастоо</button></a>` : `<p class="err">Бот туташа элек.</p>`}
      <button class="btn ghost" id="relog">Башка номер</button>`);
    $("#relog").onclick = () => viewLogin(false);
    pollMe();
    return;
  }
  render(`<h2>Кош келиңиз!</h2>
    <input class="f" id="nm" placeholder="Атыңыз" autocomplete="given-name">
    <input class="f" id="ph" placeholder="0700 123 456" inputmode="tel" autocomplete="tel">
    <div class="err" id="er"></div>
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--soft);margin:2px 0 6px">
      <input type="checkbox" id="agree" style="width:20px;height:20px;flex:none;margin-top:1px">
      <span><a href="/terms" target="_blank" style="color:var(--navy)">Колдонуу шарттары жана купуялык саясаты</a> менен макулмун</span></label>
    <button class="btn main" id="go">Кирүү</button>`);
  $("#ph").oninput = () => $("#er").textContent = "";
  $("#go").onclick = async () => {
    if (!$("#agree").checked) { $("#er").textContent = "Шарттар менен макул экениңизди белгилеңиз."; return; }
    const r = await api("/api/login", {name:$("#nm").value, phone:$("#ph").value, agree:true});
    if (r.error) { $("#er").textContent = "Номерди толук жазыңыз: 0700 123 456"; return; }
    r.auth ? boot() : viewLogin(true, r.link);
  };
}
let mePoll = null;
function pollMe() {
  clearInterval(mePoll);
  mePoll = setInterval(async () => { const m = await api("/api/me"); if (m.auth) { clearInterval(mePoll); boot(); } }, 2500);
}

function viewIdle() {
  S.mode = "idle"; S.to = null; S.quote = null; S.hnT = ""; S.lmT = ""; setPin("from"); showA(false);
  rideLayer.clearLayers(); driverMarker = null;
  render(`<div class="ab">
      <div class="abr abb" id="fromRow"><span class="bul lt">А</span><span class="abl"><small>А точка · каяктан <i class="chk" id="chkA">✓ тандалды</i></small><b id="fromTxt">${esc(S.fromAddr || "…")}</b></span><button class="mapb" id="mapA">🗺 Картадан<br>белгиле</button></div>
      <div class="abr abb need" id="where"><span class="bul to lt">Б</span><span class="abl"><small>Б точка · каякка <i class="hint">— тандаңыз 👆</i></small><b class="ph">Каякка барасыз?</b></span><button class="mapb" id="mapB">🗺 Картадан<br>белгиле</button></div>
    </div>
    <div class="chips" id="places"></div><p class="muted" id="nearMsg" style="margin:4px 2px 0;font-size:13px">${esc(S.nearMsg || "")}</p>`);
  loadPlaces();
  $("#where").onclick = () => viewSearch("to");
  $("#fromRow").onclick = () => viewSearch("from");
  $("#mapA").onclick = e => { e.stopPropagation(); viewPickFrom(); };
  $("#mapB").onclick = e => { e.stopPropagation(); viewPickDest(); };
  onPinMoved();
}

// ---------- сакталган даректер ----------
let PLACES = null;
async function loadPlaces(force) {
  if (!PLACES || force) PLACES = await api("/api/places");
  const box = $("#places"); if (!box || PLACES.error) return;
  const P = PLACES, btn = (k, t) => `<button data-k="${k}">${t}</button>`;
  box.innerHTML = btn("home", P.home ? "🏠 Үй" : "🏠 Үйдү кошуу") + btn("work", P.work ? "💼 Иш" : "💼 Ишти кошуу")
    + P.recent.map((r, i) => btn("r" + i, "🕘 " + esc(r.name))).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k[0] === "r") { const r = P.recent[+k.slice(1)]; S.to = [r.lat, r.lon]; S.toAddr = r.name; picked("Б"); return viewQuote(); }
    if (P[k]) { S.to = [P[k].lat, P[k].lon]; S.toAddr = k === "home" ? "Үй" : "Иш"; picked("Б"); return viewQuote(); }
    viewPickDest(k);
  });
  // басып туруу → өчүрүү
  box.querySelectorAll("[data-k=home],[data-k=work]").forEach(b => b.oncontextmenu = async e => {
    e.preventDefault(); const k = b.dataset.k;
    if (PLACES[k] && confirm((k === "home" ? "Үй" : "Иш") + " дарегин өчүрөсүзбү?")) { PLACES = await api("/api/place", {kind:k}); loadPlaces(); }
  });
}

// ---------- Кайдан → Кайда (колу менен жазуу, даректер тизмесинен) ----------
function viewSearch(field) {
  S.mode = "search";
  let act = field === "from" ? "from" : "to";
  render(`<div class="ab">
      <div class="abr${S.from ? " got" : ""}" id="rf"><span class="bul lt">А</span><input class="ai" id="qf" placeholder="А точка — каяктан" autocomplete="off" value="${esc(S.fromAddr || "")}"><button class="mapb" id="mapA">🗺 Картадан<br>белгиле</button></div>
      <div class="abr${S.to ? " got" : " need"}" id="rt"><span class="bul to lt">Б</span><input class="ai" id="qt" placeholder="Б точка — каякка?" autocomplete="off" value="${S.to ? esc(S.toAddr) : ""}"><button class="mapb" id="mapB">🗺 Картадан<br>белгиле</button></div>
    </div>
    <div id="list"></div>
    <button class="btn ghost" id="back">Артка</button>`);
  const inp = {from:$("#qf"), to:$("#qt")};
  const focus = k => { act = k; $("#rf").classList.toggle("on", k === "from"); $("#rt").classList.toggle("on", k === "to");
    setPin(k === "from" ? "from" : "to"); showA(k === "to"); run(); };
  inp.from.onfocus = () => { inp.from.select(); focus("from"); };
  inp.to.onfocus = () => focus("to");
  $("#mapA").onclick = () => viewPickFrom();
  $("#mapB").onclick = () => { S.pendName = inp.to.value.trim(); viewPickDest(); };
  $("#back").onclick = viewIdle;
  let t = null, seq = 0;
  const choose = r => {
    if (act === "from") {
      S.from = [r.lat, r.lon]; S.fromAddr = r.name; S.fromLock = true; map.setView(S.from, 16);
      inp.from.value = r.name; $("#rf").classList.add("got"); picked("А");
      if (S.to) return viewQuote();
      inp.to.focus(); return;
    }
    S.to = [r.lat, r.lon]; S.toAddr = r.name; picked("Б"); viewQuote();
  };
  function run() {
    clearTimeout(t);
    t = setTimeout(async () => {
      const my = ++seq, q = inp[act].value.trim();
      const P = PLACES && !PLACES.error ? PLACES : {recent:[]};
      let quick = [];
      if (act === "from") quick.push({icon:"📍", name:"Менин жерим", area:"GPS / картадагы пин", gps:true});
      if (P.home) quick.push({icon:"🏠", name:"Үй", area:P.home.name || "", lat:P.home.lat, lon:P.home.lon});
      if (P.work) quick.push({icon:"💼", name:"Иш", area:P.work.name || "", lat:P.work.lat, lon:P.work.lon});
      (P.recent || []).forEach(r => quick.push({icon:"🕘", name:r.name, area:"Акыркы сапар", lat:r.lat, lon:r.lon}));
      if (act === "to") (P.popular || []).forEach(r => { if (!quick.some(x => x.name === r.name)) quick.push(r); });
      let items = [];
      if (q.length >= 2 && !(act === "from" && q === S.fromAddr)) {
        const near = S.from || [map.getCenter().lat, map.getCenter().lng];
        const x = await api(`/api/addr?q=${encodeURIComponent(q)}&lat=${near[0]}&lon=${near[1]}`);
        if (my !== seq) return;
        items = x.items || [];
        quick = quick.filter(r => !r.gps && (r.name + " " + r.area).toLowerCase().includes(q.toLowerCase()));
      }
      const all = quick.concat(items);
      $("#list").innerHTML = all.length ? all.map((r, i) =>
        `<div class="res" data-i="${i}"><span class="ri">${r.icon}</span><div><b>${esc(r.name)}</b>${r.area ? `<span class="muted">${esc(r.area)}</span>` : ""}</div></div>`).join("")
        : q.length >= 2 ? `<p class="muted">«${esc(q)}» табылган жок. Башкача жазып көрүңүз (мис. көчөнүн атын гана) же «Картадан белгилөө» басыңыз.</p>` : "";
      $("#list").querySelectorAll(".res").forEach(el => el.onclick = () => {
        const r = all[+el.dataset.i];
        if (r.gps) { S.fromLock = false; inp.from.value = S.fromAddr; return S.to ? viewQuote() : inp.to.focus(); }
        choose(r);
      });
    }, 200);
  }
  inp.from.oninput = inp.to.oninput = run;
  (act === "from" ? inp.from : inp.to).focus();
}

// Точка тандалганда: кыска дирилдөө + 1,5 сек кабар
function picked(w) { try { navigator.vibrate && navigator.vibrate(35); } catch (e) {} toast(`✓ ${w} точка тандалды`, 1500); }
const withHn = (a, h) => (h = (h || "").trim()) ? `${a}, ${h}` : a;
const withLm = (a, m) => (m = (m || "").trim()) ? `${a} — ${m}` : a;
function alertBox(t) { const e = document.createElement("p"); e.className = "err"; e.textContent = t; $("#view").appendChild(e); }

// А → Б маршруту: адегенде түз сызык (дароо), анан жол боюнча (сервер OSRM'ден алат)
let routeLine = null, routeSeq = 0;
function drawRoute(coords, fetchIt = true) {
  rideLayer.clearLayers(); nearLayer.clearLayers(); driverMarker = null; routeLine = null;
  const a = S.ride ? [S.ride.p_lat, S.ride.p_lon] : S.from;
  const b = S.ride ? (S.ride.d_lat != null ? [S.ride.d_lat, S.ride.d_lon] : null) : S.to;
  L.marker(a, {icon:icon("", "А"), interactive:false}).addTo(rideLayer);
  if (!b) { map.setView(a, 16); return; }
  L.marker(b, {icon:icon("mine", "Б"), interactive:false}).addTo(rideLayer);
  const show = pts => {
    if (routeLine) routeLine.remove();
    const real = pts && pts.length > 2;
    routeLine = L.polyline(real ? pts : [a, b], real ? {color:"#17365C", weight:5, opacity:.85}
                                                    : {color:"#17365C", weight:4, dashArray:"6 8"}).addTo(rideLayer);
    map.fitBounds(L.latLngBounds(real ? pts : [a, b]), {paddingTopLeft:[40, 90], paddingBottomRight:[40, 340]});
  };
  if (coords) return show(coords);
  show(null);
  if (!fetchIt) return;
  const my = ++routeSeq;
  api(`/api/route?a=${a[0]},${a[1]}&b=${b[0]},${b[1]}`).then(r => { if (my === routeSeq && r.coords) show(r.coords); });
}

// ---------- сапар ----------
function poll() {
  clearInterval(S.timer);
  S.timer = setInterval(async () => {
    const r = await api("/api/ride");
    if (!r.ride) return;
    const changed = !S.ride || r.ride.status !== S.ride.status || !!r.ride.chained !== !!S.ride.chained;
    S.ride = r.ride; updateDriver();
    const live = ["accepted", "arrived", "in_trip"].includes(r.ride.status);
    if (changed && window.SHEET) SHEET.expand();
    if (changed && (S.mode !== "chat" || !live)) viewRide(); else tickRide();
  }, 2000);
}
function updateDriver() {
  const d = S.ride && S.ride.driver;
  if (d && d.pos) {
    if (!driverMarker) driverMarker = L.marker(d.pos, {icon:icon("mine", "🚕"), interactive:false}).addTo(rideLayer);
    else driverMarker.setLatLng(d.pos);
  }
}
function tickRide() {
  const r = S.ride;
  if (r.status === "searching" && $("#bar")) {
    $("#bar").style.width = Math.min(100, 100 * r.search_sec / r.search_max) + "%";
  }
  if (r.status === "accepted" && $("#eta") && r.driver) $("#eta").textContent = etaText(r);
  if (r.status === "arrived" && $("#wt")) $("#wt").innerHTML = waitText(r);
  const n = (r.msgs || []).filter(m => !m.me).length, unread = n - (S.seen || 0);
  if ($("#chatN")) $("#chatN").textContent = unread > 0 ? unread : "", $("#chatN") && $("#chatN").classList.toggle("hide", unread <= 0);
  if (S.mode === "chat") { drawMsgs(); S.seen = n; }
}
function etaText(r) {
  const m = r.driver.eta_min;
  return r.chained ? `Айдоочу азыркы сапарын бүтүрүп келет${m ? " · ~" + m + " мүн" : ""}` : m ? `${m} мүнөттө келет` : "Айдоочу жолдо";
}
function waitText(r) {
  const w = r.wait; if (!w.arrived_at) return "";
  const skew = Date.now() / 1000 - w.now, left = Math.round(w.arrived_at + w.free_min * 60 - (Date.now() / 1000 - skew));
  if (left > 0) return `⏳ Акысыз күтүү: <b>${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}</b>`;
  return `⏳ Акылуу күтүү: <b>+${w.fee} сом</b> (${w.per_min} с/мүн)`;
}
setInterval(() => { if (S.ride && S.ride.status === "arrived" && $("#wt")) $("#wt").innerHTML = waitText(S.ride); }, 1000);
function rideBtns() {

}
function bindRideBtns() {

    else { try { await navigator.clipboard.writeText(x.url); } catch (e) {} alertBox("Шилтеме көчүрүлдү: " + x.url); }

function drawMsgs() {
  const box = $("#msgs"); if (!box) return;
  const ms = S.ride.msgs || [];
  box.innerHTML = ms.length ? ms.map(m => `<div class="${m.me ? "me" : ""}">${esc(m.text)}</div>`).join("") : `<p class="muted">Айдоочуга жазыңыз — номериңизди көрсөтпөй эле.</p>`;
  box.scrollTop = box.scrollHeight;

function viewChat() {
  S.mode = "chat";
  render(`<h2>💬 Айдоочу менен чат</h2><div class="msgs" id="msgs"></div>
    <div class="quick" id="qk">${["Чыгып жатам", "5 мүнөт күтүңүз", "Кайдасыз?", "Дарбазанын алдындамын"].map(t => `<button>${t}</button>`).join("")}</div>
    <div class="two"><input class="f" id="mt" placeholder="Билдирүү…" maxlength="300" style="margin:0"><button class="btn main" id="ms" style="margin:0;flex:0 0 90px">➤</button></div>
    <button class="btn ghost" id="back">Артка</button>`);
  S.seen = (S.ride.msgs || []).filter(m => !m.me).length;
  drawMsgs();
  const send = async t => { t = (t || "").trim(); if (!t) return; $("#mt").value = "";
    const x = await api("/api/msg", {text:t}); if (x.ride) { S.ride = x.ride; drawMsgs(); } };
  $("#ms").onclick = () => send($("#mt").value);
  $("#mt").onkeydown = e => { if (e.key === "Enter") send($("#mt").value); };
  $("#qk").querySelectorAll("button").forEach(b => b.onclick = () => send(b.textContent));
  $("#back").onclick = () => viewRide();

function carCard(d) {
  return `<div class="car"><div class="av">${esc((d.name || "?")[0])}</div>
    <div style="flex:1"><b>${esc(d.color)} ${esc(d.car)}</b><div class="muted">${esc(d.name)} · ★ ${d.rating ?? "5.0"}</div></div>
    <span class="plate">${esc(d.plate)}</span></div>
    <div class="two"><a href="tel:${esc(d.phone)}" style="flex:1"><button class="btn ghost">📞 Чалуу</button></a></div>`;
}
function viewRide() {
  const r = S.ride; S.mode = "ride"; setPin(null);
  if (!rideLayer.getLayers().length) drawRoute();
  updateDriver();
  const cancelBtn = `<button class="btn ghost" id="cx">Заказды жокко чыгаруу</button>`;
  if (r.status === "scheduled") {
    const t = new Date(r.scheduled_at * 1000);
    render(`<h2>🕐 Алдын ала заказ</h2>
      <p class="price" style="margin:4px 0">${t.toLocaleDateString("ru-RU", {day:"numeric", month:"long"})}, ${t.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"})}</p>
      <p class="muted">Убактысынан 10 мүнөт мурун айдоочу изделе баштайт. Айдоочу табылганда кабар келет.</p>${cancelBtn}`);
  } else if (r.status === "searching") {
    render(`<div class="pulse"></div><h2 style="text-align:center">Айдоочу изделүүдө</h2>
      <div class="bar"><i id="bar" style="width:0"></i></div>
      <p class="muted" style="text-align:center">Эң жакынкы айдоочуга сунуш кетти</p>${cancelBtn}`);
  } else if (r.status === "accepted") {
    render(`<h2 id="eta">${etaText(r)}</h2>${carCard(r.driver)}${rideBtns()}${cancelBtn}`);
  } else if (r.status === "arrived") {
    render(`<h2>Айдоочу күтүп турат</h2><div class="wbox" id="wt">${waitText(r)}</div>${carCard(r.driver)}${rideBtns()}${cancelBtn}`);
  } else if (r.status === "in_trip") {
    render(`<h2>Жолдо</h2><p class="muted">Жолуңуз ачык болсун!${r.wait.fee ? ` Күтүү: +${r.wait.fee} сом.` : ""}</p>${carCard(r.driver)}${rideBtns()}`);
  } else if (r.status === "completed") {
    clearInterval(S.timer);
    render(`<h2 style="text-align:center">Келдиңиз!</h2>
      <p class="price" style="text-align:center;margin:4px 0">${r.pay ? r.pay + " сом" : "Тариф боюнча"}</p>
      ${r.discount ? `<p class="muted" style="text-align:center">🎁 Промокод: −${Math.round(r.discount)} сом</p>` : ""}
      ${r.wait.fee ? `<p class="muted" style="text-align:center">⏳ Күтүү: +${r.wait.fee} сом (баада бар)</p>` : ""}
      ${r.rated ? "" : `<p class="muted" style="text-align:center">Айдоочуну баалаңыз</p><div class="stars" id="stars">${[1,2,3,4,5].map(n => `<span data-n="${n}">★</span>`).join("")}</div>`}
      <button class="btn main" id="again">Даяр</button>`);
    $("#stars") && $("#stars").querySelectorAll("span").forEach(s => s.onclick = async () => {
      const n = +s.dataset.n;
      $("#stars").querySelectorAll("span").forEach(x => x.classList.toggle("on", +x.dataset.n <= n));
      await api("/api/rate", {id:r.id, stars:n});
    });
    $("#again").onclick = () => { S.ride = null; S.seen = 0; loadPlaces(true); viewIdle(); };
  } else if (r.status === "cancelled") {
    clearInterval(S.timer);
    const why = r.cancel_by === "system" ? "Азыр бош айдоочу табылган жок. Бир аздан кийин кайра аракет кылыңыз."
      : r.cancel_by && r.cancel_by.startsWith("ph:") ? "Заказ жокко чыгарылды." : "Айдоочу заказды жокко чыгарды.";
    render(`<h2>Заказ жабылды</h2><p class="muted">${why}</p><button class="btn main" id="again">Кайра чакыруу</button>`);
    $("#again").onclick = () => { S.ride = null; map.setView([r.p_lat, r.p_lon], 16); viewIdle(); };
  }
  const cx = $("#cx");
  if (cx) cx.onclick = async () => { cx.disabled = true; const x = await api("/api/cancel", {}); if (x.ride) { S.ride = x.ride; viewRide(); } };
  bindRideBtns();
  tickRide();
}

let prevView = null;
$("#menuBtn").onclick = () => viewCabinet();
async function viewCabinet() {
  if (S.mode === "login" || S.mode === "menu") return;
  const me = await api("/api/me");
  if (!me.auth) return;
  prevView = S.mode; S.mode = "menu";
  const drv = {active:"Айдоочу кабинети", pending:"Арызыңыз текшерилүүдө", rejected:"Арызды оңдоо", blocked:"Айдоочу кабинети"}[me.driver] || "Айдоочу болуу";
  const P = PLACES && !PLACES.error ? PLACES : await api("/api/places");
  const place = (k, ico, t) => `<div class="hrow"><span>${ico} <b>${t}</b> ${P[k] ? `<span class="muted">· ${esc(P[k].name || "белгиленген")}</span>` : `<span class="muted">· белгилене элек</span>`}</span>
    <span><button class="lnk-b" style="width:auto;height:32px;padding:0 10px;font-size:13px" data-pl="${k}">${P[k] ? "Өзгөртүү" : "Кошуу"}</button>${P[k] ? ` <button class="lnk-b" style="width:32px;height:32px;font-size:13px" data-del="${k}">✕</button>` : ""}</span></div>`;
  render(`<h2>💼 Менин кабинетим</h2>
    <div class="car"><div class="av">${esc((me.name || "?")[0].toUpperCase())}</div><div style="flex:1"><b>${esc(me.name || "Жүргүнчү")}</b><div class="muted">${esc(me.phone)}</div></div></div>
    ${linksHTML(me.bot)}
    <div class="lnks"><h3 style="margin:4px 0 4px">📍 Даректерим</h3>${place("home", "🏠", "Үй")}${place("work", "💼", "Иш")}</div>
    <div class="lnks"><h3 style="margin:4px 0 4px">🕘 Сапарларым</h3><div id="hist"><p class="muted">Жүктөлүүдө…</p></div></div>
    <div class="row" style="justify-content:space-between"><div><b>Telegram билдирүүлөрү</b><div class="muted">${me.tg ? "Айдоочу табылганда, келгенде кабар берет" : "Telegram туташкан эмес"}</div></div>
    ${me.tg ? `<input type="checkbox" id="nt" ${me.notify ? "checked" : ""} style="width:24px;height:24px">` : ""}</div>
    <a href="/driver"><button class="btn ghost">🚗 ${drv}</button></a>
    ${me.admin ? `<a href="/admin"><button class="btn ghost">🛠 Админ панели</button></a>` : ""}
    <a href="/terms"><button class="btn ghost">📄 Колдонуу шарттары</button></a>
    ${installHTML()}<button class="btn ghost" id="out">Чыгуу</button><button class="btn main" id="close">Жабуу</button>`);
  if (window.SHEET) SHEET.expand();
  bindInstall(); bindLinks();
  document.querySelectorAll("[data-pl]").forEach(b => b.onclick = () => viewPickDest(b.dataset.pl));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Өчүрөсүзбү?")) return; PLACES = await api("/api/place", {kind:b.dataset.del}); S.mode = prevView; viewCabinet(); });
  const nt = $("#nt"); if (nt) nt.onchange = () => api("/api/notify", {on:nt.checked});
  $("#out").onclick = async () => { await api("/api/logout", {}); location.reload(); };
  $("#close").onclick = () => { S.ride ? viewRide() : viewIdle(); };
  const H = await api("/api/history");
  const ST = {completed:"✅", cancelled:"✕", searching:"⏳", scheduled:"🕐", accepted:"🚕", arrived:"🚕", in_trip:"🚕"};
  const box = $("#hist"); if (!box) return;
  const rows = (H.rides || []);
  box.innerHTML = rows.length ? rows.map(r => {
    const d = new Date(r.created_at * 1000), pay = r.price ? Math.max(0, r.price - Math.round(r.discount || 0)) + " с" : "";
    return `<div class="hrow"><span>${ST[r.status] || ""} ${d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit"})} · ${esc(r.d_addr || "сапар")}</span><b>${r.status === "cancelled" ? '<span class="muted">жокко чыкты</span>' : pay}</b></div>`;
  }).join("") : `<p class="muted">Азырынча сапар жок.</p>`;
}

async function boot() {
  const me = await api("/api/me");
  await areaReady;
  if (!me.auth) return viewLogin(me.pending, me.link);
  const r = await api("/api/ride");
  if (r.ride && ["scheduled", "searching", "accepted", "arrived", "in_trip"].includes(r.ride.status)) {
    S.ride = r.ride; drawRoute(); viewRide(); poll();
  } else { viewIdle(); locate(false); }
}
boot();
</script>
</body>
</html>
