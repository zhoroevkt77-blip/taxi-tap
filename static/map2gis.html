<!DOCTYPE html>
<html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSM vs 2ГИС — салыштыруу</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;font:15px/1.35 Inter,system-ui,sans-serif;background:#f4f4f6;color:#16161a}
.w{display:flex;flex-direction:column;height:100%}
.h{position:relative;flex:1;min-height:0;border-bottom:3px solid #ffc21a}
.h:last-child{border:0}
.m{position:absolute;inset:0}
.lb{position:absolute;left:10px;top:10px;z-index:1000;background:#16161a;color:#fff;font-weight:800;font-size:14px;padding:7px 12px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.lb small{display:block;font-weight:500;color:#c9c9d1;font-size:12px}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#fff8e6;z-index:999;font-size:14px}
.go{position:absolute;right:10px;top:10px;z-index:1000;display:flex;gap:6px}
.go button{border:0;border-radius:12px;padding:8px 10px;font:800 13px Inter,system-ui,sans-serif;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
</style></head><body>
<div class="w">
  <div class="h"><div class="m" id="a"></div><div class="lb">1. Азыркы (OSM)<small>бекер</small></div>
    <div class="go"><button data-p="40.9330,73.0110">Жалал-Абад</button><button data-p="41.0405,72.7460">Манас</button><button data-p="41.0390,72.7465,17">Базар-Коргон</button></div></div>
  <div class="h"><div class="m" id="b"></div><div class="lb">2. 2ГИС картасы<small>Raster Tiles API · 500 000 плитка / 3 500 ₽</small></div>
    <div class="msg" id="msg"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const C = [40.9330, 73.0110], Z = 16;
const a = L.map("a", {zoomControl:false}).setView(C, Z);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(a);
const b = L.map("b", {zoomControl:false}).setView(C, Z);
L.tileLayer("/tiles/2gis/{z}/{x}/{y}.png", {maxZoom:19, maxNativeZoom:18, attribution:"© 2ГИС"}).addTo(b);
fetch("/api/mapcfg").then(r => r.json()).then(c => { if (c.p !== "2gis") { const m = document.getElementById("msg"); m.innerHTML = "2ГИС картасы азыр өчүк — Railway'ге <b>DGIS_MAP_KEY</b> кошулганда көрүнөт.<br>(Азыр бул жерде да OSM көрүнүп турат.)"; m.style.display = "flex"; } });
let busy = false;
const sync = (x, y) => x.on("move", () => { if (busy) return; busy = true; y.setView(x.getCenter(), x.getZoom(), {animate:false}); busy = false; });
sync(a, b); sync(b, a);
document.querySelectorAll("[data-p]").forEach(x => x.onclick = () => { const q = x.dataset.p.split(",").map(Number); a.setView([q[0], q[1]], q[2] || 16); });
</script></body></html>
